  <main id="main"><noscript><h2>《兄弟》 · Reading Notes</h2><section class="story"><h3>Childhood and family</h3><article class="entry"><p class="page">p. 19</p><blockquote class="latin">Li Guangtou was still a poor boy. A bowl of three-delicacy noodles made him so happy he felt as if he had visited heaven. He enjoyed them fifty-six times in six months: fifty-six trips to heaven.</blockquote><div class="orig"><p>那时候的李光头还是个穷小子，有一碗三鲜面吃，他就美滋滋不知道天高地厚了，就像是到天堂里去逛了一次，他半年里美滋滋了五十六次，也就是去了天堂五十六次。</p></div></article><article class="entry"><p class="page">Upper part · ch. 2</p><blockquote class="latin">People who came asking about Lin Hong&#x27;s secret tried to fob Li Guangtou off with plain noodles. He would not accept that; he bargained patiently and always got three-delicacy noodles instead.</blockquote><div class="orig"><p>那些前来打探林红屁股秘密的人，都想拿一碗阳春面来糊弄他，李光头从不上当，他每次都是耐心细致地和人讨价还价，每次都吃到了三鲜面，而不是阳春面。</p></div></article><article class="entry"><p class="page">Upper part · ch. 2</p><blockquote class="latin">Zhao the Poet had spied on women in that toilet for a year without seeing Lin Hong. Li Guangtou passed through once and saw what Zhao had never managed to see.</blockquote><div class="orig"><p>赵诗人也经常在那个厕所里偷看女人屁股，那个厕所是赵诗人的地盘，可他偷看了一年都没看到林红的屁股；这个李光头也就是匆匆过客，在赵诗人的地盘上只偷看了一次，就看到了林红的屁股。</p></div></article><article class="entry"><p class="page">Upper part · ch. 3</p><blockquote class="latin">When Li Guangtou&#x27;s biological father fell headfirst into the cesspit, his future stepfather stood there in shock. He felt he had only blinked, and the two upturned legs had disappeared.</blockquote><div class="orig"><p>当李光头的亲生父亲一头栽进了粪池以后，他的继父站在那里惊魂未定，他觉得自己只是眨了一下眼睛，那两条跷起的腿一下子就没了。</p></div></article><article class="entry"><p class="page">Upper part · ch. 3</p><blockquote class="latin">Li Lan slowly slid down the doorframe. Pain crossed her blank face; she lay on the ground with her legs apart, fingers digging into the earth, sweat on her forehead, staring silently at the crowd.</blockquote><div class="orig"><p>这时候李兰的身体靠着门框慢慢滑了下去，她一直木然的脸上出现了痛苦的表情，她躺在了地上，她的两腿伸开了，她的十根手指像是要紧紧抓住大地似的插进了泥土之中，她的额上渗满了汗珠，她睁圆了眼睛无声无息地看着围观的人群。</p></div></article><article class="entry"><p class="page">Upper part · ch. 4</p><blockquote class="latin">By then nobody was pointing at them, or even looking at them. Yet Li Lan still felt every gaze nailed to her body.</blockquote><div class="orig"><p>其实那时候已经没有人对他们指指点点，甚至没有人来看他们一眼，李兰仍然觉得所有人的目光都像钉子似的钉在她的身上。</p></div></article><article class="entry"><p class="page">Upper part · ch. 4</p><blockquote class="latin">Li Lan stood a while, then took Li Guangtou&#x27;s hand again and went home without a sound.</blockquote><div class="orig"><p>李兰站了一会后，又拉起了李光头的手，悄无声息地走回家中。</p></div></article><article class="entry"><p class="page">p. 35</p><blockquote class="latin">In Li Guangtou&#x27;s memory, that was the first morning Li Lan raised her head in the street. She was looking for the funeral procession.</blockquote><div class="orig"><p>在李光头的记忆里，那天上午李兰第一次在大街上抬起头来了，她是在张望着出殡的队伍。</p></div></article><article class="entry"><p class="page">p. 37</p><blockquote class="latin">People stood shoulder to shoulder on the wall, packed so tightly there was scarcely a gap, while more kept trying to climb up.</blockquote><div class="orig"><p>他们站在围墙上已经人挨着人了，已经挤得连缝都快没有了，下面的人还要往上爬。</p></div></article><article class="entry"><p class="page">Upper part · ch. 5</p><blockquote class="latin">Before more than a thousand onlookers, he lifted Li Lan into the air. Laughter swept through the floodlit basketball court: loud, faint, shrill, leering, foolish, and every kind in between.</blockquote><div class="orig"><p>一千多个人看着呢，他竟然把李兰举了起来，灯光球场里的笑声哗啦哗啦地响起来，大笑、微笑、尖笑、细笑、淫笑、奸笑、傻笑、干笑、湿笑和皮笑肉不笑，林子大了什么鸟都有，人多了也是什么笑声都有。</p></div></article><article class="entry"><p class="page">Upper part · ch. 5</p><blockquote class="latin">They talked and pointed, remembering the man who had died after spying on women in the toilet. At last they thought they understood: this woman had got together with that man.</blockquote><div class="orig"><p>他们议论纷纷，他们重新想起了那个在厕所里偷看女人屁股丢掉了性命的男人，他们指指点点，他们恍然大悟地说原来这个女人跟这个男人搞上了。</p></div></article><article class="entry"><p class="page">Upper part · ch. 6</p><blockquote class="latin">Three schoolboys lived among the neighbors. One, Sun Wei, had long hair. The other two were Liu Chenggong and Zhao Shengli, later Liu Town&#x27;s two celebrated men of letters. Back then they were only schoolboys.</blockquote><div class="orig"><p>这些邻居里有三个中学生，有一个名叫孙伟的中学生留着一头长发，另外两个就是刘成功和赵胜利，我们刘镇后来的两大才子，当时他们还不是刘作家和赵诗人，还只是名叫刘成功和赵胜利的两个中学生。</p></div></article><article class="entry"><p class="page">Upper part · ch. 6</p><blockquote class="latin">They offered all kinds of descriptions of their missing chickens. Many people, they said, had seen the birds follow Li Guangtou and Song Gang through the streets.</blockquote><div class="orig"><p>他们五花八门地说着他们的鸡长了什么模样，他们说很多人都看见了，看见他们的公鸡母鸡跟着李光头和宋钢走上了大街。</p></div></article><article class="entry"><p class="page">p. 45</p><blockquote class="latin">They insisted that chickens were not fleas or lice: they could hardly be right in front of them and invisible. They said they would search the place.</blockquote><div class="orig"><p>他们声称公鸡母鸡们不是跳蚤虱子们，不会近在眼前都看不见，他们说去找一找，去搜一搜。</p></div></article><article class="entry"><p class="page">p. 50</p><blockquote class="latin">He frightened the two boys badly. They sat stunned on the outer-room bed, all four legs dangling over its edge trembling.</blockquote><div class="orig"><p>他让两个孩子非常害怕，他们惊魂未定地坐在外屋的床上，他们挂在床边的四条腿瑟瑟打抖。</p></div></article><article class="entry"><p class="page">Upper part · ch. 7</p><blockquote class="latin">Men and women in the street laughed at them. Everyone knew the couple had married before, that each had brought a son, and that the groom had fought six men on his wedding day.</blockquote><div class="orig"><p>大街上的男男女女看着他们嘻嘻哈哈地笑，他们知道这一对夫妻都是二婚，知道这两个儿子都是拖油瓶，知道这个新郎在新婚的那一天和六个人打架打得手忙脚乱。</p></div></article><article class="entry"><p class="page">p. 55</p><blockquote class="latin">Li Lan knew what their odd smiles and pointing fingers meant, so she lowered her head.</blockquote><div class="orig"><p>李兰知道他们脸上的怪笑是什么意思，知道他们指指点点时都说了些什么话，所以李兰低下了头。</p></div></article><article class="entry"><p class="page">Upper part · ch. 8</p><blockquote class="latin">Song Fanping smiled, unaware that this was the last time he would see his wife. His final image of Li Lan was her profile as she wiped away tears; the boys remembered the dust billowing behind the departing bus.</blockquote><div class="orig"><p>那时候宋凡平脸上挂着微笑，他不知道这是最后一眼看到自己的妻子，李兰留给他的最后印象就是抬起手擦着眼泪的侧影，李光头和宋钢当时的印象是长途客车远去时卷起了滚滚尘土。</p></div></article></section><section class="story"><h3>Upheaval and loss</h3><article class="entry"><p class="page">Upper part · ch. 9</p><blockquote class="latin">More and more people filled the streets, shouting slogans and singing revolutionary songs. Posters thickened the walls until the wind made them rustle like leaves.</blockquote><div class="orig"><p>越来越多的人走到大街上大狗小狗似的喊叫和唱歌，他们喊着革命的口号，唱着革命的歌曲；越来越多的大字报让墙壁越来越厚，风吹过去时墙壁发出了树叶的响声。</p></div></article><article class="entry"><p class="page">Upper part · ch. 9</p><blockquote class="latin">It was Song Fanping&#x27;s most glorious day. After the march, he walked through town holding both boys&#x27; hands while people called his name and came over to shake his hand.</blockquote><div class="orig"><p>这是宋凡平最辉煌的一天，游行结束以后人们各自回家，宋凡平拉着李光头和宋钢的手仍然走在大街上，很多人在街上叫着宋凡平的名字，宋凡平嘴里嗯嗯地回答他们，有些人还走上来和宋凡平握一下手。</p></div></article><article class="entry"><p class="page">Upper part · ch. 9</p><blockquote class="latin">His answer made their heads bob like woodpeckers and their mouths exclaim in endless astonishment.</blockquote><div class="orig"><p>他的回答让那些人的头像是啄木鸟一样点个没完没了，让那些人的嘴巴像是牙疼似的哎呀哎哟赞叹不已。</p></div></article><article class="entry"><p class="page">Upper part · ch. 9</p><blockquote class="latin">Li Guangtou and Song Gang cried out in excitement. Song Fanping clapped his hands over their mouths; the fear on his face frightened them too.</blockquote><div class="orig"><p>李光头和宋钢激动得尖声喊叫，宋凡平吓得伸手捂住了他们的嘴，他惊恐的脸色把他们也吓住了。</p></div></article><article class="entry"><p class="page">Upper part · ch. 12</p><blockquote class="latin">Only when someone bumped into him or spat on his foot did they look at him properly.</blockquote><div class="orig"><p>当走过去的人不小心撞了他一下，当吐痰的人不小心吐到了他的脚上，他们才会认真看他一眼。</p></div></article><article class="entry"><p class="page">Upper part · ch. 13</p><blockquote class="latin">The boys poured soy sauce into the steaming rice and stirred it until it shone dark red and black. Its fragrance rose with the steam and filled the room.</blockquote><div class="orig"><p>两个孩子把酱油倒进热气蒸腾的米饭里，搅拌均匀以后，米饭们像是涂上了油彩一样又黑又红又亮，酱油的香味在米饭的热气里扩散开来，飘满了整个屋子。</p></div></article><article class="entry"><p class="page">Upper part · ch. 13</p><blockquote class="latin">As soon as he finished speaking, tears streamed down Song Gang&#x27;s face. He set down his bowl and sobbed, still swallowing the rice in his mouth.</blockquote><div class="orig"><p>刚说完宋钢的脸上就流满了眼泪，他放下碗，低头抽泣起来，一边抽泣一边还将嘴里的米饭咽了下去。</p></div></article><article class="entry"><p class="page">Upper part · ch. 15</p><blockquote class="latin">At sunrise, Song Fanping, awake all night, told the boys to go to bed. They shook their heads and stayed on the doorstep. He stepped over them to catch the first bus to Shanghai and bring his wife home.</blockquote><div class="orig"><p>太阳开始升起的时候，一夜没睡的宋凡平打了几个哈欠，他让两个孩子上床去睡觉，李光头和宋钢摇摇头仍然坐在门槛上，于是他就抬脚从他们中间跨了出去，他要去坐早班汽车，去上海迎接他的妻子。</p></div></article><article class="entry"><p class="page">Upper part · ch. 16</p><blockquote class="latin">Several sticks swung at Song Fanping. He raised his right arm to block them; the blows felt as if they had broken the bone. Still fending them off, he made his way into the waiting room and toward the ticket window.</blockquote><div class="orig"><p>几根木棍迎面打来，宋凡平本能地举起右胳膊阻挡打来的木棍，木棍砸在了他的右胳膊上，让他觉得手臂的骨头仿佛断了似的疼痛，他仍然挥舞着右胳膊阻挡打来的木棍，宋凡平走进了候车室，走向了售票的窗口。</p></div></article><article class="entry"><p class="page">Upper part · ch. 16</p><blockquote class="latin">People peered into the waiting room from outside, afraid to enter. Only when boarding began did they creep in, watching the six men with red armbands under the ceiling fan with dread.</blockquote><div class="orig"><p>这些人站在候车室的门外偷偷往里面张望，没有一个人敢走进去，直到去上海的长途汽车开始检票了，这些人才小心翼翼地走了进来，胆战心惊地看着围坐在吊扇下休息的六个红袖章。</p></div></article><article class="entry"><p class="page">Upper part · ch. 16</p><blockquote class="latin">Song Fanping, who had never yielded, desperately wanted to live. He struggled to his knees, blood spilling from his mouth, clutched his bleeding stomach, and wept as he begged them to stop. Even his tears were bloody.</blockquote><div class="orig"><p>从不屈服的宋凡平这时候太想活下去了，他用尽了力气跪了起来，他吐着满嘴的鲜血，右手捧着呼呼流血的腹部，流着眼泪求他们别再打他了，他的眼泪里都是鲜血。</p></div></article><article class="entry"><p class="page">Upper part · ch. 16</p><blockquote class="latin">The six men with red armbands were as exhausted as dockworkers after a day&#x27;s labor. When they sat down in Su Ma&#x27;s snack shop, none had the energy to speak.</blockquote><div class="orig"><p>这六个红袖章像是干了一天力气活的码头工人那样疲惫不堪，他们走进苏妈的点心店坐下来时，累得谁都不想说话了。</p></div></article><article class="entry"><p class="page">Upper part · ch. 17</p><blockquote class="latin">The boys woke at noon in high spirits. Song Fanping had said he would be home at sunset, but they could not wait: they went to the station at midday to meet him and Li Lan.</blockquote><div class="orig"><p>他们睡醒的时候已经是中午了，他们兴高采烈，虽然宋凡平说要到太阳落山的时候才会到家，可是两个孩子等不及了，他们中午就走向了车站，他们要在那里等待宋凡平和李兰乘坐的汽车驶进车站。</p></div></article><article class="entry"><p class="page">Upper part · ch. 17</p><blockquote class="latin">Seeing the two boys crying at her door, Su Ma inspected their clothes and asked, &#x27;You aren&#x27;t here to beg, are you?&#x27;</blockquote><div class="orig"><p>苏妈看到两个哭泣的孩子站在门口，打量着李光头和宋钢身上的衣服说：“你们不是来要饭的吧？”</p></div></article><article class="entry"><p class="page">Upper part · ch. 17</p><blockquote class="latin">&#x27;Look at this! My trousers, my sandals, my stockings... What the hell is this supposed to be?&#x27;</blockquote><div class="orig"><p>“你们看看，你们看看，我的裤子，我的凉鞋，我的丝袜……他妈的这叫什么事？”</p></div></article><article class="entry"><p class="page">Upper part · ch. 17</p><blockquote class="latin">Li Guangtou and Song Gang watched the heads shifting at the doors and windows and listened to the murmur: what kind of man Song Fanping had been, how he had died. Whenever someone said the children were pitiful, they cried a little, then went on staring fearfully at the crowd.</blockquote><div class="orig"><p>李光头和宋钢看着那些在窗口和门前晃动的脑袋和身体，听着他们嗡嗡地说话，他们说着宋凡平是一个什么人，又说着宋凡平是怎样死去的；当有人说这两个孩子真可怜时，宋钢哇哇地哭了两声，李光头也跟着哇哇地哭了两声，然后继续害怕地看着他们。</p></div></article></section><section class="story"><h3>After the loss</h3><article class="entry"><p class="page">Upper part · ch. 18</p><blockquote class="latin">Li Lan stood outside the hospital before dawn. Although Song Fanping&#x27;s letter said he would arrive at noon, more than two months apart had made her longing surge like waves. She had woken before daylight to wait for morning.</blockquote><div class="orig"><p>李兰凌晨的时候就已经站在了医院的大门口，虽然宋凡平在信里说自己中午才能到上海，可是两个多月的分别让李兰的思念像浪涛一样汹涌澎湃，天没亮她就醒来了，坐在病床上等待着晨光的到来。</p></div></article><article class="entry"><p class="page">Upper part · ch. 18</p><blockquote class="latin">The hospital doorman recognized Li Lan. All morning he watched the woman who had frightened him before dawn, seeing her peer eagerly at every person passing in the procession.</blockquote><div class="orig"><p>那个医院的门房已经认出李兰了，他一个上午都在奇怪地看着这个天亮前把他吓得尿了裤子的女人，他看到她激动地看着游行队伍里的每一个人，应该说是每一个走过的人。</p></div></article><article class="entry"><p class="page">Upper part · ch. 18</p><blockquote class="latin">As time passed, Li Lan grew weak with hunger and thirst. She sat on the steps by the gatehouse, leaning against the doorframe, but kept her head raised and her eyes searching.</blockquote><div class="orig"><p>随着时间的流逝，李兰越来越疲惫，饥渴让她没有力气继续站着了，她在传达室的台阶上坐了下来，身体靠在门框上，她的头颅仍然挺立，眼睛仍然在张望。</p></div></article><article class="entry"><p class="page">Upper part · ch. 19</p><blockquote class="latin">Sitting on the bed in the inner room, Li Guangtou and Song Gang heard Li Lan say in a trembling voice, &#x27;Put the lid on.&#x27;</blockquote><div class="orig"><p>坐在里屋床上的李光头和宋钢听到李兰声音震动地说：“盖吧。”</p></div></article><article class="entry"><p class="page">Upper part · ch. 20</p><blockquote class="latin">Li Lan walked on, her hands shaking around the photograph. She fought the urge to pull the family portrait out of its paper bag.</blockquote><div class="orig"><p>李兰向前走去，她捧着照片的手抖个不停，她努力压制着自己，不让自己的手从纸袋里抽出他们的全家福。</p></div></article><article class="entry"><p class="page">Upper part · ch. 20</p><blockquote class="latin">As they walked beside Li Lan, the boys kept darting their heads in front of and behind her, looking across at each other and smiling.</blockquote><div class="orig"><p>李光头和宋钢拉着李兰向前走去时，一会把头伸到李兰的前面，一会又把头转到李兰的身后，他们不断地去看看对方，不断地向对方笑一笑。</p></div></article><article class="entry"><p class="page">Upper part · ch. 21</p><blockquote class="latin">In patched trousers and a worn undershirt, he stood outside the door without a word, tears streaming down his old face as he looked at the coffin.</blockquote><div class="orig"><p>他穿着满是补丁的裤子和汗衫站在门外，不说一句话，老泪纵横地看着屋里的棺材。</p></div></article><article class="entry"><p class="page">Upper part · ch. 21</p><blockquote class="latin">He turned and slapped Li Lan. Her head jerked, blood ran from the corner of her mouth, yet she smiled proudly and kept her head high.</blockquote><div class="orig"><p>他说完转回身来，挥手给了李兰一巴掌，李兰的头甩了一下，她的嘴角流出了鲜血，可她骄傲地笑了，继续昂首看着他。</p></div></article><article class="entry"><p class="page">Upper part · ch. 21</p><blockquote class="latin">The two boys covered their mouths. They stopped crying aloud, but could not stop their tears.</blockquote><div class="orig"><p>两个孩子用手捂住了嘴巴，他们止住了哭声，可是止不住眼泪。</p></div></article><article class="entry"><p class="page">p. 164</p><blockquote class="latin">Song Gang&#x27;s grandfather held his hand. He did not know why he had stayed.</blockquote><div class="orig"><p>宋钢的爷爷拉着宋钢的手，他也不知道自己为什么留下来了？</p></div></article><article class="entry"><p class="page">p. 169</p><blockquote class="latin">Sun Wei loved his long hair. At least twice a day he crouched by the river, used the water to smooth his fringe, then tossed his hair at his blurred reflection and whistled with delight.</blockquote><div class="orig"><p>孙伟喜欢自己的长头发，他每天起码两次走下街边的台阶，蹲在河边弄一些水上来，把额前的头发弄得服服帖帖，然后对着河水里模糊的影子甩一甩他的长头发，吹两声得意洋洋的口哨。</p></div></article><article class="entry"><p class="page">Upper part · ch. 22</p><blockquote class="latin">By the time she reached the south gate, her trousers were gone. She was menstruating; blood ran down her legs as she crossed the wooden bridge, leaving Zhao Shengli and Liu Chenggong speechless.</blockquote><div class="orig"><p>当她走出南门的时候，她的裤子没有了，她当时正是月经来潮，走过木桥时鲜血顺着双腿流了下来，让赵胜利和刘成功看得目瞪口呆。</p></div></article><article class="entry"><p class="page">Upper part · ch. 22</p><blockquote class="latin">The man&#x27;s body was battered from head to toe. Standing hurt, sitting hurt, lying down hurt; moving hurt, and so did keeping still.</blockquote><div class="orig"><p>这个男人浑身上下都破烂了，站着的时候疼痛，坐着的时候疼痛，躺着的时候疼痛，动的时候疼痛，不动的时候也疼痛。</p></div></article><article class="entry"><p class="page">p. 183</p><blockquote class="latin">Song Gang walked quietly out of the alley and into the street. He looked at the familiar houses and plane trees, at people fighting, crying, laughing. He smiled at some he knew, but they ignored him.</blockquote><div class="orig"><p>宋钢脚步轻轻地走出了小巷，走上了大街，他在大街上东张西望地走着，他看着熟悉的房屋、熟悉的梧桐树；看到有些人在打架，有些人在哭，有些人在笑；这里面有一些他熟悉的人，他对着他们微笑，他们却没有答理他。</p></div></article><article class="entry"><p class="page">Upper part · ch. 24</p><blockquote class="latin">Li Lan always wore a proud smile. Her marriage to Song Fanping had lasted only a year and two months, yet deep in her heart it felt longer than a lifetime.</blockquote><div class="orig"><p>李兰的嘴角始终挂着骄傲的微笑，虽然和宋凡平只有短短的一年零两个月的夫妻生活，可是在李兰的内心深处比一生还要漫长。</p></div></article><article class="entry"><p class="page">Upper part · ch. 24</p><blockquote class="latin">The two self-styled writers had stolen books confiscated during the Cultural Revolution. Li Guangtou had kept watch for them, and they had found many of the fine words used to describe Lin Hong in those books.</blockquote><div class="orig"><p>这两位文豪曾经几次深更半夜时去一间屋子偷书，这些书籍都是文革中搜罗来的，又被查封了起来，李光头几次都在外面替他们望风，描绘林红屁股的很多美妙词语都是从这些偷来的书中发现的。</p></div></article><article class="entry"><p class="page">Upper part · ch. 24</p><blockquote class="latin">Word of Li Guangtou&#x27;s misdeeds reached Li Lan little by little, and she bowed her head lower and lower. She had already borne the scandal of her first husband; now she had to bear her son&#x27;s.</blockquote><div class="orig"><p>李光头的种种劣迹点点滴滴地传到了李兰的耳中，让李兰的头垂得越来越低，她曾经承受了第一个丈夫的丑闻，现在又要来承受儿子的丑闻。</p></div></article><article class="entry"><p class="page">Upper part · ch. 24</p><blockquote class="latin">The bathhouse was only half a kilometer from home, but Li Lan took more than an hour to get there. Each time she rested against a tree, Li Guangtou waited patiently and talked of things that had happened in Liu Town, things she had never heard of.</blockquote><div class="orig"><p>从家里走到澡堂也就是一里路，李兰走了有一个多小时，每次她靠着树休息时，李光头都是耐心地站在一边，一脸成熟地讲述着很多发生在刘镇的事，这些事都是李兰从来没有听说过的。</p></div></article></section><section class="story"><h3>Love and separate paths</h3><article class="entry"><p class="page">Lower part · ch. 6</p><blockquote class="latin">Song Gang did not want to come at all, but after Li Guangtou flew into a rage he had to steel himself and show up.</blockquote><div class="orig"><p>宋钢是一百个不愿意，李光头大发雷霆之后，宋钢只好硬着头皮来了。</p></div></article><article class="entry"><p class="page">Lower part · ch. 6</p><blockquote class="latin">Song Gang understood the first half of what she said, but not the second. By the time Lin Hong turned around, he had left.</blockquote><div class="orig"><p>宋钢听明白了前半句话，没明白后半句话，林红转过身来时，宋钢已经走出去了。</p></div></article><article class="entry"><p class="page">Lower part · ch. 7</p><blockquote class="latin">Song Gang longed to see Lin Hong. Several times he reached the door and opened it, only to remember Li Guangtou. His legs would not carry him out. He gazed at the fine rain outside and closed the door again.</blockquote><div class="orig"><p>宋钢太想去和林红见面了，他几次走到了门口，打开屋门后他又想到了李光头，他的双腿就跨不出去了，他迷惘地看了看屋外的蒙蒙细雨，又把屋门关上。</p></div></article><article class="entry"><p class="page">Lower part · ch. 7</p><blockquote class="latin">He held Lin Hong&#x27;s handkerchief up before his eyes in the dark, looked at it as if saying farewell, and put it firmly in his pocket. Then he let out a long breath and felt much lighter.</blockquote><div class="orig"><p>他把林红的手帕举到黑暗的眼前，告别似的看了一眼，坚定地放进了口袋，然后他长长地出了一口气，他觉得自己轻松了很多。</p></div></article><article class="entry"><p class="page">p. 297</p><blockquote class="latin">Seeing Song Gang standing silent with his head down, Li Guangtou waved him away: &#x27;All right, you should go.&#x27;</blockquote><div class="orig"><p>看到宋钢低垂着头一言不发，李光头摆摆手说：“行啦，你该走啦。”</p></div></article><article class="entry"><p class="page">Lower part · ch. 10</p><blockquote class="latin">Dizzy with happiness, Song Gang bought a gleaming Forever-brand bicycle. It cost nearly all his savings.</blockquote><div class="orig"><p>在幸福里晕头转向的宋钢买了一辆亮闪闪的永久牌自行车，这差不多花去了他全部的积蓄。</p></div></article><article class="entry"><p class="page">Lower part · ch. 10</p><blockquote class="latin">Lin Hong&#x27;s uncle finally gave Song Gang the Forever-brand bicycle that had been intended for the county militia chief.</blockquote><div class="orig"><p>林红的叔叔万般无奈，咬咬牙将本来应该给县人武部部长的永久牌自行车，给了林红那个亲爱的宋钢。</p></div></article><article class="entry"><p class="page">Lower part · ch. 10</p><blockquote class="latin">Song Gang rode his shiny Forever bicycle with beautiful Lin Hong behind him and rang its bell at everyone he met. Only when he saw Li Guangtou did he leave it silent.</blockquote><div class="orig"><p>宋钢骑着亮闪闪的永久牌，带着美丽的林红，遇到谁都要打上一阵子铃声，就是见了李光头他不打铃了。</p></div></article><article class="entry"><p class="page">Lower part · ch. 10</p><blockquote class="latin">Then he cheered himself up, spraying spit as he spoke: &#x27;One day I&#x27;ll get an enormous Forever bicycle. Xishi will sit in front, Diaochan behind, Wang Zhaojun in my arms and Yang Guifei on my back. I&#x27;ll ride with those four beauties of antiquity for forty-nine damn days, from the present into the past and back again. If I feel like it, I&#x27;ll ride into the future too...&#x27;</blockquote><div class="orig"><p>接下去他开始鼓励自己了，满嘴唾沫地说：“老子以后弄一辆超大型永久牌，前面坐西施，后面载貂蝉，怀里抱个王昭君，背上驮个杨贵妃。老子带着这古代四大美女骑上他妈的七七四十九天，从当代骑到古代去，再从古代骑到当代来，老子高兴了还要骑到未来去……”</p></div></article><article class="entry"><p class="page">Lower part · ch. 11</p><blockquote class="latin">At first Li Guangtou swayed from side to side. Song Gang pushed the bicycle while reaching out to steady him so he would not fall.</blockquote><div class="orig"><p>刚开始李光头的身体不断左右摇晃，宋钢一边推着，一边还要伸手去扶住李光头，不让他掉下来。</p></div></article><article class="entry"><p class="page">Lower part · ch. 11</p><blockquote class="latin">Lin Hong and Song Gang hosted seven tables at the People&#x27;s Restaurant: six for her relatives and friends, one for his.</blockquote><div class="orig"><p>林红和宋钢在人民饭店摆了七桌酒席，林红的亲友占了六桌，宋钢的只有一桌。</p></div></article><article class="entry"><p class="page">Lower part · ch. 11</p><blockquote class="latin">The doctor knew the famous Li Guangtou. As soon as he entered, Li Guangtou demanded a vasectomy.</blockquote><div class="orig"><p>医生当然认识大名鼎鼎的李光头，李光头走进来劈头盖脸就要医生给他结扎。</p></div></article><article class="entry"><p class="page">Lower part · ch. 11</p><blockquote class="latin">As Li Guangtou receded into the distance, more people gathered around Young Guan. They eagerly discussed him, all saying the day had been thoroughly entertaining.</blockquote><div class="orig"><p>李光头越走越远的时候，小关剪刀身边的群众越聚越多，群众兴致勃勃地议论着远去的李光头，纷纷说自己度过了愉快的一天。</p></div></article><article class="entry"><p class="page">Lower part · ch. 12</p><blockquote class="latin">The three fools were already grinning. When they saw the four blind men grinning too, they refused to be outdone and burst into loud laughter.</blockquote><div class="orig"><p>三个傻子本来就乐呵呵，见到四个瞎子也乐呵呵，三个傻子不甘示弱，干脆放声大笑。</p></div></article><article class="entry"><p class="page">Lower part · ch. 12</p><blockquote class="latin">&#x27;With someone as lawless as Li Guangtou, you cannot say &quot;resign.&quot; You must say &quot;dismissed.&quot;&#x27;</blockquote><div class="orig"><p>“对李光头这种无法无天的人，不能用‘辞职’这两个字，一定要用‘开除’。”</p></div></article><article class="entry"><p class="page">Lower part · ch. 13</p><blockquote class="latin">With five thousand yuan in startup money, Li Guangtou pressed on and recruited Young Guan at the scissor-grinding shop and Yu the Tooth-Puller, who worked beneath an oilcloth umbrella.</blockquote><div class="orig"><p>拥有了五千元人民币创业资金的李光头，再接再厉地又拿下了磨剪刀铺的小关剪刀和撑着油布雨伞拔牙的余拔牙。</p></div></article></section><section class="story"><h3>Business and brotherhood</h3><article class="entry"><p class="page">Lower part · ch. 19</p><blockquote class="latin">Lin Hong stood silently in the middle of the room. Only now did she remember that Li Guangtou had become a beggar. Until then her world had held only Song Gang; now that bastard Li Guangtou had barged back in.</blockquote><div class="orig"><p>林红无声地站在屋子中央，这时候她才想起来李光头已经是个要饭的叫花子了，在此之前她完全忘记了李光头的存在，她的世界里只有宋钢，没有别人，现在李光头这个混蛋又闯进来了。</p></div></article><article class="entry"><p class="page">Lower part · ch. 19</p><blockquote class="latin">When Lin Hong said &#x27;stepmother,&#x27; Song Gang cried out in pain. She realized she might have said the wrong thing and fell silent. The room went quiet.</blockquote><div class="orig"><p>林红说出了“后妈”，宋钢突然伤心地叫了起来，林红吃惊之后，觉得自己可能是说错了，她不再说话，于是屋子陷入到沉默之中。</p></div></article><article class="entry"><p class="page">Lower part · ch. 19</p><blockquote class="latin">This time Lin Hong expected to find the money and grain coupons. When she was certain they were gone, she panicked and looked to Song Gang, hoping he would say he had spent them himself.</blockquote><div class="orig"><p>这一次林红期待着能够摸到它们，当她确信钱和粮票都没有以后，突然惊慌起来，她有些害怕地看着宋钢，希望宋钢告诉她，这一次是他自己花掉的。</p></div></article><article class="entry"><p class="page">Lower part · ch. 19</p><blockquote class="latin">Lin Hong bit her lip in anger. Long afterward, when the room had gone dark, Song Gang still sat motionless, as if waiting for her to wake up and eat with him.</blockquote><div class="orig"><p>林红气得咬住了嘴唇，过去了很长时间，屋子里变得漆黑一团，宋钢还是一动不动地坐在那里，好像是在等待着林红睡醒了起床一起吃饭。</p></div></article><article class="entry"><p class="page">Lower part · ch. 20</p><blockquote class="latin">When Lin Hong began wiping her tears, Song Gang brought out the foreign watch. Stammering, he explained that he had stopped seeing Li Guangtou, but his brother had called to him outside the county government building and given him the watch, reviving their old bond.</blockquote><div class="orig"><p>过了一会，看到林红擦起了眼泪，宋钢才转身找出了那块外国手表，结结巴巴地告诉林红，他本来已经不和李光头交往了，因为那天骑车从县政府大门口经过，李光头叫住他，给了他这块手表，让他重新想起了往日的兄弟情谊。</p></div></article><article class="entry"><p class="page">Lower part · ch. 20</p><blockquote class="latin">She said they had saved every penny since marrying so she could buy Song Gang a Diamond-brand watch. Yet Li Guangtou had won him over with a discarded foreign watch.</blockquote><div class="orig"><p>她说结婚以后省吃俭用，就是为了存钱给宋钢买一块钻石牌手表，没想到李光头用一块别人扔掉的破烂手表，就把宋钢收买了。</p></div></article><article class="entry"><p class="page">Lower part · ch. 20</p><blockquote class="latin">Lin Hong saw how troubled Song Gang was. He and Li Guangtou shared too much history for their bond to break cleanly. She did not blame him, thinking it would pass in time.</blockquote><div class="orig"><p>林红看到宋钢脸上凝重的表情，知道他心里的难受，毕竟他和李光头的兄弟往事太多了，藕断丝连在所难免，林红没有去责怪他，心想过些日子就会好了。</p></div></article><article class="entry"><p class="page">Lower part · ch. 21</p><blockquote class="latin">He sat cross-legged on the floor and spent two hours wrestling with the foreign watch. Sweating, he fitted three pieces of wire of different lengths, then wore it proudly on his wrist.</blockquote><div class="orig"><p>他盘腿坐在地上，专门花了两个小时对付了那块外国手表，满头大汗地安上去了三根长短不一的细铁丝，然后神气活现地戴在手腕上。</p></div></article><article class="entry"><p class="page">Lower part · ch. 22</p><blockquote class="latin">Tao Qing knew what Li Guangtou was like: without a ladder he would still try to climb, and if you gave him one he would expect you to carry him up.</blockquote><div class="orig"><p>陶青知道李光头是个什么货色，没有梯子他想着要往上爬，给了他梯子，他就要你背着他往上爬了。</p></div></article><article class="entry"><p class="page">Lower part · ch. 22</p><blockquote class="latin">The county office director smiled warmly and spoke warmly as he followed Li Guangtou around the mountain of scrap.</blockquote><div class="orig"><p>县办主任脸上挂着亲热的笑，嘴里说着亲热的话，跟在李光头屁股后面，在破烂山里走来走去。</p></div></article><article class="entry"><p class="page">p. 415</p><blockquote class="latin">The soy milk was meager compared with the full bowls in Liu Town. The Japanese cup was smaller than one of our tea bowls, and the fried dough sticks were as thin as chopsticks.</blockquote><div class="orig"><p>那豆浆还少得可怜，不像我们刘镇的豆浆是满满一大碗，日本喝豆浆的碗比我们刘镇喝茶的茶盅还要小，那油条更是细得跟筷子似的。</p></div></article><article class="entry"><p class="page">Lower part · ch. 25</p><blockquote class="latin">The discarded Japanese suits bore family surnames, printed inside their breast pockets.</blockquote><div class="orig"><p>那些日本垃圾西装上都标有家族的姓氏，标在胸前内侧口袋上。</p></div></article><article class="entry"><p class="page">Lower part · ch. 25</p><blockquote class="latin">Yu the Tooth-Puller said proudly, &#x27;Compared with Panasonic and Sanyo, Fukuda really is a nobody.&#x27;</blockquote><div class="orig"><p>余拔牙得意地说，“和‘松下’和‘三洋’两家比起来，‘福田’确实是无名小卒。”</p></div></article><article class="entry"><p class="page">Lower part · ch. 25</p><blockquote class="latin">Tao Qing watched as the suit labeled &#x27;Nakasone&#x27; went onto the county chief. He was furious inside, but kept smiling and praising how well it fit.</blockquote><div class="orig"><p>陶青眼睁睁看着“中曾根”套到县长身上去了，心里一百个不高兴，脸上还要赔着笑容，嘴里还要一声声夸奖县长穿上“中曾根”如何合体合身。</p></div></article><article class="entry"><p class="page">Lower part · ch. 26</p><blockquote class="latin">Li Guangtou was hurt. He called after Song Gang and Lin Hong as they cycled away: &#x27;Song Gang, you bastard! Have you forgotten our childhood?&#x27;</blockquote><div class="orig"><p>李光头伤心了，他冲着宋钢和林红离去的自行车最后喊道：“宋钢，你这个王八蛋，你把我们小时候的事忘光啦？”</p></div></article><article class="entry"><p class="page">Lower part · ch. 26</p><blockquote class="latin">Su Ma had regrets too: when Li Guangtou spread his wings and left Liu Town for a second time, he had asked whether she wanted to join him.</blockquote><div class="orig"><p>后悔的还有苏妈，李光头第二次鲲鹏展翅离开刘镇时，问过苏妈要不要加入。</p></div></article><article class="entry"><p class="page">Lower part · ch. 26</p><blockquote class="latin">&#x27;The ancients spoke of traveling merchants and settled traders. Only when your business lets you sit still have you become a real trader; if you must keep running around, your business is still small.&#x27;</blockquote><div class="orig"><p>“古人云‘行商坐贾’，生意做到坐下来的时候才是‘贾’，才真正做成大生意了，跑来跑去的只能做小生意，只是‘商’。”</p></div></article><article class="entry"><p class="page">Lower part · ch. 26</p><blockquote class="latin">The onlooker laughed and told everyone that Li Guangtou had hired a driver without owning a car: he and his driver took a long-distance bus to Shanghai.</blockquote><div class="orig"><p>那个群众笑了又笑，逢人就说李光头雇用了一个司机，可是没有汽车，李光头和他的司机坐着长途汽车去上海了。</p></div></article></section><section class="story"><h3>Wealth and hardship</h3><article class="entry"><p class="page">p. 443</p><blockquote class="latin">Lin Hong was forcing a smile. The knitting factory had struggled for years and had now begun laying off workers.</blockquote><div class="orig"><p>这时的林红是在强作欢笑，针织厂连续几年效益不好，现在开始裁员了。</p></div></article><article class="entry"><p class="page">Lower part · ch. 29</p><blockquote class="latin">Song Gang kept silent. He had cut Li Guangtou off so decisively that now, when his brother was rich and successful, he could not bring himself to beg for help.</blockquote><div class="orig"><p>宋钢低头不语，心想当初自己绝情绝义要和李光头一刀两断，现在李光头成功了有钱了，自己再上门去哀求他，这样的事做不出来。</p></div></article><article class="entry"><p class="page">Lower part · ch. 29</p><blockquote class="latin">When Song Gang woke the next morning, Lin Hong had already risen and was washing her face and rinsing her mouth in the bathroom.</blockquote><div class="orig"><p>宋钢第二天早晨醒来时，看到林红已经起床了，正在卫生间里漱口洗脸。</p></div></article><article class="entry"><p class="page">Lower part · ch. 29</p><blockquote class="latin">If Song Gang was offered even a single day&#x27;s work, he went out wearing a mask. He did not want to pass his lung disease to anyone else.</blockquote><div class="orig"><p>偶尔有一份工作需要宋钢去代理一天，宋钢也会戴着口罩出门，他不愿意把肺病传染给其他人。</p></div></article><article class="entry"><p class="page">Lower part · ch. 30</p><blockquote class="latin">Some men in the crowd defended Lin Hong: nobody could foresee the future, they said, and even a fortune-teller could predict others&#x27; fate but not his own.</blockquote><div class="orig"><p>群众里的有些男性为林红辩护，他们说谁也没有先见之明，就是算命先生，也只会算别人的命，算不了自己的命。</p></div></article><article class="entry"><p class="page">Lower part · ch. 31</p><blockquote class="latin">&#x27;That bastard Liu the Writer really is talented! With one key he overturned the worst miscarriage of justice Liu Town has ever seen!&#x27;</blockquote><div class="orig"><p>“这个王八蛋刘作家真有才华，一把钥匙就把刘镇有史以来最大的冤假错案平反啦！”</p></div></article><article class="entry"><p class="page">Lower part · ch. 31</p><blockquote class="latin">Liu the Writer smiled broadly and told Zhao the Poet not to be angry: &#x27;At your age, anger can easily bring on a stroke.&#x27;</blockquote><div class="orig"><p>刘作家满脸的微笑，请赵诗人不要生气，他说：“你这个年纪生气很容易中风。”</p></div></article><article class="entry"><p class="page">Lower part · ch. 31</p><blockquote class="latin">Whenever he spoke of childhood, Li Guangtou wept. He wiped his eyes, loudly thanked reform and opening up, the Party, the government and everyone in the county, then launched into the story of how he had built his business.</blockquote><div class="orig"><p>说到童年，李光头总是声泪俱下，然后抹一把眼泪，大声感谢改革开放，感谢党和政府，感谢全县人民，感谢说完了就开始讲述自己如何创业，如何成就今天这番伟大事业。</p></div></article><article class="entry"><p class="page">Lower part · ch. 31</p><blockquote class="latin">He half-closed his eyes when discussing business. People thought he was asleep, but he was more alert than any of them.</blockquote><div class="orig"><p>他眯着眼睛跟人谈生意，人家以为他睡着了，可他比谁都清醒。</p></div></article><article class="entry"><p class="page">p. 467</p><blockquote class="latin">Song Gang went out into the street toward Li Guangtou&#x27;s company. The poorest man in Liu Town walked toward its richest. They had once been brothers, and they were brothers still.</blockquote><div class="orig"><p>宋钢走上了大街，走向了李光头的公司，我们刘镇最贫穷的人走向了最富有的人，他们曾经是兄弟，现在仍然是兄弟。</p></div></article><article class="entry"><p class="page">Lower part · ch. 34</p><blockquote class="latin">Liu the Journalist reeled off the list: &#x27;Beautiful and dignified, healthy and graceful, cultured and talented, understanding, gentle, respectful to elders, loving to children, innocent, faithful, with no sexual experience...&#x27;</blockquote><div class="orig"><p>刘新闻绕口令似的说：“美丽端庄、健康婀娜、气质出众、才韵内敛、善解人意、温柔体贴、尊老爱幼、清纯忠贞、无性经历……”</p></div></article><article class="entry"><p class="page">Lower part · ch. 34</p><blockquote class="latin">The last reporter asked, &#x27;Will the winner of the Virgin Beauty Contest become Mr. Li&#x27;s bride?&#x27;</blockquote><div class="orig"><p>最后一个记者提问：“处美人大赛的冠军是否会成为你们李总的新娘？”</p></div></article><article class="entry"><p class="page">Lower part · ch. 35</p><blockquote class="latin">Zhou You shook his head again. &#x27;I don&#x27;t drink mineral water. It&#x27;s a fraud; there&#x27;s hardly any minerals in it. Tap water has the most.&#x27;</blockquote><div class="orig"><p>周游仍然摇着头说：“我不喝矿泉水，那是骗人的，里面没有什么矿物质了，矿物质含量最高的就是凉水。”</p></div></article><article class="entry"><p class="page">Lower part · ch. 35</p><blockquote class="latin">After spending his last five yuan, the swindler claimed he needed to sample the little buns with straws. He tricked them into feeding him for days to come.</blockquote><div class="orig"><p>这个江湖骗子花去了身上仅有的五元钱以后，声称要试吃带吸管的小包子，将今后几天吃的都提前骗到手了。</p></div></article><article class="entry"><p class="page">Lower part · ch. 35</p><blockquote class="latin">Zhou You had finally silenced Zhao the Poet. Afraid to sound clever again, Zhao asked, &#x27;What country was that language from?&#x27;</blockquote><div class="orig"><p>这次周游把赵诗人镇住了，赵诗人不敢再自作聪明，他不耻下问：“你刚才说的是哪国话？”</p></div></article><article class="entry"><p class="page">Lower part · ch. 35</p><blockquote class="latin">Zhao the Poet was about to agree, but Zhou You declined: &#x27;No thanks. This place is much more comfortable than the Arabian desert or the jungles of Latin America.&#x27;</blockquote><div class="orig"><p>赵诗人正要说好，周游却谢绝了，他说：“没关系，这里比阿拉伯的沙漠、拉丁美洲的丛林舒服多了。”</p></div></article><article class="entry"><p class="page">Lower part · ch. 36</p><blockquote class="latin">Zhao the Poet promptly corrected him: &#x27;First you break out in a cold sweat. One, two, three—three seconds later you&#x27;re so delighted you start sweating with heat!&#x27;</blockquote><div class="orig"><p>赵诗人马上纠正道：“先是一身冷汗，一二三，三秒钟后就快活得浑身冒热汗啦！”</p></div></article><article class="entry"><p class="page">Lower part · ch. 36</p><blockquote class="latin">Word of the three men&#x27;s street performance reached Lin Hong that day. Furious, she went home ready to explode. But the sight of Song Gang sitting miserably on the sofa softened her: he was only trying to earn more for the family. Outside, she saw Zhao the Poet swaggering toward her, and all her anger turned on him.</blockquote><div class="orig"><p>三个人在大街上的表演当天就传到林红耳朵里了，林红气得浑身发抖，回到家里本来是要大发脾气的，看到宋钢坐在沙发上忐忑不安的可怜模样，她心又软了，心想宋钢是为了给家里多挣钱，她摇摇头走到了屋外，看到赵诗人神气活现地走了过来，林红的怒火全冲着他去了。</p></div></article></section></noscript></main>

/* ============================================================
   Likes + moderated comments — same Worker as the other notes.
   Leaving the placeholder (or '') renders the page without any
   interactive parts; the notes themselves still work offline.
   ============================================================ */
const API = 'https://reading-notes-api.YOUR-SUBDOMAIN.workers.dev';
const PAGE_ID = 'xiongdi';
const API_ON = /^https?:\/\//.test(API) && !API.includes('YOUR-SUBDOMAIN');

UI.pref = {en:'preface', zh:'自序', fr:'préface', es:'prefacio'};
UI.modNote = {
  en:'Anyone may like a passage or leave a comment on it. Likes appear at once; comments are read and approved by me before they are shown.',
  zh:'任何人都可以给某一条点讚或留言。点讚即时生效；留言经我阅读并审核通过后才会显示。',
  fr:'Chacun peut aimer un passage ou y laisser un commentaire. Les « j’aime » apparaissent aussitôt ; les commentaires sont lus et validés par moi avant d’être affichés.',
  es:'Cualquiera puede dar «me gusta» a un pasaje o dejar un comentario. Los «me gusta» aparecen al instante; los comentarios los leo y apruebo yo antes de mostrarse.'
};
UI.like     = {en:'Like', zh:'点讚', fr:'J’aime', es:'Me gusta'};
UI.liked    = {en:'Liked', zh:'已讚', fr:'Aimé', es:'Te gusta'};
UI.cmt      = {en:'Comments', zh:'留言', fr:'Commentaires', es:'Comentarios'};
UI.cmtNone  = {en:'No comments on this passage yet.', zh:'这一条还没有留言。', fr:'Aucun commentaire sur ce passage.', es:'Aún no hay comentarios en este pasaje.'};
UI.fName    = {en:'Name or nickname', zh:'昵称', fr:'Nom ou pseudonyme', es:'Nombre o apodo'};
UI.fEmail   = {en:'Email — optional, never shown', zh:'邮箱 — 选填，不会公开', fr:'E-mail — facultatif, jamais affiché', es:'Correo — opcional, nunca se muestra'};
UI.fBody    = {en:'What this passage made you think…', zh:'这段让你想到了什么……', fr:'Ce que ce passage vous a inspiré…', es:'Qué te hizo pensar este pasaje…'};
UI.fSend    = {en:'Send for review', zh:'提交审核', fr:'Envoyer pour validation', es:'Enviar para revisión'};
UI.fSending = {en:'Sending…', zh:'提交中……', fr:'Envoi…', es:'Enviando…'};
UI.fQueued  = {en:'Thank you. Your comment is in the review queue and will appear here once approved.', zh:'谢谢。留言已进入审核队列，通过后会显示在这里。', fr:'Merci. Votre commentaire est en attente de validation et apparaîtra ici une fois approuvé.', es:'Gracias. Tu comentario está en la cola de revisión y aparecerá aquí una vez aprobado.'};
UI.fModNote = {en:'Moderated before publication. Your email is only visible to the site owner.', zh:'发布前需审核。邮箱仅站主可见。', fr:'Modéré avant publication. Votre e-mail n’est visible que par le propriétaire du site.', es:'Moderado antes de publicarse. Tu correo solo lo ve el propietario del sitio.'};
UI.errName  = {en:'Please enter a name.', zh:'请填昵称。', fr:'Veuillez indiquer un nom.', es:'Indica un nombre.'};
UI.errBody  = {en:'Please write something first.', zh:'请先写点什么。', fr:'Veuillez d’abord écrire quelque chose.', es:'Escribe algo primero.'};
UI.errRate  = {en:'That is a lot of comments for one hour — please come back later.', zh:'一小时内留言太多了，请稍后再来。', fr:'Cela fait beaucoup de commentaires en une heure — revenez plus tard.', es:'Son muchos comentarios en una hora; vuelve más tarde.'};
UI.errNet   = {en:'Could not send — please try again.', zh:'提交失败，请再试一次。', fr:'Envoi impossible — veuillez réessayer.', es:'No se pudo enviar; inténtalo de nuevo.'};

let lang = 'en';
try {
  const saved = localStorage.getItem('jg-lang');
  if (saved === 'zh' || saved === 'fr' || saved === 'es' || saved === 'en') lang = saved;
} catch (_) {}

let visitor = '';
try {
  visitor = localStorage.getItem('jg-visitor') || '';
  if (!/^[a-z0-9]{8,40}$/.test(visitor)) {
    visitor = Math.random().toString(36).slice(2, 12) + Date.now().toString(36);
    localStorage.setItem('jg-visitor', visitor);
  }
} catch (_) { visitor = 'anon' + Math.random().toString(36).slice(2, 10); }

let SOCIAL = null;          // {likes:{}, mine:[], comments:{}}
const OPEN = new Set();     // entry ids whose comment panel is expanded

const $ = (id) => document.getElementById(id);
const el = (tag, cls) => { const n = document.createElement(tag); if (cls) n.className = cls; return n; };
const LOCALE = {en:'en-GB', zh:'zh-CN', fr:'fr-FR', es:'es-ES'};

function pageChip(e){
  const n = el('span','page' + (e.p ? '' : ' approx'));
  if (e.p){ n.textContent = 'p. ' + e.p; n.title = 'Printed page visible in the photographed copy.'; }
  else {
    const part = UI.refPart[lang][e.part === 'u' ? 0 : 1];
    n.textContent = part + ' · ' + UI.refCh[lang] + (lang === 'zh' ? e.chapter + '章' : ' ' + e.chapter);
    n.title = 'Section and chapter; the paper page number is not visible in the source photograph.';
  }
  return n;
}

function heartSvg(){
  const s = document.createElementNS('http://www.w3.org/2000/svg','svg');
  s.setAttribute('viewBox','0 0 24 24'); s.setAttribute('class','heart'); s.setAttribute('aria-hidden','true');
  const path = document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('d','M12 20s-7-4.4-7-9.3A4.2 4.2 0 0 1 12 7.6a4.2 4.2 0 0 1 7 3.1C19 15.6 12 20 12 20Z');
  s.append(path); return s;
}

/* ---------------------------------------------------------------- comments */

function commentList(eid){
  const items = (SOCIAL && SOCIAL.comments[eid]) || [];
  if (!items.length){ const p = el('p','cnone'); p.textContent = UI.cmtNone[lang]; return p; }
  const ul = el('ul','clist');
  items.forEach(c => {
    const li = el('li','citem');
    const who = el('span','who'); who.textContent = c.name;
    const at = el('span','at');
    at.textContent = new Date(c.ts).toLocaleDateString(LOCALE[lang], {year:'numeric', month:'short', day:'numeric'});
    const body = el('p'); body.textContent = c.body;
    li.append(who, at, body); ul.append(li);
  });
  return ul;
}

function commentForm(eid){
  const form = el('form','cform');
  form.noValidate = true;
  const opened = Date.now();

  const two = el('div','two');
  const name = el('input'); name.type = 'text'; name.maxLength = 40;
  name.placeholder = UI.fName[lang]; name.autocomplete = 'nickname';
  const mail = el('input'); mail.type = 'email'; mail.maxLength = 120;
  mail.placeholder = UI.fEmail[lang]; mail.autocomplete = 'email';
  two.append(name, mail);

  const hp = el('input','hp'); hp.type = 'text'; hp.tabIndex = -1;
  hp.setAttribute('aria-hidden','true'); hp.autocomplete = 'off'; hp.name = 'website';

  const body = el('textarea'); body.maxLength = 1500; body.placeholder = UI.fBody[lang];
  const send = el('button','send'); send.type = 'submit'; send.textContent = UI.fSend[lang];
  const msg = el('p','cmsg');
  const note = el('p','cmoderation'); note.textContent = UI.fModNote[lang];

  form.append(two, hp, body, send, msg, note);

  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    msg.className = 'cmsg';
    if (!name.value.trim()){ msg.classList.add('bad'); msg.textContent = UI.errName[lang]; name.focus(); return; }
    if (body.value.trim().length < 2){ msg.classList.add('bad'); msg.textContent = UI.errBody[lang]; body.focus(); return; }
    send.disabled = true; send.textContent = UI.fSending[lang];
    try {
      const r = await fetch(API + '/v1/comment', {
        method:'POST', headers:{'content-type':'application/json'},
        body: JSON.stringify({
          page: PAGE_ID, entry: eid, visitor, lang,
          name: name.value, email: mail.value, body: body.value,
          website: hp.value, dwell: Date.now() - opened
        })
      });
      if (r.status === 429){ msg.classList.add('bad'); msg.textContent = UI.errRate[lang]; }
      else if (!r.ok){ msg.classList.add('bad'); msg.textContent = UI.errNet[lang]; }
      else {
        msg.classList.add('ok'); msg.textContent = UI.fQueued[lang];
        name.value = ''; mail.value = ''; body.value = '';
      }
    } catch (_) { msg.classList.add('bad'); msg.textContent = UI.errNet[lang]; }
    send.disabled = false; send.textContent = UI.fSend[lang];
  });

  return form;
}

function buildSocial(card, e){
  const eid = e.id;
  const row = el('div','social');

  const likeN = (SOCIAL && SOCIAL.likes[eid]) || 0;
  const mine = !!(SOCIAL && SOCIAL.mine.includes(eid));

  const likeBtn = el('button','likebtn' + (mine ? ' on' : ''));
  likeBtn.type = 'button';
  likeBtn.setAttribute('aria-pressed', String(mine));
  const likeLabel = el('span'); likeLabel.textContent = (mine ? UI.liked : UI.like)[lang];
  const likeCount = el('span','n'); likeCount.textContent = likeN ? ' ' + likeN : '';
  likeBtn.append(heartSvg(), likeLabel, likeCount);

  likeBtn.addEventListener('click', async () => {
    likeBtn.disabled = true;
    try {
      const r = await fetch(API + '/v1/like', {
        method:'POST', headers:{'content-type':'application/json'},
        body: JSON.stringify({page: PAGE_ID, entry: eid, visitor})
      });
      if (r.ok){
        const d = await r.json();
        SOCIAL.likes[eid] = d.count;
        if (d.liked){ if (!SOCIAL.mine.includes(eid)) SOCIAL.mine.push(eid); }
        else SOCIAL.mine = SOCIAL.mine.filter(x => x !== eid);
        likeBtn.classList.toggle('on', d.liked);
        likeBtn.setAttribute('aria-pressed', String(d.liked));
        likeLabel.textContent = (d.liked ? UI.liked : UI.like)[lang];
        likeCount.textContent = d.count ? ' ' + d.count : '';
      }
    } catch (_) {}
    likeBtn.disabled = false;
  });

  const nCmt = ((SOCIAL && SOCIAL.comments[eid]) || []).length;
  const cmtBtn = el('button','cmtbtn'); cmtBtn.type = 'button';
  cmtBtn.textContent = UI.cmt[lang] + (nCmt ? ' ' + nCmt : '');
  cmtBtn.setAttribute('aria-expanded', String(OPEN.has(eid)));

  row.append(likeBtn, cmtBtn);

  const panel = el('div','cpanel');
  panel.hidden = !OPEN.has(eid);
  if (OPEN.has(eid)) panel.append(commentList(eid), commentForm(eid));

  cmtBtn.addEventListener('click', () => {
    const open = panel.hidden;
    panel.hidden = !open;
    cmtBtn.setAttribute('aria-expanded', String(open));
    if (open){
      OPEN.add(eid);
      if (!panel.childElementCount) panel.append(commentList(eid), commentForm(eid));
    } else OPEN.delete(eid);
  });

  card.append(row, panel);
}

function mountSocial(){
  if (!API_ON || !SOCIAL) return;
  document.querySelectorAll('.entry').forEach(card => {
    if (card.querySelector('.social')) return;
    const e = ENTRIES.find(x => x.id === card.dataset.eid);
    if (e) buildSocial(card, e);
  });
}

async function loadSocial(){
  if (!API_ON) return;
  try {
    const r = await fetch(API + '/v1/state?page=' + encodeURIComponent(PAGE_ID) + '&visitor=' + encodeURIComponent(visitor));
    if (!r.ok) return;
    const d = await r.json();
    SOCIAL = {likes: d.likes || {}, mine: d.mine || [], comments: d.comments || {}};
    const n = $('modnote');
    if (n){ n.hidden = false; n.querySelector('span').textContent = UI.modNote[lang]; }
    mountSocial();
  } catch (_) { /* offline or not deployed yet — page stays static */ }
}

/* ------------------------------------------------------------------ render */

function renderEntry(e){
  const card = el('article','entry');
  card.dataset.eid = e.id;
  const top = el('div','entry-top');
  top.append(pageChip(e));
  card.append(top);

  const q = el('blockquote', lang === 'zh' ? '' : 'latin');
  q.textContent = e[lang];
  card.append(q);

  if (lang !== 'zh') {
    const o = el('div','orig');
    const lab = el('p','orig-label'); lab.textContent = UI.orig[lang];
    const t = el('p'); t.textContent = e.zh;
    o.append(lab, t); card.append(o);
  }

  if (e.cut) {
    const c = el('p','cutnote'); c.textContent = UI.cut[lang];
    card.append(c);
  }

  return card;
}

let filter = 'all';

function renderMain(){
  const main = $('main'); main.replaceChildren();
  STORIES.forEach(st => {
    if (filter !== 'all' && filter !== st.id) return;
    const sec = el('section','story'); sec.dataset.s = st.id;
    const head = el('div','story-head');
    const h2 = el('h2','story-title'); h2.textContent = st.t[lang];
    head.append(h2);
    if (lang !== 'zh' && st.zh !== st.t[lang]) { const z = el('span','story-zh'); z.textContent = st.zh; head.append(z); }
    if (st.range) { const r = el('span','range'); r.textContent = st.range; head.append(r); }
    const sub = el('p','story-sub'); sub.textContent = st.s[lang];
    sec.append(head, sub);
    ENTRIES.filter(e => e.s === st.id).forEach(e => sec.append(renderEntry(e)));
    main.append(sec);
  });
  mountSocial();
}

function renderChrome(){
  document.documentElement.lang = (lang === 'zh' ? 'zh-Hans' : lang);
  $('backlink').textContent = UI.back[lang];
  $('eyebrow').textContent = UI.eyebrow[lang];
  $('booktitle').textContent = '《兄弟》';
  $('byline').textContent = UI.byline[lang];

  const f = $('facts'); f.replaceChildren();
  UI.facts[lang].forEach(([b, t]) => {
    const li = el('li'); const strong = el('b'); strong.textContent = b;
    li.append(strong, document.createTextNode(' ' + t)); f.append(li);
  });

  $('prov-heading').textContent = UI.provHead[lang];
  $('prov-body').textContent = UI.provBody[lang];
  const pm = $('prov-meta'); pm.replaceChildren();
  UI.provRows[lang].forEach(([label,value]) => {
    const dt = el('dt'); dt.textContent = label;
    const dd = el('dd'); dd.textContent = value;
    pm.append(dt,dd);
  });
  const mn = $('modnote');
  if (mn && SOCIAL) { mn.hidden = false; mn.querySelector('span').textContent = UI.modNote[lang]; }

  const fl = $('filters'); fl.replaceChildren();
  const mk = (id, label) => {
    const b = el('button'); b.type = 'button'; b.textContent = label;
    b.setAttribute('aria-pressed', String(filter === id));
    b.addEventListener('click', () => { filter = id; renderChrome(); renderMain(); window.scrollTo({top:0, behavior:'smooth'}); });
    fl.append(b);
  };
  mk('all', UI.all[lang]);
  STORIES.forEach(st => mk(st.id, st.t[lang]));

  $('signature').textContent = UI.sig[lang];

  document.querySelectorAll('.langbar button[data-l]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.l === lang)));
}

document.querySelectorAll('.langbar button[data-l]').forEach(b => {
  b.addEventListener('click', () => {
    lang = b.dataset.l;
    try { localStorage.setItem('jg-lang', lang); } catch (_) {}
    renderChrome(); renderMain();
  });
});

renderChrome();
renderMain();
loadSocial();
</script>
