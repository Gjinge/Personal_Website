<html lang="en">
<head>

<title>朝闻道 · Reading Notes — Liu Cixin</title>

<style>
:root{
  --bg:#080d17; --panel:#101828; --panel-2:#0c1422; --line:#1e2c44;
  --ink:#e6edf7; --muted:#8fa3bf; --dim:#63758f;
  --accent:#7cc5ff; --accent-2:#ffc46b; --mark:#ff8a6b; --warn:#b98cff;
  --serif:"Noto Serif CJK SC","Source Han Serif SC","Songti SC",Georgia,"Times New Roman",serif;
  --sans:"Noto Sans CJK SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.75;
  -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 15% -10%,rgba(124,197,255,.10),transparent 60%),
                   radial-gradient(900px 500px at 95% 8%,rgba(255,196,107,.07),transparent 60%);
  background-attachment:fixed;}
.wrap{max-width:900px;margin:0 auto;padding:16px}
a{color:var(--accent)}

/* ---------- language bar ---------- */
.langbar{display:flex;justify-content:flex-end;gap:6px;padding-block:14px 0;flex-wrap:wrap}
.langbar a.back{margin-right:auto;font-size:.8rem;color:var(--muted);text-decoration:none;align-self:center}
.langbar a.back:hover{color:var(--ink)}
.langbar button{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;
  padding:5px 12px;font-size:.76rem;letter-spacing:.05em;cursor:pointer;font-family:inherit;transition:.15s}
.langbar button:hover{color:var(--ink);border-color:var(--accent)}
.langbar button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#06121f;font-weight:600}

/* ---------- header ---------- */
header.hero{padding-block:34px 28px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:.74rem;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin:0 0 14px}
h1{font-family:var(--serif);font-size:clamp(1.9rem,6vw,3rem);line-height:1.25;margin:0 0 6px;font-weight:600}
h1 .by{display:block;font-family:var(--sans);font-size:.9rem;font-weight:400;letter-spacing:.16em;color:var(--muted);margin-top:12px}
.hero-note{color:var(--muted);max-width:62ch;margin:18px 0 0;font-size:.95rem}
.facts{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px;padding:0;list-style:none}
.facts li{background:var(--panel);border:1px solid var(--line);border-radius:999px;
  padding:7px 14px;font-size:.8rem;color:var(--muted)}
.facts b{color:var(--ink);font-weight:600}

/* ---------- provenance banner ---------- */
.provenance{margin-top:26px;border:1px solid rgba(185,140,255,.38);background:rgba(185,140,255,.09);
  border-radius:14px;padding:18px 20px}
.provenance h2{font-family:var(--sans);font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--warn);margin:0 0 10px;font-weight:700;display:flex;align-items:center;gap:8px}
.provenance h2 svg{width:15px;height:15px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.8}
.provenance p{margin:0 0 8px;font-size:.88rem;color:#ded2f5}
.provenance p:last-child{margin-bottom:0}
.provenance dl{margin:12px 0 0;display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:.82rem}
.provenance dt{color:var(--warn);white-space:nowrap}
.provenance dd{margin:0;color:#ded2f5}
.provenance code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.94em;
  background:rgba(0,0,0,.3);padding:1px 6px;border-radius:5px;color:#efe6ff}

/* ---------- toc / filter ---------- */
nav.toc{position:sticky;top:0;z-index:5;background:rgba(8,13,23,.93);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);margin-inline:-16px;padding:10px 16px}
.toc-row{max-width:900px;margin:0 auto;display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
.toc-row button{flex:0 0 auto;background:transparent;border:1px solid var(--line);color:var(--muted);
  border-radius:999px;padding:6px 13px;font-size:.8rem;cursor:pointer;font-family:inherit;white-space:nowrap;transition:.15s}
.toc-row button:hover{color:var(--ink);border-color:var(--accent)}
.toc-row button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#06121f;font-weight:600}

/* ---------- story ---------- */
section.story{padding-block:44px 8px;border-bottom:1px solid var(--line)}
section.story:last-of-type{border-bottom:0}
.story-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;margin-bottom:4px}
h2.story-title{font-family:var(--serif);font-size:clamp(1.35rem,4vw,1.8rem);margin:0;font-weight:600}
.story-zh{font-family:var(--serif);color:var(--muted);font-size:1rem}
.range{font-size:.78rem;color:var(--dim);letter-spacing:.06em}
.story-sub{color:var(--muted);font-size:.88rem;margin:8px 0 26px;max-width:62ch}

/* ---------- entry ---------- */
.entry{background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:16px}
.entry:hover{border-color:#2b3f60}
.entry-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
.page{font-family:var(--serif);font-size:.82rem;color:var(--accent);border:1px solid rgba(124,197,255,.35);
  background:rgba(124,197,255,.08);border-radius:6px;padding:2px 9px;letter-spacing:.04em}
.page.approx{color:var(--muted);border-color:var(--line);background:transparent}
.kind{font-size:.72rem;letter-spacing:.08em;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.kind.circle{color:var(--accent-2);border-color:rgba(255,196,107,.35)}
.star{color:var(--accent-2);font-size:.9rem}
blockquote{margin:0;font-family:var(--serif);font-size:1.02rem;line-height:2;color:var(--ink);
  border-left:2px solid #2b3f60;padding-left:16px}
blockquote.latin{line-height:1.85}
blockquote em{font-style:italic;color:var(--dim)}
blockquote b{color:#fff;font-weight:600}
.orig{margin:14px 0 0;border-left:2px solid #22324c;padding-left:16px}
.orig-label{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:0 0 6px;
  display:flex;align-items:center;gap:6px}
.orig-label::before{content:"";width:14px;height:1px;background:var(--dim);display:inline-block}
.orig p{margin:0;font-family:var(--serif);font-size:.94rem;line-height:1.95;color:var(--muted)}
.mynote{margin:14px 0 0;padding:11px 14px;border-radius:10px;background:rgba(255,138,107,.08);
  border:1px solid rgba(255,138,107,.28);font-size:.9rem;color:#ffd9cd}
.mynote b{color:var(--mark);font-weight:600;letter-spacing:.06em;font-size:.72rem;display:block;margin-bottom:3px;text-transform:uppercase}
.mynote .note-orig{display:block;margin-top:5px;font-family:var(--serif);color:#c7a396;font-size:.88rem}
.src{margin:12px 0 0;font-size:.72rem;color:#4d5e77;letter-spacing:.03em;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

/* ---------- footer ---------- */
footer{padding-block:40px 60px;color:var(--dim);font-size:.82rem;border-top:1px solid var(--line);margin-top:40px}
footer p{margin:0 0 8px;max-width:72ch}
.legend{display:flex;flex-wrap:wrap;gap:16px;margin:0 0 18px;padding:0;list-style:none;font-size:.78rem}
.legend li{display:flex;align-items:center;gap:7px}
.swatch{width:11px;height:11px;border-radius:3px;display:inline-block;flex:0 0 auto}

@media (max-width:560px){
  .entry{padding:16px 15px;border-radius:12px}
  blockquote{font-size:.98rem;line-height:1.95;padding-left:13px}
  .provenance{padding:15px 16px}
}
@media print{
  body{background:#fff;color:#000}
  nav.toc,.langbar{display:none}
  .entry{break-inside:avoid;border-color:#ccc;background:#fff}
}
</style>

const ENTRIES = [
/* ========== 带上她的眼睛 ========== */
{s:'eyes',p:'3',k:['u'],src:'IMG_20250215_211027',
 zh:'在庞大的太空服中，她更显得矮小，一副可怜兮兮的样子，显然刚刚体会到太空不是她在大学图书馆中想象的浪漫天堂，某些方面可能比地狱还稍差些。',
 en:'Inside the huge spacesuit she looked smaller still, and rather pitiful — she had clearly just discovered that space was not the romantic paradise she had imagined in the university library, and that in some respects it was rather worse than hell.',
 fr:'Dans son énorme combinaison, elle paraissait plus petite encore, et plutôt pitoyable : elle venait manifestement de découvrir que l’espace n’était pas le paradis romantique qu’elle avait imaginé à la bibliothèque universitaire, et qu’à certains égards il valait un peu moins que l’enfer.',
 es:'Dentro del enorme traje espacial parecía aún más menuda, con un aire lastimoso: era evidente que acababa de descubrir que el espacio no era el paraíso romántico que había imaginado en la biblioteca de la universidad y que, en ciertos aspectos, resultaba algo peor que el infierno.'},
{s:'eyes',p:'10',k:['u2'],src:'IMG_20250215_212101',
 zh:'所以人们不再珍视什么了，面对着一大堆伸手可得的水果，他们把拿起的每一个咬一口就扔掉。',
 en:'And so people no longer treasured anything. Faced with a great heap of fruit all within arm’s reach, they took a bite out of each piece and threw it away.',
 fr:'Aussi les gens ne tenaient-ils plus rien pour précieux. Devant un grand tas de fruits tous à portée de main, ils croquaient chacun une fois, puis le jetaient.',
 es:'Por eso la gente ya no valoraba nada. Ante un gran montón de frutas al alcance de la mano, daban un mordisco a cada una y la tiraban.'},
{s:'eyes',p:'14',a:1,k:['u'],src:'IMG_20250215_212536',
 zh:'世界在我的眼中仍是灰色的，但星星点点的嫩绿在其中出现，并在增多。当这种变化发展到让我觉察出来时，我又想起了她。也是无意识的。',
 en:'The world was still grey to me, but points of tender green had begun to appear in it, and to multiply. By the time the change had gone far enough for me to notice it, I was thinking of her again — and again without meaning to.',
 fr:'Le monde restait gris à mes yeux, mais des points de vert tendre y apparaissaient, et se multipliaient. Quand ce changement fut assez avancé pour que je le remarque, je repensais à elle — là encore, sans l’avoir voulu.',
 es:'El mundo seguía siendo gris para mí, pero en él empezaban a aparecer puntos de verde tierno, y se multiplicaban. Cuando el cambio avanzó lo bastante para que yo lo notara, volvía a pensar en ella; también esta vez, sin proponérmelo.'},
{s:'eyes',p:'19',k:['u'],src:'IMG_20250215_213252',
 zh:'那个没有日出的细雨蒙蒙的草原早晨，竟是她最后看到的地面世界。',
 en:'That drizzling morning on the grassland, with no sunrise in it, turned out to be the last of the surface world she would ever see.',
 fr:'Ce matin de bruine sur la steppe, sans lever de soleil, fut le dernier morceau du monde de surface qu’elle devait voir.',
 es:'Aquella mañana de llovizna en la pradera, sin amanecer, resultó ser lo último que vería del mundo de la superficie.'},
{s:'eyes',p:'19',k:['u'],src:'IMG_20250215_213252',
 zh:'后来「落日六号」同地面只能保持着语音和数据通信，而这个联系也在一天深夜中断了，她被永远孤独地封闭于地心中。',
 en:'After that, “Sunset 6” could keep only voice and data contact with the surface — and late one night even that link broke off. She was sealed into the centre of the Earth, alone, for good.',
 fr:'Par la suite, « Coucher de soleil 6 » ne conserva avec la surface qu’une liaison vocale et de données — et, tard un soir, ce lien lui-même se rompit. Elle fut scellée au centre de la Terre, seule, pour toujours.',
 es:'Después, «Puesta de Sol 6» solo pudo mantener con la superficie comunicación de voz y datos, y una noche también ese enlace se cortó. Quedó encerrada para siempre, sola, en el centro de la Tierra.'},

/* ========== 朝闻道 ========== */
{s:'dao',p:'29',a:1,k:['c'],src:'IMG_20250215_214409',
 zh:'正当丁仪陷入绝望之时，茫茫的星海扰动起来，群星汇成的洪流在旋转奔涌，当一切都平静下来时，宇宙间的所有星星构成了一只大眼睛，那只百亿光年大小的眼睛如钻石粉末在黑色的天鹅绒上撒出的图案，它盯着丁仪看，波函数在瞬间坍缩，如倒着放映的焰火影片，他的量子存在凝聚于宇宙中微不足道的一点上，他睁开双眼，回到了现实。',
 en:'Just as Ding Yi was sinking into despair, the boundless sea of stars began to stir; the torrent of massed suns wheeled and surged, and when everything had settled again, all the stars in the universe had formed a single enormous eye — an eye ten billion light-years across, like a pattern of diamond dust scattered on black velvet. It fixed its gaze on Ding Yi. In an instant the wave function collapsed; like a film of fireworks run backwards, his quantum existence condensed onto one negligible point in the universe. He opened his eyes and was back in the real world.',
 fr:'Au moment où Ding Yi sombrait dans le désespoir, l’immense mer d’étoiles s’agita ; le torrent des soleils rassemblés tournoya et déferla, et lorsque tout se fut apaisé, toutes les étoiles de l’univers formaient un unique œil gigantesque — un œil de dix milliards d’années-lumière, semblable à de la poussière de diamant répandue sur du velours noir. Il fixait Ding Yi. En un instant, la fonction d’onde s’effondra ; comme un film de feu d’artifice projeté à l’envers, son existence quantique se condensa en un point insignifiant de l’univers. Il ouvrit les yeux et retrouva le réel.',
 es:'Justo cuando Ding Yi se hundía en la desesperación, el inmenso mar de estrellas se agitó; el torrente de soles reunidos giró y se desbordó, y cuando todo volvió a calmarse, todas las estrellas del universo formaban un único ojo enorme: un ojo de diez mil millones de años luz, como un dibujo de polvo de diamante esparcido sobre terciopelo negro. Miraba fijamente a Ding Yi. En un instante la función de onda colapsó; como una película de fuegos artificiales proyectada al revés, su existencia cuántica se condensó en un punto insignificante del universo. Abrió los ojos y regresó a la realidad.'},
{s:'dao',p:'38',a:1,k:['c'],src:'IMG_20250215_215423',
 zh:'丁仪若有所悟地点点头：「要说也是这样，那个伟大的望星人！」……以后我就来到了你们的世界，监视着文明的进程，像是守护着一个玩火的孩子，周围被火光照亮的宇宙使这孩子着迷，他不顾一切地把火越燃越烧旺，直到现在，宇宙已有被这火烧毁的危险。',
 en:'Ding Yi nodded, as if something had dawned on him: “Put that way, it is the same — that great star-gazer!” … After that I came to your world and watched over the progress of civilisation, like someone minding a child playing with fire. The universe lit up around him by the flames fascinates the child, and he feeds the fire higher and higher, heedless of everything, until now the universe itself is in danger of being burned away.',
 fr:'Ding Yi hocha la tête, comme éclairé : « À ce compte-là, c’est pareil — ce grand contemplateur d’étoiles ! » … Ensuite, je suis venu dans votre monde surveiller la marche de la civilisation, comme on garde un enfant qui joue avec le feu. L’univers éclairé alentour par les flammes fascine cet enfant, et il attise le feu de plus en plus fort, sans rien vouloir entendre, si bien qu’à présent l’univers risque d’être consumé.',
 es:'Ding Yi asintió, como si algo se le hubiera revelado: «Dicho así, es lo mismo: ¡aquel gran contemplador de estrellas!» … Después vine a vuestro mundo y vigilé el avance de la civilización, como quien cuida a un niño que juega con fuego. El universo iluminado alrededor por las llamas fascina al niño, y él aviva el fuego cada vez más, sin atender a nada, hasta que ahora el propio universo corre el riesgo de arder.'},
{s:'dao',p:'41',a:1,k:['u'],src:'IMG_20250215_215543',
 zh:'而大统一模型在技术上的应用会使你们拥有产生更高能量过程的手段，你们会试图用这种能量过程击穿不同宇宙间的壁垒，不同宇宙间的真空存在着能级差，这就会导致真空衰变，同时毁灭两个或更多的宇宙。',
 en:'And the technological application of the grand unified model would give you the means to produce higher-energy processes. You would try to use such processes to punch through the barrier between different universes; and because the vacua of different universes are at different energy levels, that would set off vacuum decay and destroy two or more universes at once.',
 fr:'Or l’application technique du modèle de grande unification vous donnerait les moyens de produire des processus de plus haute énergie. Vous tenteriez de vous en servir pour percer la barrière entre des univers différents ; et comme les vides de ces univers se situent à des niveaux d’énergie différents, cela déclencherait une désintégration du vide et détruirait d’un coup deux univers, ou davantage.',
 es:'Y la aplicación técnica del modelo de gran unificación os daría los medios para generar procesos de energía aún mayor. Intentaríais usarlos para perforar la barrera entre universos distintos; y como los vacíos de esos universos están a niveles de energía diferentes, eso desencadenaría una desintegración del vacío y destruiría a la vez dos universos, o más.'},
{s:'dao',p:'42',a:1,k:['c'],src:'IMG_20250215_215620',
 zh:'「你把宇宙的终极奥秘告诉我，然后毁灭我。」排险者对他点点头：「说说看。」……「给你三天时间考虑。」排险者说，他的回答不假思索，十分迅速，紧接着丁仪的话。丁仪欣喜若狂：「你是说这可行？！」排险者点点头。',
 en:'“Tell me the ultimate secret of the universe, and then destroy me.” The Sentinel nodded at him: “Go on.” … “You have three days to think it over,” said the Sentinel. The answer came without hesitation, very fast, right on the heels of Ding Yi’s words. Ding Yi was beside himself: “You mean it can be done?!” The Sentinel nodded.',
 fr:'« Révèle-moi le secret ultime de l’univers, puis détruis-moi. » Le Démineur lui fit un signe de tête : « Continue. » … « Tu as trois jours pour y réfléchir », dit le Démineur. La réponse vint sans hésitation, très vite, dans le sillage immédiat des mots de Ding Yi. Ding Yi exulta : « Vous voulez dire que c’est possible ?! » Le Démineur acquiesça.',
 es:'«Dime el secreto último del universo y después destrúyeme.» El Desactivador asintió: «Sigue.» … «Tienes tres días para pensarlo», dijo el Desactivador. La respuesta llegó sin vacilar, muy rápida, pisando las palabras de Ding Yi. Ding Yi se llenó de júbilo: «¿Quiere decir que es posible?» El Desactivador asintió.'},
{s:'dao',p:'44',k:['u'],src:'IMG_20250215_220145 / 220216',
 zh:'没人能惩罚你，你也别把即将发生的事伪装成一种惩罚，你正走在通向自己梦中天堂的路上！',
 en:'No one can punish you, and don’t you dress up what is about to happen as a punishment either — you are walking the road to your own dreamed-of paradise!',
 fr:'Personne ne peut te punir, et ne va pas déguiser en châtiment ce qui va arriver : tu marches sur la route du paradis dont tu rêves !',
 es:'Nadie puede castigarte, y no disfraces de castigo lo que está a punto de ocurrir: ¡vas camino del paraíso con el que sueñas!'},
{s:'dao',p:'50',k:['u'],src:'IMG_20250215_221047',
 zh:'即使在我自己的世界中，也并非所有的成员都愿意为此牺牲一切。所以，我们自己没有继续进行探索超统一模型的高能试验，并在整个宇宙中建立了排险系统。',
 en:'Even in my own world, not every member is willing to sacrifice everything for this. That is why we ourselves stopped carrying out the high-energy experiments that probe the super-unified model, and why we built the sentinel system across the whole universe.',
 fr:'Même dans mon propre monde, tous les membres ne sont pas prêts à tout sacrifier pour cela. Voilà pourquoi nous avons nous-mêmes cessé les expériences de haute énergie qui sondent le modèle super-unifié, et pourquoi nous avons établi le système de déminage dans tout l’univers.',
 es:'Incluso en mi propio mundo, no todos sus miembros están dispuestos a sacrificarlo todo por esto. Por eso nosotros mismos dejamos de realizar los experimentos de alta energía que exploran el modelo superunificado, y por eso instalamos el sistema de desactivación en todo el universo.'},
{s:'dao',p:'51 – 52',k:['u','span'],src:'IMG_20250215_221235 / 221243',
 zh:'他们声称为全人类的利益而研究，其实只是拿社会的财富满足自己的欲望，满足他们对那种玄虚的宇宙和谐美的变态欲望，这和拿公款嫖娼有什么区别？！',
 en:'They claim to do research for the good of all humanity, but in fact they are spending society’s wealth to gratify their own craving — their perverse craving for that airy “harmonious beauty of the universe”. How is that any different from whoring on public money?!',
 fr:'Ils prétendent chercher pour le bien de l’humanité entière, mais en réalité ils dépensent la richesse de la société pour assouvir leur propre désir — leur désir pervers de cette « beauté harmonieuse de l’univers » toute vaporeuse. En quoi est-ce différent d’aller aux filles avec l’argent public ?!',
 es:'Dicen investigar por el bien de toda la humanidad, pero en realidad gastan la riqueza de la sociedad para satisfacer su propio deseo: ese deseo perverso de la etérea «belleza armónica del universo». ¿En qué se diferencia eso de irse de putas con dinero público?'},
{s:'dao',p:'56',k:['u'],src:'IMG_20250215_221732',
 zh:'文文，你爸爸是世界上最坏的爸爸，但他真的很想去那个动物园。',
 en:'Wenwen, your father is the worst father in the world — but he really does want to go to that zoo.',
 fr:'Wenwen, ton papa est le pire papa du monde — mais il a vraiment très envie d’aller dans ce zoo-là.',
 es:'Wenwen, tu papá es el peor papá del mundo, pero de verdad tiene muchas ganas de ir a ese zoológico.'},
{s:'dao',p:'56',k:['u'],src:'IMG_20250215_221732',
 zh:'你听到这回答后很失望，说我并不是真的爱你，如果我真的爱你，就会弄瞎自己的双眼，让一个美丽的泉子永远留在心中。',
 en:'You were disappointed by that answer. You said I didn’t really love you — that if I really loved you I would blind myself, so that a beautiful Quanzi would stay in my heart for ever.',
 fr:'Cette réponse t’a déçue. Tu as dit que je ne t’aimais pas vraiment : que si je t’aimais vraiment, je me crèverais les yeux, pour qu’une belle Quanzi demeure à jamais dans mon cœur.',
 es:'Aquella respuesta te decepcionó. Dijiste que yo no te amaba de verdad: que si te amara de verdad, me cegaría los ojos para que una hermosa Quanzi permaneciera para siempre en mi corazón.'},
{s:'dao',p:'59',k:['u','qg'],src:'IMG_20250215_221953',
 zh:'文文，你当初报考你爸爸母校的物理系，现在又要攻读量子引力专业的博士学位，妈都没拦你。你可以成为一名理论物理学家，甚至可以把这门学科当作自己唯一的精神寄托，但，文文，妈求你了，千万不要越过那条线啊！',
 en:'Wenwen, when you applied to the physics department at your father’s old university, and now that you want a doctorate in quantum gravity, I never stood in your way. You may become a theoretical physicist; you may even make the subject the one thing you live for. But Wenwen — I’m begging you — whatever you do, never cross that line!',
 fr:'Wenwen, quand tu as demandé à entrer au département de physique de l’université de ton père, et maintenant que tu veux un doctorat en gravité quantique, je ne t’ai jamais retenue. Tu peux devenir physicienne théoricienne ; tu peux même faire de cette discipline ton unique raison de vivre. Mais Wenwen — je t’en supplie — surtout, ne franchis jamais cette ligne !',
 es:'Wenwen, cuando te presentaste al departamento de física de la universidad de tu padre, y ahora que quieres un doctorado en gravedad cuántica, nunca te lo impedí. Puedes ser física teórica; puedes incluso hacer de esa disciplina tu único sostén espiritual. Pero, Wenwen, te lo ruego: no cruces jamás esa línea.'},

/* ========== 思想者 ========== */
{s:'thinker',p:'66',k:['c'],src:'IMG_20250216_113323',
 zh:'「我觉得自己在从事一项很美的事业，走进恒星世界，就像进入一个无限广阔的花园，这里的每一朵花都不相同……您肯定觉得这个比喻有些奇怪，但我确实有这种感觉。」',
 en:'“I feel I am engaged in a very beautiful line of work. Entering the world of the stars is like walking into an infinitely wide garden where no two flowers are alike… You must find the comparison odd, but that really is how it feels to me.”',
 fr:'« J’ai le sentiment d’exercer un très beau métier. Entrer dans le monde des étoiles, c’est comme pénétrer dans un jardin infiniment vaste où aucune fleur ne ressemble à une autre… Vous devez trouver cette comparaison bizarre, mais c’est vraiment ce que je ressens. »',
 es:'«Siento que me dedico a un oficio muy hermoso. Entrar en el mundo de las estrellas es como entrar en un jardín infinitamente vasto donde no hay dos flores iguales… Seguro que le parece una comparación extraña, pero es exactamente lo que siento.»'},
{s:'thinker',p:'67',a:1,k:['u'],src:'IMG_20250216_113507',
 zh:'他生活的那座大都市里，每时每刻都有上百万个青春靓丽的女孩子在追逐着浮华和虚荣，像一大群做布朗运动的分子，没有给思想留出哪怕一瞬间的宁静。但谁能想到，在这远离尘嚣的云山上，却有一个文静的女孩子在长久地凝视星空……',
 en:'In the great city where he lived, at every moment a million young and beautiful girls were chasing glitter and vanity, like a vast swarm of molecules in Brownian motion, leaving thought not one instant of quiet. And yet, who would have guessed that up here on this cloud-covered mountain, far from the din of the world, a quiet girl was gazing at the stars, hour after hour…',
 fr:'Dans la grande ville où il vivait, à chaque instant un million de jeunes filles ravissantes couraient après le clinquant et la vanité, comme un immense essaim de molécules en mouvement brownien, sans laisser à la pensée un seul instant de calme. Et pourtant, qui aurait cru que là-haut, sur cette montagne noyée de nuages, loin du vacarme du monde, une jeune fille silencieuse contemplait longuement le ciel étoilé…',
 es:'En la gran ciudad donde vivía, a cada instante un millón de muchachas jóvenes y hermosas perseguían el oropel y la vanidad, como un enjambre inmenso de moléculas en movimiento browniano, sin dejar al pensamiento ni un instante de sosiego. Y sin embargo, quién iba a imaginar que allá arriba, en aquella montaña entre nubes, lejos del estruendo del mundo, una muchacha callada contemplaba largamente el cielo estrellado…'},
{s:'thinker',p:'69',a:1,k:['u'],src:'IMG_20250216_113647',
 zh:'后来，他渐渐意识到自己的什么东西留在了思云山上。',
 en:'Later he came slowly to realise that something of his own had been left behind on Siyun Mountain.',
 fr:'Plus tard, il comprit peu à peu qu’une part de lui-même était restée sur le mont Siyun.',
 es:'Más tarde fue comprendiendo poco a poco que algo suyo se había quedado en el monte Siyun.'},
{s:'thinker',p:'70',a:1,k:['u'],src:'IMG_20250216_113904',
 zh:'想到十年后她还能认出自己，他感到一丝安慰。',
 en:'The thought that she could still recognise him ten years later gave him a small measure of comfort.',
 fr:'L’idée qu’elle pût encore le reconnaître dix ans après lui procura une petite consolation.',
 es:'Pensar que ella todavía pudiera reconocerlo diez años después le dio un pequeño consuelo.'},
{s:'thinker',p:'73',a:1,k:['u'],src:'IMG_20250216_114504',
 zh:'您同别人讨论思想是来自大脑还是心脏，有什么感觉？',
 en:'How would you feel, discussing with someone whether thought comes from the brain or from the heart?',
 fr:'Que ressentiriez-vous, à discuter avec quelqu’un pour savoir si la pensée vient du cerveau ou du cœur ?',
 es:'¿Qué sentiría usted si tuviera que discutir con alguien si el pensamiento viene del cerebro o del corazón?'},
{s:'thinker',p:'73',a:1,k:['c'],src:'IMG_20250216_114504',
 zh:'他无话可说了，看到她在看表，他便起身告辞，她没有挽留他，但沿下山的公路送了他很远。他克制了朝她要电话号码的冲动，因为他知道，自己在她眼中不过是一个十年后又偶然重逢的陌路人而已。',
 en:'He had nothing left to say. Seeing her glance at her watch, he rose and took his leave; she did not press him to stay, but walked with him a long way down the mountain road. He suppressed the urge to ask for her phone number, because he knew that in her eyes he was no more than a stranger she happened to run into again after ten years.',
 fr:'Il n’avait plus rien à dire. La voyant regarder sa montre, il se leva et prit congé ; elle ne le retint pas, mais l’accompagna longtemps sur la route qui descendait la montagne. Il réprima l’envie de lui demander son numéro, car il savait qu’à ses yeux il n’était qu’un inconnu croisé de nouveau par hasard, dix ans plus tard.',
 es:'No le quedaba nada que decir. Al verla mirar el reloj, se levantó y se despidió; ella no lo retuvo, pero lo acompañó un buen trecho por la carretera que bajaba de la montaña. Él reprimió el impulso de pedirle su número, porque sabía que a sus ojos no era más que un desconocido con el que se había topado otra vez, diez años después.'},
{s:'thinker',p:'75',a:1,k:['u','cend'],src:'IMG_20250216_114826',
 zh:'思云山天文台在四年前就不存在了，那里的建筑变成了度假别墅，在这个季节已空无一人，他到那儿去干什么？想到这里他停下了脚步，这七年的岁月显示出了它的力量，他再也不可能像当年那样轻松地登山了。他犹豫了一会儿，最终还是放弃了返回的念头，<b>继续向前走。</b>',
 en:'The Siyun Mountain observatory had ceased to exist four years earlier; its buildings had been turned into holiday villas, empty at this season. What was he going up there for? The thought stopped him in his tracks. Those seven years had shown their power: he could no longer climb as easily as he once had. He hesitated a while, then gave up the idea of turning back and <b>walked on.</b>',
 fr:'L’observatoire du mont Siyun n’existait plus depuis quatre ans ; ses bâtiments avaient été convertis en villas de villégiature, désertes en cette saison. Qu’allait-il donc faire là-haut ? Cette pensée l’arrêta net. Ces sept années avaient montré leur force : il ne pouvait plus grimper aussi aisément qu’autrefois. Il hésita un moment, puis renonça à faire demi-tour et <b>continua d’avancer.</b>',
 es:'El observatorio del monte Siyun había dejado de existir cuatro años antes; sus edificios se habían convertido en chalés de vacaciones, vacíos en esa estación. ¿A qué iba él allí? La idea lo detuvo en seco. Aquellos siete años habían mostrado su fuerza: ya no podía subir con la ligereza de antes. Vaciló un momento y al final abandonó la idea de volverse y <b>siguió adelante.</b>'},
{s:'thinker',p:'77',a:1,k:['u'],src:'IMG_20250216_115220',
 zh:'在第三次从思云山返回后，他突然看到了生命的尽头，他和她的生命都再也没有多少个十七年了，宇宙的广漠使光都慢得像蜗牛，生命更是灰尘般微不足道。',
 en:'After coming down from Siyun Mountain the third time, he suddenly saw the end of life. Neither his life nor hers had many more seventeen-year spans left in it. The vastness of the universe makes even light crawl like a snail; a life is more negligible still, a speck of dust.',
 fr:'Après être redescendu du mont Siyun pour la troisième fois, il aperçut soudain la fin de la vie. Ni sa vie ni celle de cette femme ne comptaient encore beaucoup de tranches de dix-sept ans. L’immensité de l’univers fait ramper la lumière elle-même comme un escargot ; une vie est plus négligeable encore, un grain de poussière.',
 es:'Tras bajar del monte Siyun por tercera vez, vio de pronto el final de la vida. Ni a la de él ni a la de ella les quedaban muchos tramos de diecisiete años. La inmensidad del universo hace que hasta la luz se arrastre como un caracol; una vida es aún más insignificante, una mota de polvo.'},
{s:'thinker',p:'80',k:['u'],src:'IMG_20250216_115515',
 zh:'但今夜没有月亮，无论怎样想象，他都觉得面前的她还是三十四年前那个月光中的少女，她的双眸映着星光，让他的心溶化在往昔的感觉中。',
 en:'But there was no moon that night. However he tried to picture it, the woman before him was still the girl in the moonlight of thirty-four years ago; starlight was reflected in her eyes, and his heart dissolved into the feeling of that former time.',
 fr:'Mais cette nuit-là, il n’y avait pas de lune. Il avait beau s’efforcer de l’imaginer, la femme devant lui restait la jeune fille du clair de lune, trente-quatre ans plus tôt ; la lumière des étoiles se reflétait dans ses yeux, et son cœur à lui se dissolvait dans la sensation d’autrefois.',
 es:'Pero aquella noche no había luna. Por más que intentara imaginarlo, la mujer que tenía delante seguía siendo la muchacha bajo la luz de la luna de treinta y cuatro años atrás; la luz de las estrellas se reflejaba en sus ojos, y el corazón de él se disolvía en la sensación de aquel tiempo.'},
{s:'thinker',p:'83',a:1,k:['u'],src:'IMG_20250216_120529',
 zh:'那个宇宙，要比这个星光灿烂的已膨胀了一百五十亿年的外部宇宙更为宏大，外部宇宙虽然广阔，毕竟已被证明是有限的，而思想的宇宙是无限。',
 en:'That universe is grander than this star-blazing outer universe that has been expanding for fifteen billion years. Vast as the outer universe is, it has after all been proved finite — whereas the universe of thought is infinite.',
 fr:'Cet univers-là est plus vaste que cet univers extérieur, éclatant d’étoiles, qui s’étend depuis quinze milliards d’années. Si immense soit-il, l’univers extérieur a tout de même été démontré fini — tandis que l’univers de la pensée est infini.',
 es:'Ese universo es más grandioso que este universo exterior, resplandeciente de estrellas, que lleva quince mil millones de años expandiéndose. Por vasto que sea, el universo exterior ha quedado demostrado finito; en cambio, el universo del pensamiento es infinito.'},

/* ========== 中国太阳 ========== */
{s:'sun',p:'87',a:1,k:['u'],src:'IMG_20250216_123036',
 zh:'他就走在多皱的脸上，看着周围这广阔的黄土地，干干的黄褐色，布满了水土流失刻出的裂纹……他看不到这张伸向天边的巨脸的眼睛，但能觉到它的存在吗？这里的什么都是这样，树、地、房子、人，黑黄黑黄，皱巴巴的。',
 en:'He was walking on a wrinkled face. Around him lay this wide loess land, a dry yellow-brown scored all over with the cracks that erosion had cut… He could not see the eyes of that enormous face stretching to the horizon — but could he feel that it was there? Everything here was like that: the trees, the ground, the houses, the people, all of them a dark sallow yellow, all of them creased.',
 fr:'Il marchait sur un visage ridé. Autour de lui s’étendait cette vaste terre de lœss, d’un brun jaune et sec, tout entaillée des fissures creusées par l’érosion… Il ne voyait pas les yeux de cet immense visage qui s’étirait jusqu’à l’horizon — mais pouvait-il en sentir la présence ? Ici, tout était ainsi : les arbres, le sol, les maisons, les gens, d’un jaune sombre et terne, et tout fripé.',
 es:'Caminaba sobre un rostro arrugado. A su alrededor se extendía esta ancha tierra de loess, de un pardo amarillento y seco, surcada por completo de grietas abiertas por la erosión… No alcanzaba a ver los ojos de aquel rostro inmenso que llegaba hasta el horizonte, pero ¿podía sentir que estaba allí? Aquí todo era así: los árboles, el suelo, las casas, la gente, todo de un amarillo oscuro y macilento, todo arrugado.'},
{s:'sun',p:'89',a:1,k:['u'],src:'IMG_20250216_123147',
 zh:'国强告诉他，矿上打的是深井，水当然不苦了，但他又加了一句：「城里的水才叫好喝呢！」',
 en:'Guoqiang told him that the mine had sunk a deep well, so of course the water wasn’t bitter — and then he added: “Now, the water in the city, that’s what I call good!”',
 fr:'Guoqiang lui expliqua que la mine avait creusé un puits profond, et que l’eau n’était donc pas amère — puis il ajouta : « Mais l’eau de la ville, ça, c’est de la bonne eau ! »',
 es:'Guoqiang le contó que en la mina habían abierto un pozo profundo, así que el agua no era amarga; y luego añadió: «¡El agua de la ciudad sí que es buena!»'},
{s:'sun',p:'91',k:['u'],src:'IMG_20250216_123304',
 zh:'可都是甜水啊！因为有了甜水，这个黑乎乎的世界在水娃眼中变得美丽无比。',
 en:'But it was all sweet water! Because of that sweet water, this grimy black world became, in Shui Wa’s eyes, beautiful beyond measure.',
 fr:'Mais c’était de l’eau douce, toute cette eau ! Grâce à elle, ce monde tout noir devint, aux yeux de Shui Wa, d’une beauté sans pareille.',
 es:'¡Pero toda era agua dulce! Gracias a esa agua dulce, aquel mundo ennegrecido se volvió, a los ojos de Shui Wa, hermosísimo.'},
{s:'sun',p:'93',a:1,k:['u'],st:1,src:'IMG_20250216_123556',
 zh:'这一晚上到十一点，水娃竟挣了十四块！但在回去的路上，二宝一脸晦气，说今天生意不好，言下之意显然是水娃抢了他的买卖。',
 en:'By eleven that evening Shui Wa had made fourteen yuan! But on the way back Erbao wore a sour face and said business had been bad today — plainly implying that Shui Wa had taken his trade.',
 fr:'Ce soir-là, à onze heures, Shui Wa avait gagné quatorze yuans ! Mais sur le chemin du retour, Erbao faisait grise mine et disait que les affaires avaient été mauvaises — sous-entendant clairement que Shui Wa lui avait pris ses clients.',
 es:'¡Esa noche, a las once, Shui Wa había ganado catorce yuanes! Pero de vuelta, Erbao puso mala cara y dijo que ese día el negocio había ido mal, dando a entender claramente que Shui Wa le había quitado la clientela.',
 n:{zh:'确实好多想不到的「平常」。',
    en:'There really are so many kinds of “ordinary” you’d never think of.',
    fr:'Il y a vraiment tant de sortes d’« ordinaire » auxquelles on ne penserait jamais.',
    es:'De verdad hay muchísimas clases de «lo normal» en las que uno nunca pensaría.'}},
{s:'sun',p:'95',k:['u'],src:'IMG_20250216_124242',
 zh:'虽落到这地步，但这人一点儿都没有消沉，每天仍东奔西跑，企图为这种新材料的应用找到出路，他告诉水娃，这是自己跑过的第十三个城市了。',
 en:'Reduced to this, the man was not in the least downcast: he still ran about from dawn to dusk trying to find an application for this new material. He told Shui Wa that this was the thirteenth city he had worked his way through.',
 fr:'Réduit à cette condition, l’homme n’était nullement abattu : il courait encore du matin au soir pour trouver un débouché à ce nouveau matériau. Il dit à Shui Wa que c’était la treizième ville qu’il écumait ainsi.',
 es:'Pese a haber caído tan bajo, aquel hombre no estaba nada abatido: seguía corriendo de un lado a otro tratando de encontrar una salida para ese nuevo material. Le dijo a Shui Wa que esta era la decimotercera ciudad que recorría.'},
{s:'sun',p:'97',a:1,k:['c'],src:'IMG_20250216_124810',
 zh:'他现在想到了什么呢？这事与他陆海，一个住在闷热的简易房中的潦倒流浪者，能有什么关系？',
 en:'What was he thinking about now? What could any of this have to do with him — Lu Hai, a down-and-out drifter living in a stifling shack?',
 fr:'À quoi pensait-il donc ? Qu’est-ce que tout cela pouvait bien avoir à faire avec lui, Lu Hai, vagabond sans le sou logé dans une baraque étouffante ?',
 es:'¿En qué estaba pensando ahora? ¿Qué podía tener que ver todo eso con él, Lu Hai, un vagabundo arruinado que vivía en un barracón sofocante?'},
{s:'sun',p:'97',a:1,k:['u'],src:'IMG_20250216_124810',
 zh:'好大的一只金鸟儿，其实它以前一直在我的头顶盘旋，我他妈居然没感觉到！',
 en:'What a huge golden bird — and it had been circling over my head all along, and I damn well never felt it!',
 fr:'Quel énorme oiseau d’or — et il tournoyait au-dessus de ma tête depuis toujours, et moi, bon sang, je ne l’avais pas senti !',
 es:'¡Qué pájaro dorado tan enorme! Y llevaba todo el tiempo dando vueltas sobre mi cabeza, y yo, maldita sea, ni lo noté.'},
{s:'sun',p:'98',a:1,k:['u'],src:'IMG_20250216_124923',
 zh:'这人现在已一文不名，今天连旅馆都住不起了，早餐还是水娃出的钱，甚至连他那个大太阳灶，也在起程前留给房东顶了房费，现在，他已是一个除了梦之外什么都没有的乞丐。',
 en:'The man was now without a penny; today he could not even afford a hotel, and Shui Wa had paid for his breakfast. Even his big solar cooker had been left with the landlord before he set out, to cover the rent. He was now a beggar who owned nothing but a dream.',
 fr:'L’homme n’avait plus un sou ; ce jour-là il ne pouvait même pas se payer une chambre d’hôtel, et c’est Shui Wa qui avait réglé le petit-déjeuner. Même son grand cuiseur solaire, il l’avait laissé au propriétaire avant de partir, en paiement du loyer. Il était désormais un mendiant qui ne possédait rien qu’un rêve.',
 es:'El hombre no tenía ya un céntimo; ese día ni siquiera podía pagarse un hotel, y el desayuno lo había pagado Shui Wa. Incluso su gran cocina solar se la había dejado al casero antes de partir, para saldar el alquiler. Ahora era un mendigo que no poseía nada salvo un sueño.'},
{s:'sun',p:'99',k:['u'],src:'IMG_20250216_125103',
 zh:'你嘛，每月工资一千五，工作日管午餐，公司代买人身保险。',
 en:'As for you: fifteen hundred a month, lunch provided on working days, and the company takes out personal insurance for you.',
 fr:'Quant à toi : mille cinq cents par mois, déjeuner fourni les jours ouvrés, et l’entreprise te souscrit une assurance personnelle.',
 es:'En cuanto a ti: mil quinientos al mes, comida los días de trabajo y la empresa te contrata un seguro personal.'},
{s:'sun',p:'100',k:['u'],src:'IMG_20250216_125414',
 zh:'这位著名建筑师说，倾斜更能表现出上升感。……但这位建筑大师的祖宗八代都被北京的蜘蛛人骂遍了，清洗航天大厦的活儿对他们几乎是一场噩梦，因为这个倾斜的大厦整整一面全是倒角墙，高达四百米，与地面的角度小到六十五度。',
 en:'The famous architect said that the tilt expressed a stronger sense of ascent. … But Beijing’s spidermen cursed that master architect back eight generations: cleaning the Aerospace Tower was very nearly a nightmare for them, because one entire face of the leaning building was an overhanging wall, four hundred metres high and set at only sixty-five degrees to the ground.',
 fr:'Le célèbre architecte expliquait que l’inclinaison exprimait mieux l’élan vers le haut. … Mais les « hommes-araignées » de Pékin maudissaient ce grand architecte jusqu’à la huitième génération de ses ancêtres : nettoyer la tour de l’Aérospatiale tenait pour eux du cauchemar, car toute une face de l’édifice penché était un mur en surplomb, haut de quatre cents mètres et incliné à seulement soixante-cinq degrés par rapport au sol.',
 es:'El famoso arquitecto decía que la inclinación expresaba mejor la sensación de ascenso. … Pero los «hombres araña» de Pekín maldecían a aquel maestro hasta la octava generación de sus antepasados: limpiar la Torre Aeroespacial era para ellos poco menos que una pesadilla, porque toda una cara del edificio inclinado era un muro en voladizo de cuatrocientos metros de altura, con solo sesenta y cinco grados respecto al suelo.'},
{s:'sun',p:'101',a:1,k:['u'],src:'IMG_20250216_125542',
 zh:'镀膜高级建筑玻璃让他这一年的活儿白干了。',
 en:'Coated high-grade architectural glass had made a whole year of his work count for nothing.',
 fr:'Le verre architectural haut de gamme à revêtement avait réduit à néant une année entière de son travail.',
 es:'El vidrio arquitectónico de alta gama con recubrimiento dejó en nada todo un año de su trabajo.'},
{s:'sun',p:'102',a:1,k:['c'],src:'IMG_20250216_125727',
 zh:'水娃从这经历中学到了一个哲理：事情得从高处才能看清楚。如果你淹没于这座大都市之中，周围的一切是那么纷繁复杂，城市仿佛是一个无边无际的迷宫，但从这高处一看，整座城市不过是一个有一千多万人的大蚂蚁窝罢了，而它周围的世界又是那么广阔。',
 en:'From this Shui Wa drew a piece of philosophy: you can only see a thing clearly from high up. Down in the great city, everything around you is so tangled and complicated that the place seems a maze without end; but seen from up here, the whole city is nothing more than a big anthill with ten million ants in it — and the world around it is so very wide.',
 fr:'Shui Wa tira de cela une petite philosophie : on ne voit clairement les choses que d’en haut. Noyé dans la grande ville, tout ce qui vous entoure est si enchevêtré et si complexe que l’endroit ressemble à un labyrinthe sans fin ; mais vu d’ici, la ville entière n’est qu’une grosse fourmilière de dix millions de fourmis — et le monde alentour est si vaste.',
 es:'De esto Shui Wa sacó una filosofía: las cosas solo se ven claras desde lo alto. Si te hundes en la gran ciudad, todo lo que te rodea es tan enmarañado y complejo que parece un laberinto sin fin; pero visto desde aquí arriba, la ciudad entera no es más que un gran hormiguero con diez millones de hormigas, y el mundo que la rodea es tan ancho.'},
{s:'sun',p:'105',a:1,k:['u'],src:'IMG_20250216_130133',
 zh:'我几乎对一切都失去了信心……但这个时代真的充满了机遇。水娃点点头：「到处都是金色的鸟儿。」',
 en:'I had almost lost faith in everything… but this age really is full of opportunity. Shui Wa nodded: “Golden birds everywhere.”',
 fr:'J’avais presque perdu foi en tout… mais cette époque est vraiment pleine d’occasions. Shui Wa hocha la tête : « Des oiseaux d’or partout. »',
 es:'Casi había perdido la fe en todo… pero esta época está de verdad llena de oportunidades. Shui Wa asintió: «Pájaros dorados por todas partes.»'},
{s:'sun',p:'114',a:1,k:['u'],src:'IMG_20250216_131625',
 zh:'在我的童年和少年时代，进入太空是一种飘渺的事业，我清楚地记得，一位伟人在访问肯尼迪航天中心时，把一位美国宇航员称作神仙。',
 en:'In my childhood and youth, going into space was a remote and hazy sort of undertaking. I remember clearly that a great man, visiting the Kennedy Space Center, called an American astronaut an immortal.',
 fr:'Dans mon enfance et mon adolescence, aller dans l’espace était une entreprise vaporeuse et lointaine. Je me souviens nettement qu’un grand homme, en visite au centre spatial Kennedy, avait qualifié un astronaute américain d’immortel.',
 es:'En mi infancia y juventud, ir al espacio era una empresa vaga y lejana. Recuerdo con claridad que un gran hombre, de visita en el Centro Espacial Kennedy, llamó «inmortal» a un astronauta estadounidense.'},
{s:'sun',p:'116',k:['u'],src:'IMG_20250216_131945',
 zh:'水娃震惊地发现，这个小黑点竟是这银色大地上的一座大楼，这座大楼是一个全密封的圆柱体，水娃知道，这就是中国太阳的控制站。',
 en:'To his astonishment, Shui Wa saw that the little black dot was a building standing on this silver land — a fully sealed cylinder. He knew what it was: the control station of the Sun of China.',
 fr:'Stupéfait, Shui Wa découvrit que ce petit point noir était un bâtiment dressé sur cette terre d’argent — un cylindre entièrement hermétique. Il savait ce que c’était : la station de contrôle du Soleil de Chine.',
 es:'Shui Wa descubrió, atónito, que aquel puntito negro era un edificio alzado sobre esa tierra plateada: un cilindro completamente sellado. Sabía lo que era: la estación de control del Sol de China.'},
{s:'sun',p:'118',a:1,k:['u'],src:'IMG_20250216_132304',
 zh:'娃啊，你是在那个日头上吗，它在俺们头上照着呢，这夜跟白天一样啊！',
 en:'Son, are you up on that sun? It’s shining right over our heads — this night is like broad daylight!',
 fr:'Petit, tu es sur ce soleil-là ? Il brille juste au-dessus de nos têtes — cette nuit, c’est comme en plein jour !',
 es:'Hijo, ¿estás en ese sol? Nos alumbra justo encima de la cabeza: ¡esta noche parece pleno día!'},
{s:'sun',p:'123',a:1,k:['u'],src:'IMG_20250216_141256',
 zh:'他明白了自己所看到的所有星空，在大得无法想象的宇宙中也只是一粒灰尘，而这整个宇宙，不过是百亿年前一次壮丽焰火的余烬。',
 en:'He understood that all the starry sky he could see was only a speck of dust in a universe too large to imagine — and that this whole universe was no more than the embers of one magnificent firework, ten billion years ago.',
 fr:'Il comprit que tout le ciel étoilé qu’il voyait n’était qu’un grain de poussière dans un univers trop vaste pour être imaginé — et que cet univers entier n’était que la cendre d’un feu d’artifice magnifique, dix milliards d’années plus tôt.',
 es:'Comprendió que todo el cielo estrellado que alcanzaba a ver era apenas una mota de polvo en un universo demasiado grande para imaginarlo, y que ese universo entero no era más que el rescoldo de unos fuegos artificiales magníficos, diez mil millones de años atrás.'},
{s:'sun',p:'123',a:1,k:['u'],src:'IMG_20250216_141256',
 zh:'许多年前作为蜘蛛人踏上第一座高楼的楼顶时，水娃看到了整个北京；来到中国太阳时，他看到了整个地球；现在，水娃面对着他人生第三个壮丽的时刻，他站到了宇宙的楼顶上。',
 en:'Many years ago, when as a spiderman he first set foot on the roof of a high building, Shui Wa saw the whole of Beijing; when he came to the Sun of China, he saw the whole Earth. Now he stood before the third magnificent moment of his life: he had climbed onto the roof of the universe.',
 fr:'Bien des années plus tôt, quand, en « homme-araignée », il avait posé le pied sur le toit de son premier gratte-ciel, Shui Wa avait vu tout Pékin ; en arrivant au Soleil de Chine, il avait vu toute la Terre. À présent il se tenait devant le troisième moment magnifique de sa vie : il était monté sur le toit de l’univers.',
 es:'Muchos años atrás, cuando como «hombre araña» pisó por primera vez la azotea de un rascacielos, Shui Wa vio todo Pekín; al llegar al Sol de China, vio toda la Tierra. Ahora estaba ante el tercer momento magnífico de su vida: se había subido al tejado del universo.'},
{s:'sun',p:'124',a:1,k:['u'],st:1,src:'IMG_20250216_141627',
 zh:'「不是说不好，但经济利益更好，如果从那时开始人类就不惜代价，做飞向外太空的赔本买卖，地球现在可能还在贫困之中，你我这样的普通人反而不可能进入太空，虽然只是在近地空间。朋友，别忘了霍金的话，他那套东西一般人玩不了的！」',
 en:'“I’m not saying it isn’t good — but economic return is better. If from that time on humanity had spared no cost and gone in for the loss-making business of flying to deep space, the Earth might still be mired in poverty, and ordinary people like you and me would never have got into space at all, even just into near-Earth orbit. My friend, don’t forget what Hawking said: that sort of thing isn’t for ordinary people to play with!”',
 fr:'« Je ne dis pas que ce n’est pas bien — mais le rendement économique, c’est mieux. Si, dès cette époque, l’humanité n’avait reculé devant aucun coût pour se lancer dans le commerce à perte des vols vers l’espace lointain, la Terre serait peut-être encore dans la misère, et des gens ordinaires comme toi et moi n’auraient jamais atteint l’espace, fût-ce l’orbite basse. Mon ami, n’oublie pas ce que disait Hawking : ce genre de chose n’est pas à la portée du commun des mortels ! »',
 es:'«No digo que no esté bien, pero el beneficio económico está mejor. Si desde entonces la humanidad no hubiera reparado en gastos y se hubiera metido en el negocio ruinoso de volar al espacio profundo, la Tierra quizá seguiría sumida en la pobreza, y gente corriente como tú y como yo jamás habría llegado al espacio, ni siquiera a la órbita baja. Amigo, no olvides lo que dijo Hawking: ¡esas cosas no son para que las maneje cualquiera!»',
 n:{zh:'这就显出 Elon Musk 之伟力了。大家都这么想，但他做到了。',
    en:'This is exactly what makes Elon Musk’s achievement so striking. Everyone thinks this way — he actually did it.',
    fr:'C’est précisément ce qui fait ressortir la force d’Elon Musk. Tout le monde raisonne ainsi ; lui, il l’a fait.',
    es:'Esto es justo lo que hace resaltar la fuerza de Elon Musk. Todo el mundo piensa así; él lo hizo.'}},
{s:'sun',p:'126',k:['u'],src:'IMG_20250216_142311',
 zh:'现在进入近地空间的费用，只及乘飞机飞越太平洋费用的一半，太空旅行已变成了一件平常而平淡的事。但新一代人很难想象，在二十年前进入太空对一个普通人来说意味着什么。',
 en:'Getting into near-Earth space now costs only half as much as flying across the Pacific, and space travel has become an ordinary, unremarkable thing. But the new generation finds it hard to imagine what going into space meant to an ordinary person twenty years ago.',
 fr:'Atteindre l’orbite basse coûte aujourd’hui moitié moins qu’un vol au-dessus du Pacifique, et le voyage spatial est devenu une chose ordinaire, banale. Mais la nouvelle génération a peine à imaginer ce que signifiait, il y a vingt ans, aller dans l’espace pour une personne ordinaire.',
 es:'Llegar al espacio cercano cuesta hoy la mitad que un vuelo sobre el Pacífico, y viajar al espacio se ha vuelto algo corriente y anodino. Pero a la nueva generación le cuesta imaginar lo que significaba, hace veinte años, ir al espacio para una persona común.'},
{s:'sun',p:'126',a:1,k:['u'],src:'IMG_20250216_142316',
 zh:'我们这些人很普通，没什么可说的，我们能有这样不寻常的经历是因为中国太阳。这二十年来，它已成为我们的第二家园，在我们的心目中它很像一个微缩的地球。……我们每个人的家乡在镜面上也都有对应的位置，对那一块我们擦得最勤……',
 en:'We are ordinary people; there is nothing much to say about us. We have had this extraordinary experience only because of the Sun of China. Over these twenty years it has become our second home, and in our minds it is very like a miniature Earth. … Each of us has a spot on the mirror that corresponds to our home town, and that is the patch we polish most often…',
 fr:'Nous sommes des gens ordinaires, il n’y a pas grand-chose à dire de nous. Si nous avons vécu une expérience aussi extraordinaire, c’est grâce au Soleil de Chine. En vingt ans, il est devenu notre second foyer, et dans notre esprit il ressemble beaucoup à une Terre miniature. … Chacun de nous a, sur le miroir, un endroit qui correspond à son pays natal, et c’est ce carré-là que nous astiquons le plus souvent…',
 es:'Somos gente corriente, no hay mucho que contar de nosotros. Si hemos vivido una experiencia tan extraordinaria es gracias al Sol de China. En estos veinte años se ha convertido en nuestro segundo hogar, y en nuestra imaginación se parece mucho a una Tierra en miniatura. … Cada uno de nosotros tiene en el espejo un punto que corresponde a su tierra natal, y esa es la zona que fregamos con más esmero…'},
{s:'sun',p:'127',a:1,k:['c'],st:1,src:'IMG_20250216_142544',
 zh:'已是太空产业部部长的陆海接过了话头说……',
 en:'Lu Hai — by now Minister of the Space Industry — took up the thread and said…',
 fr:'Lu Hai — devenu entre-temps ministre de l’Industrie spatiale — reprit la parole et dit…',
 es:'Lu Hai —para entonces ya ministro de Industria Espacial— tomó la palabra y dijo…',
 n:{zh:'魔幻（第三字辨认不清，待确认）',
    en:'Magical realism. (The third character is illegible — to be confirmed.)',
    fr:'Réalisme magique. (Le troisième caractère est illisible — à confirmer.)',
    es:'Realismo mágico. (El tercer carácter es ilegible; queda por confirmar.)'}},
{s:'sun',p:'128',a:1,k:['u'],st:1,src:'IMG_20250216_142830',
 zh:'上世纪冷战结束后，经济准则一天天地统治世界，人类在这个准则下也取得了巨大的成就：现在，我们消灭了战争和贫困，恢复了生态，地球正在变成一个乐园。这就使我们更加坚信经济准则的正确性，它已变得至高无上，渗透到我们的每个细胞中，人类社会已变成了百分之百的经济社会，投入大于产出的事是再也不会做了。对月球的开发没有经济意义，至于进行恒星际航行，那是地地道道的精神变态，现在，人类只知道投入、产出，并享受这些产出了！',
 en:'After the Cold War ended last century, the economic criterion came day by day to rule the world, and under it humanity did achieve a great deal: we have now abolished war and poverty, restored the ecosystem, and the Earth is turning into a paradise. That only convinced us further that the economic criterion was right. It has become supreme; it has soaked into every one of our cells. Human society has become a one-hundred-per-cent economic society, and nothing whose input exceeds its output will ever be done again. Developing the Moon has no economic meaning; as for interstellar flight, that is out-and-out mental perversion. All humanity knows now is input, output, and enjoying the output!',
 fr:'Après la fin de la guerre froide, au siècle dernier, le critère économique en est venu, jour après jour, à régir le monde ; et sous son règne l’humanité a bel et bien accompli de grandes choses : nous avons aboli la guerre et la pauvreté, rétabli l’écosystème, et la Terre devient un paradis. Cela n’a fait que nous convaincre davantage de la justesse du critère économique. Il est devenu suprême, il a imprégné chacune de nos cellules. La société humaine est devenue une société cent pour cent économique, et l’on ne fera plus jamais rien dont la dépense excède le rendement. Exploiter la Lune n’a aucun sens économique ; quant au vol interstellaire, c’est de la perversion mentale pure et simple. Aujourd’hui, l’humanité ne connaît plus que l’investissement, le rendement, et la jouissance de ce rendement !',
 es:'Tras el fin de la Guerra Fría el siglo pasado, el criterio económico fue gobernando el mundo día tras día, y bajo él la humanidad logró de veras cosas enormes: hoy hemos eliminado la guerra y la pobreza, hemos restaurado el ecosistema y la Tierra se está convirtiendo en un paraíso. Eso no hizo sino convencernos más de que el criterio económico era el correcto. Se ha vuelto supremo; ha calado en cada una de nuestras células. La sociedad humana se ha vuelto cien por cien económica, y jamás se hará nada cuya inversión supere al rendimiento. Explotar la Luna carece de sentido económico; en cuanto al vuelo interestelar, es pura y llana perversión mental. Hoy la humanidad solo sabe de inversión, de rendimiento y de disfrutar ese rendimiento.',
 n:{zh:'Musk 就是变态',
    en:'Musk is exactly that kind of “pervert”.',
    fr:'Musk est précisément ce genre de « perverti ».',
    es:'Musk es exactamente ese tipo de «pervertido».'}},
{s:'sun',p:'130',a:1,k:['c'],src:'IMG_20250216_143421',
 zh:'水娃点点头：「是的，回不来了。有人满足于老婆孩子热炕头，从不向与己无关的尘世之外扫一眼；有的人则用尽全部生命，只为看一眼人类从未见过的事物。这两种人我都做过，我们有权选择各种生活，包括在十几光年之遥的太空中飘荡的一面镜子上的生活。」',
 en:'Shui Wa nodded: “That’s right, there is no coming back. Some people are content with a wife, children and a warm bed, and never once glance beyond the corner of the world that concerns them; others spend their whole lives just to catch sight of something no human being has ever seen. I have been both kinds of person. We have the right to choose any life we like — including life on a mirror drifting through space a dozen light-years away.”',
 fr:'Shui Wa hocha la tête : « Oui, il n’y a pas de retour. Certains se contentent d’une femme, d’enfants et d’un lit bien chaud, et ne jettent jamais un regard hors du coin de monde qui les concerne ; d’autres dépensent leur vie entière rien que pour apercevoir une chose qu’aucun être humain n’a jamais vue. J’ai été l’un et l’autre. Nous avons le droit de choisir n’importe quelle vie — y compris la vie sur un miroir dérivant dans l’espace à une douzaine d’années-lumière. »',
 es:'Shui Wa asintió: «Sí, no hay vuelta. Hay quien se contenta con mujer, hijos y una cama caliente, y jamás mira más allá del rincón del mundo que le atañe; y hay quien gasta la vida entera solo por vislumbrar algo que ningún ser humano ha visto nunca. Yo he sido las dos cosas. Tenemos derecho a elegir cualquier vida, incluida la vida sobre un espejo que flota en el espacio a más de diez años luz.»'},
{s:'sun',p:'133',a:1,k:['u'],src:'IMG_20250216_143949',
 zh:'这时北京的天已经大亮，陆海仍站在航天大厦的楼顶，望着朦胧的希望在这条小路上渐渐远去。',
 en:'By now the sky over Beijing was fully light, and Lu Hai was still standing on the roof of the Aerospace Tower, watching a dim hope recede along that little road.',
 fr:'Le ciel de Pékin était désormais tout à fait clair, et Lu Hai se tenait encore sur le toit de la tour de l’Aérospatiale, regardant un espoir confus s’éloigner le long de ce petit chemin.',
 es:'Para entonces el cielo de Pekín ya estaba del todo claro, y Lu Hai seguía en la azotea de la Torre Aeroespacial, viendo alejarse por aquel caminito una esperanza borrosa.'},
{s:'sun',p:'134',a:1,k:['u'],src:'IMG_20250216_144051',
 zh:'但水娃始终会牢记母亲行星上的一个叫中国的国度，牢记那个国度西部一片干旱土地上的一个小村庄，牢记村前的那条小路，他就是从那里启程的。',
 en:'But Shui Wa would always remember a country called China on his mother planet; would remember a small village on a stretch of arid land in the west of that country; would remember the little road in front of that village. It was from there that he set out.',
 fr:'Mais Shui Wa se souviendrait toujours d’un pays appelé Chine, sur sa planète mère ; d’un petit village posé sur une terre aride, à l’ouest de ce pays ; du petit chemin devant ce village. C’est de là qu’il était parti.',
 es:'Pero Shui Wa recordaría siempre un país llamado China en su planeta madre; recordaría una aldea pequeña en una tierra árida del oeste de ese país; recordaría el caminito que había delante de la aldea. Fue de allí de donde partió.'},

/* ========== 坍缩 ========== */
{s:'collapse',p:'142',a:1,k:['u'],src:'IMG_20250216_145639',
 zh:'我的世界是一个现实的，无诗意的，烦琐的世界，我们整天像蚂蚁一样忙碌，目光也像蚂蚁一样受到局限。有时深夜从办公室里出来，抬头看着星空，已是难得的奢侈了。您的世界充满着空灵与玄妙，您的思想跨越上百光年的空间和上百亿年的时间，地球对于您只是宇宙中的一粒灰尘，现世对于您只是永恒中短得无法测量的一瞬，整个宇宙似乎都是为了满足您的好奇心而存在的。说句真话，丁老，我真有些嫉妒您。我年轻时做过那样的梦，但进入您的世界太难了。',
 en:'My world is a real, unpoetic, fussy sort of world. We are busy all day like ants, and our field of vision is as narrow as an ant’s. To come out of the office late at night and lift my head to the stars is already a rare luxury. Your world is full of the ethereal and the profound; your thoughts span hundreds of light-years of space and tens of billions of years of time. To you the Earth is one speck of dust in the universe, and this present age an immeasurably brief instant in eternity — the whole universe seems to exist merely to satisfy your curiosity. To tell the truth, Old Ding, I do rather envy you. I dreamed that dream when I was young, but it is very hard to get into your world.',
 fr:'Mon monde est un monde réel, sans poésie, encombré de détails. Nous nous affairons tout le jour comme des fourmis, et notre regard est borné comme celui d’une fourmi. Sortir du bureau tard dans la nuit et lever les yeux vers les étoiles est déjà un luxe rare. Votre monde, lui, est plein d’éther et de mystère ; votre pensée franchit des centaines d’années-lumière et des dizaines de milliards d’années. Pour vous, la Terre n’est qu’un grain de poussière dans l’univers, et le temps présent un instant si bref qu’on ne peut le mesurer dans l’éternité — l’univers entier semble n’exister que pour satisfaire votre curiosité. À vrai dire, vieux Ding, je vous envie un peu. J’ai fait ce rêve dans ma jeunesse, mais il est bien difficile d’entrer dans votre monde.',
 es:'Mi mundo es un mundo real, sin poesía, lleno de menudencias. Nos afanamos todo el día como hormigas, y nuestra mirada está tan limitada como la de una hormiga. Salir de la oficina de madrugada y alzar la vista a las estrellas ya es un lujo raro. Su mundo, en cambio, está lleno de lo etéreo y lo profundo; su pensamiento cruza cientos de años luz y decenas de miles de millones de años. Para usted la Tierra es una mota de polvo en el universo, y este presente un instante tan breve que no puede medirse en la eternidad: el universo entero parece existir solo para satisfacer su curiosidad. La verdad, viejo Ding, le envidio un poco. De joven tuve ese sueño, pero entrar en su mundo es muy difícil.'},
{s:'collapse',p:'142',a:1,k:['c'],src:'IMG_20250216_145639',
 zh:'但今天晚上并不难，您至少可以在丁老的世界中待一会儿，一起目睹这个世界最伟大的一瞬间。',
 en:'But tonight it isn’t difficult at all — you can at least spend a little while inside Old Ding’s world, and witness with him the greatest instant that world has to offer.',
 fr:'Mais ce soir, ce n’est pas difficile du tout : vous pouvez au moins passer un moment dans le monde du vieux Ding, et assister avec lui à l’instant le plus grandiose que ce monde ait à offrir.',
 es:'Pero esta noche no es nada difícil: al menos puede pasar un rato dentro del mundo del viejo Ding y presenciar con él el instante más grandioso de ese mundo.'},
{s:'collapse',p:'146',a:1,k:['u'],src:'IMG_20250216_150304',
 zh:'您的坍缩，不过是夜空中那弱得不能再弱的光线频率的一点点变化而已，这变化，甚至那光线，如果不是由精密仪器放大上万倍，谁都看不到！坍缩是什么？对普通人来说什么都不是！宇宙膨胀或坍缩，对我们有什么区别？！但父亲对我们是重要的，您明白吗？！',
 en:'Your contraction is nothing but a tiny change in the frequency of the faintest possible light in the night sky. That change — even that light — no one can see at all unless precision instruments magnify it ten thousand times! What is contraction? To an ordinary person it is nothing! Whether the universe expands or contracts, what difference does it make to us?! But a father matters to us — do you understand that?!',
 fr:'Votre contraction n’est qu’une minuscule variation dans la fréquence de la lumière la plus faible qui soit dans le ciel nocturne. Cette variation — et même cette lumière — personne ne peut la voir, à moins que des instruments de précision ne l’amplifient dix mille fois ! Qu’est-ce que la contraction ? Pour une personne ordinaire, rien du tout ! Que l’univers s’étende ou se contracte, quelle différence cela fait-il pour nous ?! Mais un père, lui, compte pour nous — le comprenez-vous ?!',
 es:'Su contracción no es más que un cambio ínfimo en la frecuencia de la luz más débil que existe en el cielo nocturno. Ese cambio —y hasta esa luz— nadie puede verlo si no lo amplían diez mil veces unos instrumentos de precisión. ¿Qué es la contracción? Para una persona corriente, ¡nada! Que el universo se expanda o se contraiga, ¿qué diferencia nos hace? Pero un padre sí nos importa. ¿Lo entiende?'},
{s:'collapse',p:'147',a:1,k:['c'],src:'IMG_20250216_150503',
 zh:'但可悲的是，人们总要把这两个世界分开。……「不！基本粒子虽小，却组成了我们；宇宙虽大，我们身在其中。微观和宏观世界的每一个变化都牵动着我们的一切。」「可即将发生的宇宙坍缩牵动着我们的什么呢？」',
 en:'The sad thing is that people insist on keeping the two worlds apart. … “No! Elementary particles may be small, but they make us up; the universe may be vast, but we are inside it. Every change in the microscopic and the macroscopic world tugs at everything we are.” “And the coming contraction of the universe — what exactly does it tug at in us?”',
 fr:'Le triste, c’est que les gens tiennent toujours à séparer ces deux mondes. … « Non ! Les particules élémentaires ont beau être minuscules, elles nous composent ; l’univers a beau être immense, nous sommes dedans. Chaque changement du monde microscopique et du monde macroscopique tire sur tout ce que nous sommes. » « Et la contraction de l’univers qui vient — sur quoi tire-t-elle en nous, au juste ? »',
 es:'Lo triste es que la gente siempre quiere separar esos dos mundos. … «¡No! Las partículas elementales serán pequeñas, pero nos componen; el universo será enorme, pero estamos dentro de él. Cada cambio del mundo microscópico y del macroscópico tira de todo lo que somos.» «Y la contracción del universo que se avecina, ¿de qué tira exactamente en nosotros?»'},
{s:'collapse',p:'151',k:['c'],src:'IMG_20250216_151133',
 zh:'「不会的，你将在另一个时间里，现在的过去将是您的未来，我们现在就在那时的未来里。您不可能记住未来，蓝移开始时，您的未来一片空白，对它，您什么都不记得，什么都不知道。」',
 en:'“No, you won’t. You will be in another time: what is now the past will be your future, and we are already in that time’s future. You cannot remember the future. When the blue shift begins, your future will be a blank — of it you will remember nothing and know nothing.”',
 fr:'« Non. Vous serez dans un autre temps : ce qui est aujourd’hui le passé sera votre avenir, et nous sommes déjà dans l’avenir de ce temps-là. On ne peut pas se souvenir de l’avenir. Quand le décalage vers le bleu commencera, votre avenir sera une page blanche : vous n’en garderez aucun souvenir, vous n’en saurez rien. »',
 es:'«No lo hará. Estará usted en otro tiempo: lo que ahora es el pasado será su futuro, y nosotros ya estamos en el futuro de aquel tiempo. Nadie puede recordar el futuro. Cuando empiece el corrimiento al azul, su futuro será una página en blanco: no recordará nada de él, no sabrá nada.»'},
{s:'collapse',p:'151',k:['u'],src:'IMG_20250216_151133',
 zh:'您将会发现，从老年走向幼年，从成熟走向幼稚是多么合理，多么理所当然。',
 en:'You will find how reasonable, how entirely a matter of course it is to go from old age towards childhood, from maturity towards innocence.',
 fr:'Vous découvrirez à quel point il est raisonnable, à quel point il va de soi, d’aller de la vieillesse vers l’enfance, de la maturité vers la naïveté.',
 es:'Descubrirá lo razonable, lo absolutamente natural que resulta ir de la vejez a la niñez, de la madurez a la inocencia.'},
{s:'collapse',p:'152',a:1,k:['u'],src:'IMG_20250216_151139',
 zh:'……时间奇点，在那一点时间不存在。然后，我们将进入一个……',
 en:'…a time singularity; at that point time does not exist. And then we shall enter a…',
 fr:'… une singularité temporelle ; en ce point, le temps n’existe pas. Et ensuite, nous entrerons dans un…',
 es:'…una singularidad temporal; en ese punto el tiempo no existe. Y luego entraremos en un…',
 nt:1},

/* ========== 全频带阻塞干扰 ========== */
{s:'jam',p:'157',a:1,k:['u'],src:'IMG_20250216_170056',
 zh:'那是混杂在一起的歼击机的航迹，是俄罗斯空军和北约空军为争夺制空权所进行的一夜激战留下的。',
 en:'Those were the tangled contrails of fighter aircraft, left by a night of fierce fighting between the Russian and NATO air forces over control of the sky.',
 fr:'C’étaient les traînées entremêlées des chasseurs, laissées par une nuit de combats acharnés entre l’aviation russe et celle de l’OTAN pour la maîtrise du ciel.',
 es:'Eran las estelas entremezcladas de los cazas, dejadas por una noche de combates encarnizados entre la fuerza aérea rusa y la de la OTAN por el dominio del cielo.'},
{s:'jam',p:'158',k:['u'],src:'IMG_20250216_170348',
 zh:'她用手撑着坐直身体，右手触到了一团黏糊糊的冰冷绵软的东西，看上去像一个粘满了黑色弹灰的泥团。她突然意识到那是一颗……',
 en:'She braced herself up on her hands and sat straight; her right hand touched something sticky, cold and soft, which looked like a lump of mud caked in black powder residue. She suddenly realised it was a…',
 fr:'Elle prit appui sur ses mains pour se redresser ; sa main droite rencontra une chose gluante, froide et molle, qui ressemblait à une motte de boue couverte de suie noire. Elle comprit soudain que c’était une…',
 es:'Se incorporó apoyándose en las manos; con la derecha tocó algo viscoso, frío y blando, que parecía un terrón de barro cubierto de hollín negro. De pronto comprendió que era una…'},
{s:'jam',p:'158',k:['u'],src:'IMG_20250216_170350',
 zh:'在昨夜的那次致命打击中，阵亡了一名中尉，两名少尉和八名士兵。',
 en:'In last night’s fatal strike, one lieutenant, two second lieutenants and eight soldiers were killed.',
 fr:'Dans la frappe meurtrière de la nuit passée, un lieutenant, deux sous-lieutenants et huit soldats avaient été tués.',
 es:'En el ataque mortal de la noche anterior habían caído un teniente, dos alféreces y ocho soldados.'},
{s:'jam',p:'160',a:1,k:['u'],src:'IMG_20250216_170944',
 zh:'卡琳娜感到整个宇宙都在这撕人心肺的巨响中化为碎片，并向无限深处坠落……就在她的神经几乎崩溃时，这场坦克战结束了，它只持续了约三十秒钟。',
 en:'Karina felt the entire universe shatter in that heart-tearing roar and fall away into infinite depth… Just as her nerves were about to give way, the tank battle ended. It had lasted about thirty seconds.',
 fr:'Karina sentit l’univers entier se briser dans ce fracas à déchirer le cœur et tomber vers une profondeur infinie… Au moment où ses nerfs allaient lâcher, la bataille de chars prit fin. Elle avait duré une trentaine de secondes.',
 es:'Karina sintió que el universo entero se hacía añicos en aquel estruendo desgarrador y caía hacia una profundidad infinita… Justo cuando sus nervios iban a ceder, la batalla de tanques terminó. Había durado unos treinta segundos.'},
{s:'jam',p:'160',a:1,k:['u'],src:'IMG_20250216_171103',
 zh:'她通过底门，看到车内已成了一座小型的炼狱，在那暗红色的透明的火焰中，坦克手一动不动的身影清晰可见，像在水中一样波动着。',
 en:'Through the belly hatch she saw that the inside of the tank had become a small inferno; in that dark-red, transparent flame the motionless silhouettes of the crew stood out clearly, rippling as though under water.',
 fr:'Par la trappe de secours, elle vit que l’intérieur du char était devenu un petit enfer ; dans cette flamme rouge sombre et transparente, les silhouettes immobiles de l’équipage se découpaient nettement, ondulant comme sous l’eau.',
 es:'Por la escotilla inferior vio que el interior del tanque se había convertido en un pequeño infierno; en aquella llama transparente de un rojo oscuro se recortaban con nitidez las siluetas inmóviles de los tanquistas, ondulando como bajo el agua.'},
{s:'jam',p:'161 – 162',k:['u','span'],src:'IMG_20250216_171432 / 171521',
 zh:'他手中的火箭筒与那辆「艾布拉姆斯」的一二〇毫米炮同时响了，坦克的炮手情急之中发射的是一发不会爆炸的贫铀穿甲弹，初速每秒八百米的炮弹击中了那个士兵，把他上半身打成了一团飞溅的血花！',
 en:'The rocket launcher in his hands and the 120-millimetre gun of that Abrams went off at the same moment. In his haste the tank gunner had fired a depleted-uranium armour-piercing round, which does not explode; travelling at eight hundred metres a second, it struck the soldier and turned his upper body into a burst of flying blood!',
 fr:'Le lance-roquettes qu’il tenait et le canon de 120 millimètres de l’Abrams partirent au même instant. Dans la précipitation, le tireur du char avait chargé un obus-flèche à uranium appauvri, qui n’explose pas ; lancé à huit cents mètres par seconde, il frappa le soldat et transforma le haut de son corps en une gerbe de sang !',
 es:'El lanzacohetes que llevaba y el cañón de 120 milímetros de aquel Abrams sonaron a la vez. Con las prisas, el artillero del tanque había disparado un proyectil perforante de uranio empobrecido, que no estalla; a ochocientos metros por segundo, alcanzó al soldado y le convirtió el torso en un estallido de sangre.'},
{s:'jam',p:'164',k:['u'],st:2,src:'IMG_20250216_171906',
 zh:'「我见过你和列夫森科元帅的儿子在一起。」……「现在，他的儿子可是世界上离战争最远的人了。」',
 en:'“I have seen you together with Marshal Levchenko’s son.” … “Right now his son must be the man furthest from this war in the whole world.”',
 fr:'« Je t’ai vue avec le fils du maréchal Levtchenko. » … « À l’heure qu’il est, son fils doit être l’homme le plus éloigné de cette guerre au monde. »',
 es:'«Te he visto con el hijo del mariscal Levchenko.» … «Ahora mismo su hijo debe de ser el hombre más alejado de esta guerra en todo el mundo.»'},
{s:'jam',p:'165',a:1,k:['c'],src:'IMG_20250216_171909',
 zh:'他们都在想着还抱有的那一线希望。但愿整个战线只有这一处被突破。',
 en:'They were all thinking of the one thread of hope they still held on to: let this be the only place on the whole front that has been broken through.',
 fr:'Tous songeaient au mince fil d’espoir auquel ils se raccrochaient encore : pourvu que ce soit le seul point de tout le front à avoir été percé.',
 es:'Todos pensaban en el único hilo de esperanza al que aún se aferraban: ojalá este sea el único punto de todo el frente que ha sido roto.'},
{s:'jam',p:'169',a:1,k:['u'],src:'IMG_20250216_185515',
 zh:'战争爆发后，「万年风雪号」只能进行躲避飞行。向外太空是不行的，在木星轨道之内，有大量的北约无人航行器，它们的体积不大，武装或非武装，每一个对「万年风雪号」都是致命的威胁。于是，它只有航向近日空间，「万年风雪号」引以为傲的主动制冷式热屏蔽系统，使它可以比目前人类的任何太空航行器都更接近太阳。',
 en:'After the war broke out, the Eternal Blizzard could only fly evasively. Outward was impossible: inside the orbit of Jupiter there were great numbers of NATO unmanned craft, small things, armed or unarmed, and every one of them a lethal threat to her. So her only course was towards the near-solar region. The active-cooling heat-shield system that was the Eternal Blizzard’s pride allowed her to approach the sun more closely than any other spacecraft humanity then possessed.',
 fr:'Une fois la guerre déclenchée, le « Blizzard éternel » ne put que voler en esquivant. Vers l’extérieur, impossible : en deçà de l’orbite de Jupiter se trouvaient quantité d’engins sans équipage de l’OTAN, de petite taille, armés ou non, et chacun d’eux représentait pour lui une menace mortelle. Il ne lui restait donc que la route du voisinage solaire. Le système de bouclier thermique à refroidissement actif, fierté du « Blizzard éternel », lui permettait d’approcher le Soleil de plus près qu’aucun autre vaisseau dont l’humanité disposait alors.',
 es:'Estallada la guerra, el «Ventisca Eterna» solo podía volar esquivando. Hacia fuera era imposible: dentro de la órbita de Júpiter había gran cantidad de naves no tripuladas de la OTAN, pequeñas, armadas o no, y cada una de ellas era una amenaza mortal para él. Así que su única ruta era el espacio cercano al Sol. El sistema de blindaje térmico por refrigeración activa, orgullo del «Ventisca Eterna», le permitía acercarse al Sol más que cualquier otra nave que la humanidad poseyera entonces.'},
{s:'jam',p:'171',k:['u'],src:'IMG_20250216_191425',
 zh:'爷爷默默地看着我，终于下了决心，拿出了他珍藏的勋章，带着我走了出去，来到这里，那时这儿是自由市场，从伏特加到欧洲观点，人们什么都卖。一个美国人看上了爷爷的勋章，但只肯出四十美元……',
 en:'Grandfather looked at me in silence, and at last made up his mind: he took out the medals he had treasured, brought me out with him, and we came here. In those days this was a free market, where people sold everything from vodka to European opinions. An American took a fancy to Grandfather’s medals, but would only offer forty dollars…',
 fr:'Grand-père me regarda en silence, puis se décida enfin : il sortit les médailles qu’il gardait précieusement, m’emmena dehors, et nous vînmes ici. À l’époque, c’était un marché libre, où l’on vendait de tout, de la vodka aux opinions européennes. Un Américain s’intéressa aux médailles de grand-père, mais n’offrit que quarante dollars…',
 es:'El abuelo me miró en silencio y por fin se decidió: sacó las medallas que guardaba como un tesoro, me llevó con él y vinimos aquí. Entonces esto era un mercado libre, donde se vendía de todo, desde vodka hasta opiniones europeas. A un estadounidense le gustaron las medallas del abuelo, pero solo ofrecía cuarenta dólares…'},
{s:'jam',p:'173',a:1,k:['u'],src:'IMG_20250216_192137',
 zh:'米沙的性格，加上他那白皙清秀的外表，使人很容易觉得他像个女孩子。但列夫森科元帅心里清楚，儿子从本质上一点不像女孩子，女孩儿都怕孤独，但米沙喜欢孤独，孤独是他的营养，他的空气。',
 en:'Misha’s temperament, together with his pale, delicate looks, made it easy to think of him as girlish. But Marshal Levchenko knew perfectly well that in essence his son was nothing like a girl: girls are afraid of solitude, whereas Misha loved it. Solitude was his nourishment, his air.',
 fr:'Le tempérament de Micha, joint à son visage pâle et fin, le faisait aisément passer pour une fille. Mais le maréchal Levtchenko savait bien qu’au fond son fils n’avait rien d’une fille : les filles craignent la solitude, tandis que Micha l’aimait. La solitude était sa nourriture, son air.',
 es:'El carácter de Misha, unido a su aspecto pálido y delicado, hacía fácil tomarlo por una muchacha. Pero el mariscal Levchenko sabía muy bien que en el fondo su hijo no se parecía en nada a una muchacha: las muchachas temen la soledad, mientras que a Misha le gustaba. La soledad era su alimento, su aire.'},
{s:'jam',p:'174',a:1,k:['u'],st:1,src:'IMG_20250216_192357',
 zh:'回国后日子也很难，同从欧洲撤回的四十万军人和十二万文职人员一样，他没有住房，同米沙住在一间冬冷夏热的临时铁皮屋里。他昔日的同志为了生活什么都干，有的向黑社会出售武器，有的甚至到夜总会跳脱衣舞。但他一直像军人一样正直地生活着，米沙也在艰辛中默默地长大，同别的孩子不同，他似乎天生就会忍受，因为他有自己的世界。',
 en:'Life was hard after the return home too. Like the four hundred thousand soldiers and hundred and twenty thousand civilian staff pulled back from Europe, he had no housing, and lived with Misha in a temporary tin shack, cold in winter and hot in summer. His old comrades did anything to get by: some sold weapons to the underworld, some even stripped in nightclubs. But he went on living with a soldier’s uprightness, and Misha grew up quietly through the hardship. Unlike other children, he seemed born knowing how to endure — because he had a world of his own.',
 fr:'Le retour au pays fut dur, lui aussi. Comme les quatre cent mille militaires et les cent vingt mille employés civils rapatriés d’Europe, il n’avait pas de logement et vivait avec Micha dans une baraque de tôle provisoire, glacée l’hiver, brûlante l’été. Ses anciens camarades faisaient n’importe quoi pour survivre : certains vendaient des armes à la pègre, d’autres allaient jusqu’à se déshabiller dans des boîtes de nuit. Mais lui continua de vivre avec la droiture d’un soldat, et Micha grandit en silence dans cette misère. À la différence des autres enfants, il semblait né avec le don d’endurer — parce qu’il avait un monde à lui.',
 es:'La vida también fue dura al volver. Como los cuatrocientos mil militares y ciento veinte mil empleados civiles retirados de Europa, no tenía vivienda y vivía con Misha en un cobertizo provisional de chapa, frío en invierno y caluroso en verano. Sus antiguos camaradas hacían de todo para salir adelante: unos vendían armas al hampa, otros incluso se desnudaban en clubes nocturnos. Pero él siguió viviendo con la rectitud de un soldado, y Misha creció en silencio entre aquellas penurias. A diferencia de otros niños, parecía haber nacido sabiendo aguantar, porque tenía un mundo propio.',
 n:{zh:'页边另有一条手写批注，草书无法辨认，待本人确认。',
    en:'There is another handwritten note in the margin here; the cursive defeats me — to be confirmed by me.',
    fr:'Il y a ici une autre note manuscrite en marge ; la cursive m’échappe — à confirmer par moi-même.',
    es:'Aquí hay otra nota manuscrita al margen; la letra cursiva se me resiste: queda pendiente de confirmar.'}},
{s:'jam',p:'175',a:1,k:['u'],src:'IMG_20250216_192620',
 zh:'这时太阳已在松林后面完全落下去，地上的雪由白色变成浅蓝色。',
 en:'By now the sun had gone fully down behind the pine wood, and the snow on the ground turned from white to pale blue.',
 fr:'Le soleil était alors tout à fait descendu derrière la pinède, et la neige au sol passa du blanc au bleu pâle.',
 es:'Para entonces el sol se había ocultado del todo tras el pinar, y la nieve del suelo pasó del blanco al azul pálido.'},
{s:'jam',p:'175',a:1,k:['u'],src:'IMG_20250216_192620',
 zh:'绝世珍稀的植物，他敬畏地看着这植物一天天成长，小心地呵护着它，等着它开出花朵。他的期望没有落空，儿子现在已成为世界上最出色的天体物理学家。',
 en:'…a plant of the rarest kind in the world. In awe he watched it grow day by day, tended it carefully, and waited for it to flower. His hopes were not disappointed: his son is now the finest astrophysicist in the world.',
 fr:'… une plante de la plus rare espèce au monde. Avec respect il la regarda croître jour après jour, en prit grand soin, et attendit qu’elle fleurisse. Son attente ne fut pas déçue : son fils est aujourd’hui le meilleur astrophysicien du monde.',
 es:'…una planta de las más raras del mundo. Con reverencia la vio crecer día tras día, la cuidó con esmero y esperó a que floreciera. Su esperanza no quedó defraudada: su hijo es hoy el mejor astrofísico del mundo.'},
{s:'jam',p:'180',a:1,k:['u'],src:'IMG_20250216_194254',
 zh:'「爱因斯坦在他的后期研究中没什么建树，很大程度上是由于他过多地介入了政治。我不会走他的老路的。但，爸爸，到了需要的时候，我也会尽自己的责任的。」',
 en:'“Einstein achieved little in his later research, largely because he involved himself too much in politics. I shall not go down that road. But, father, when the time comes, I too will do my duty.”',
 fr:'« Einstein n’a pas accompli grand-chose dans ses recherches tardives, en grande partie parce qu’il s’est trop mêlé de politique. Je ne suivrai pas ce chemin-là. Mais, père, le moment venu, je ferai moi aussi mon devoir. »',
 es:'«Einstein logró poco en sus investigaciones tardías, en gran medida porque se metió demasiado en política. Yo no seguiré ese camino. Pero, padre, cuando llegue el momento, también cumpliré con mi deber.»'},
{s:'jam',p:'183',a:1,k:['u'],src:'IMG_20250216_195126',
 zh:'他看着战友像一块石头一样渐渐消失在大地的白色背景中。他克制了这样做的冲动，同僚机会合后，双机编队以最快的速度脱离这个空域。他们仍觉得这可能是个圈套。',
 en:'He had watched his comrade fall like a stone and slowly vanish into the white background of the land. He suppressed the urge to do the same; once he had rejoined his wingman, the pair left the area at maximum speed. They still felt this might be a trap.',
 fr:'Il avait vu son camarade tomber comme une pierre et disparaître peu à peu dans le fond blanc de la terre. Il réprima l’envie d’en faire autant ; ayant rejoint son ailier, la patrouille quitta la zone à pleine vitesse. Ils continuaient de penser que c’était peut-être un piège.',
 es:'Había visto a su compañero caer como una piedra y desvanecerse poco a poco en el fondo blanco de la tierra. Reprimió el impulso de hacer lo mismo; tras reunirse con su gregario, la pareja abandonó la zona a la máxima velocidad. Seguían pensando que aquello podía ser una trampa.'},
{s:'jam',p:'189',a:1,k:['u'],src:'IMG_20250216_195726',
 zh:'他可能被揍个半死，但不会全死，他看到了那些士兵衣领上波兰军队的鹰形领章标志。',
 en:'He might be beaten half to death, but not all the way — he had seen the eagle collar-flashes of the Polish army on those soldiers’ uniforms.',
 fr:'On le rouerait peut-être de coups à demi-mort, mais pas tout à fait : il avait aperçu, aux cols de ces soldats, les insignes à l’aigle de l’armée polonaise.',
 es:'Quizá lo molieran a golpes hasta dejarlo medio muerto, pero no del todo: había visto en los cuellos de aquellos soldados las insignias con el águila del ejército polaco.'},
{s:'jam',p:'192',a:1,k:['u'],st:1,src:'IMG_20250216_200001',
 zh:'你是和母亲在马尼拉的贫民窟中度日吗？……某种程度上是为你而战，战后当俄罗斯的民主政府上台后，北约的舰将抵达中国边境，苏比克和克拉克将重新成为美国在太平洋上的海空军基地，那里将比上个世纪更繁荣，你会在那儿找到工作的！如果你是个女孩，说不定像你妈妈（她叫什么来着，哦，阿莲娜）一样能认识个美国军官……',
