 en:'Are you scraping by with your mother in a Manila slum? … In a sense we are fighting for you. After the war, once a democratic government takes power in Russia, NATO ships will reach the Chinese border, and Subic and Clark will become American naval and air bases in the Pacific once again — more prosperous than last century. You will find work there! And if you were a girl, you might even meet an American officer, like your mother (what was her name again — ah, Alena)…',
 fr:'Tu tires le diable par la queue avec ta mère dans un bidonville de Manille ? … D’une certaine manière, c’est pour toi que nous nous battons. Après la guerre, quand un gouvernement démocratique arrivera au pouvoir en Russie, les navires de l’OTAN atteindront la frontière chinoise, et Subic et Clark redeviendront des bases navales et aériennes américaines dans le Pacifique — plus prospères qu’au siècle dernier. Tu y trouveras du travail ! Et si tu étais une fille, tu ferais peut-être la connaissance d’un officier américain, comme ta mère (comment s’appelait-elle déjà — ah oui, Aliona)…',
 es:'¿Andas malviviendo con tu madre en un barrio pobre de Manila? … En cierto modo luchamos por ti. Después de la guerra, cuando un gobierno democrático llegue al poder en Rusia, los barcos de la OTAN alcanzarán la frontera china, y Subic y Clark volverán a ser bases navales y aéreas de Estados Unidos en el Pacífico, más prósperas que el siglo pasado. ¡Allí encontrarás trabajo! Y si fueras chica, hasta podrías conocer a un oficial estadounidense, como tu madre (¿cómo se llamaba?, ah, sí, Aliona)…',
 n:{zh:'米国……（后两字草书，辨认不清，待确认）',
    en:'“Beikoku” / the United States… (the last two characters are cursive and illegible — to be confirmed.)',
    fr:'« Beikoku » / les États-Unis… (les deux derniers caractères, en cursive, sont illisibles — à confirmer.)',
    es:'«Beikoku» / Estados Unidos… (los dos últimos caracteres, en cursiva, son ilegibles: por confirmar.)'}},
{s:'jam',p:'196',a:1,k:['u'],src:'IMG_20250216_200315',
 zh:'听到传言，说他儿子是那所大学中唯一的一名反战分子，结果被学生们打了。',
 en:'He had heard the rumour that his son was the only anti-war element in that university, and had been beaten up by the students for it.',
 fr:'Il avait entendu la rumeur selon laquelle son fils était le seul élément antiguerre de cette université, et que les étudiants l’avaient pour cela roué de coups.',
 es:'Había oído el rumor de que su hijo era el único elemento antibelicista de aquella universidad y que, por ello, los estudiantes le habían dado una paliza.'},
{s:'jam',p:'196',a:1,k:['u'],src:'IMG_20250216_200315',
 zh:'元帅用他从未有过的严厉对儿子说：「你知道自己的位置，你可以不说话，但以后绝不许出现类似的言行。」米沙点点头。',
 en:'With a sternness he had never used before, the marshal told his son: “You know your position. You may keep silent, but nothing of that kind is ever to be said or done again.” Misha nodded.',
 fr:'Avec une sévérité dont il n’avait jamais usé, le maréchal dit à son fils : « Tu connais ta position. Tu peux te taire, mais plus jamais de propos ni d’actes de ce genre. » Micha hocha la tête.',
 es:'Con una severidad que nunca había empleado, el mariscal le dijo a su hijo: «Conoces cuál es tu lugar. Puedes callarte, pero nunca más se repetirán palabras ni actos de ese tipo.» Misha asintió.'},
{s:'jam',p:'196',a:1,k:['u'],src:'IMG_20250216_200315',
 zh:'这是一场由空前强大的敌人从预料不到的方向发起的旨在彻底肢解俄罗斯的世界大战。',
 en:'This was a world war launched by an enemy of unprecedented strength, from a direction no one had foreseen, and aimed at dismembering Russia completely.',
 fr:'C’était une guerre mondiale déclenchée par un ennemi d’une puissance sans précédent, dans une direction que nul n’avait prévue, et visant à démembrer entièrement la Russie.',
 es:'Era una guerra mundial lanzada por un enemigo de una fuerza sin precedentes, desde una dirección que nadie había previsto, y dirigida a desmembrar Rusia por completo.'},
{s:'jam',p:'199',k:['c'],st:1,src:'IMG_20250216_200606',
 zh:'米沙想象着在水星那漫长的白天，在那一八〇〇℃的酷热下，站在水银湖岸边的情形。即使在狂风中，水银湖也会很平静，而水星没有大气，没有风，湖的表面如广阔的镜子平原，太阳和银河毫不失真地投射在上面。',
 en:'Misha imagined standing on the shore of a mercury lake in the long Mercurian day, under that 1800 °C heat. Even in a gale a mercury lake would be calm — and Mercury has no atmosphere and no wind, so the surface of the lake would be a wide plain of mirror, with the sun and the Milky Way cast onto it without the slightest distortion.',
 fr:'Micha imaginait se tenir au bord d’un lac de mercure, pendant le long jour de Mercure, sous cette chaleur de 1 800 °C. Même dans la tempête, un lac de mercure resterait calme — et Mercure n’a ni atmosphère ni vent : la surface du lac serait une vaste plaine de miroir, où le Soleil et la Voie lactée se refléteraient sans la moindre déformation.',
 es:'Misha imaginaba estar de pie a la orilla de un lago de mercurio durante el largo día de Mercurio, bajo aquel calor de 1800 °C. Incluso en un vendaval, un lago de mercurio estaría en calma; y Mercurio no tiene atmósfera ni viento, así que la superficie del lago sería una ancha llanura de espejo, con el Sol y la Vía Láctea proyectados en ella sin la menor distorsión.',
 n:{zh:'它始终存在！',
    en:'It is there the whole time!',
    fr:'Il est là depuis toujours !',
    es:'¡Está ahí todo el tiempo!'}},
{s:'jam',p:'200',a:1,k:['u'],src:'IMG_20250216_200849',
 zh:'每当卡琳娜射击时，对面的敌人就卧倒，子弹在他们前面溅起一团团雪花，而半圆形包围圈另一个方向的敌人则跃起快步推进一段距离。',
 en:'Every time Karina fired, the enemy in front of her went flat and the bullets threw up puffs of snow before them — while on the other side of the semicircular cordon the enemy sprang up and pressed forward a stretch at a run.',
 fr:'Chaque fois que Karina tirait, les ennemis en face se plaquaient au sol et les balles soulevaient devant eux des gerbes de neige — tandis qu’à l’autre extrémité du demi-cercle d’encerclement, les ennemis bondissaient et gagnaient du terrain au pas de course.',
 es:'Cada vez que Karina disparaba, los enemigos de enfrente se echaban al suelo y las balas levantaban ante ellos ráfagas de nieve, mientras que en el otro extremo del cerco semicircular los enemigos se incorporaban y avanzaban un trecho a la carrera.'},
{s:'jam',p:'200',a:1,k:['u'],src:'IMG_20250216_200849',
 zh:'她感到右肋被什么猛推了一下，没有疼痛，只有一阵很快扩散的麻木感，她感到温热的血顺着右侧身体流下去。她坚持着，几乎是漫无目标地打完了这个弹夹。',
 en:'She felt something shove hard at her right ribs — no pain, only a numbness spreading fast — and felt warm blood running down her right side. She held on, and emptied the magazine almost without aiming at anything.',
 fr:'Elle sentit une violente poussée contre ses côtes droites — aucune douleur, seulement un engourdissement qui se répandait vite — et sentit le sang tiède couler le long de son flanc droit. Elle tint bon et vida le chargeur presque sans viser.',
 es:'Sintió un empujón violento en las costillas derechas —ningún dolor, solo un entumecimiento que se extendía deprisa— y notó la sangre tibia bajándole por el costado derecho. Aguantó y vació el cargador casi sin apuntar a nada.'},
{s:'jam',p:'200',a:1,k:['u'],src:'IMG_20250216_200849',
 zh:'卡琳娜站起身，回头向库房门走去，她身后的雪地上留下了一条细细的血迹。当她拉开门时，又一颗子弹穿透了她的左肩。',
 en:'Karina got to her feet and turned back towards the storehouse door, leaving a thin trail of blood on the snow behind her. As she pulled the door open, another bullet went through her left shoulder.',
 fr:'Karina se releva et repartit vers la porte du magasin, laissant derrière elle, sur la neige, une fine traînée de sang. Au moment où elle tirait la porte, une autre balle lui traversa l’épaule gauche.',
 es:'Karina se puso en pie y volvió hacia la puerta del almacén, dejando tras de sí un fino reguero de sangre en la nieve. Cuando abrió la puerta, otra bala le atravesó el hombro izquierdo.'},
{s:'jam',p:'202',a:1,k:['u'],src:'IMG_20250216_201148',
 zh:'他指着窗外半空中悬停着的直升机说：「是那些飞行员，还有那些在很远的航空母舰上操作电脑指引巡航导弹的先生们，但他们也都是体面的先生，他们所面对的目标都是屏幕上漂亮的彩色标记，他们按一下按钮或动一下鼠标，耐心地等一会儿，那些标志就消失了，他们都是文明的先生，他们没有恶意，真的没有恶意……您在听我说吗？」',
 en:'He pointed out of the window at the helicopter hovering in mid-air: “It is those pilots, and those gentlemen on some distant aircraft carrier working a computer to guide cruise missiles. But they too are perfectly respectable gentlemen. The targets they face are pretty coloured marks on a screen; they press a button or move a mouse, wait patiently a while, and the marks disappear. They are civilised gentlemen. They bear no ill will — truly, no ill will at all… Are you listening to me?”',
 fr:'Il montra par la fenêtre l’hélicoptère en vol stationnaire : « Ce sont ces pilotes-là, et ces messieurs qui, sur un porte-avions très lointain, manient un ordinateur pour guider des missiles de croisière. Mais eux aussi sont de très convenables messieurs. Les cibles qu’ils affrontent sont de jolis repères colorés sur un écran ; ils appuient sur un bouton ou déplacent une souris, patientent un moment, et les repères disparaissent. Ce sont des messieurs civilisés. Ils n’ont aucune malveillance — vraiment aucune… Vous m’écoutez ? »',
 es:'Señaló por la ventana el helicóptero suspendido en el aire: «Son esos pilotos, y esos señores que en un portaaviones lejanísimo manejan un ordenador para guiar misiles de crucero. Pero también ellos son señores muy decentes. Los blancos que enfrentan son bonitas marcas de colores en una pantalla; pulsan un botón o mueven un ratón, esperan con paciencia un rato y las marcas desaparecen. Son señores civilizados. No tienen mala intención; de verdad, ninguna mala intención… ¿Me está escuchando?»'},
{s:'jam',p:'202',a:1,k:['u'],src:'IMG_20250216_201148',
 zh:'少校笑着点点头，谁说死神是丑恶恐怖的，死神真美。',
 en:'The major smiled and nodded. Who says Death is hideous and terrible? Death is truly beautiful.',
 fr:'Le commandant sourit et hocha la tête. Qui prétend que la Mort est hideuse et terrible ? La Mort est vraiment belle.',
 es:'El comandante sonrió y asintió. ¿Quién dice que la Muerte es horrenda y terrible? La Muerte es de verdad hermosa.'},
{s:'jam',p:'205',k:['c'],src:'IMG_20250216_201452',
 zh:'「混蛋！谁让你们用士兵的尸体筑掩体的？！」「是我命令这样干的。」参谋长的声音从师长身后平静地响起，「昨天晚上进入新阵地太快，这里又是一片农田，实在没有什么别的材料了。」',
 en:'“You bastards! Who told you to build a parapet out of soldiers’ bodies?!” “I gave the order,” came the chief of staff’s voice, calmly, from behind the division commander. “We moved into the new position too fast last night, and this is farmland — there really was nothing else to build with.”',
 fr:'« Salauds ! Qui vous a dit de faire un parapet avec les corps des soldats ?! » « C’est moi qui en ai donné l’ordre », dit calmement la voix du chef d’état-major derrière le commandant de division. « Nous avons gagné la nouvelle position trop vite cette nuit, et ici c’est un champ : il n’y avait vraiment rien d’autre comme matériau. »',
 es:'«¡Canallas! ¿Quién os mandó levantar un parapeto con los cuerpos de los soldados?» «Yo di la orden», sonó serena la voz del jefe de estado mayor a espaldas del comandante de división. «Anoche entramos en la nueva posición demasiado deprisa, y esto es campo de labor: no había de verdad ningún otro material.»'},
{s:'jam',p:'208',a:1,k:['u'],src:'IMG_20250216_201808',
 zh:'「爸爸，以前我们两个人一直生活在相距遥远的两个世界中，我们互相交流很少。但现在，我们这两个世界融为一体，我们在为一个共同的目标而战，我为此自豪。爸爸，像您的每一个士兵一样，我在等着您的命令。」',
 en:'“Father, the two of us have always lived in two worlds far apart, and we have talked to each other very little. But now those two worlds have become one; we are fighting for a common goal, and I am proud of it. Father, like every one of your soldiers, I am waiting for your order.”',
 fr:'« Père, nous avons toujours vécu, toi et moi, dans deux mondes très éloignés, et nous nous sommes bien peu parlé. Mais maintenant ces deux mondes n’en font plus qu’un ; nous combattons pour un même but, et j’en suis fier. Père, comme chacun de tes soldats, j’attends ton ordre. »',
 es:'«Padre, los dos hemos vivido siempre en dos mundos muy alejados, y hemos hablado muy poco el uno con el otro. Pero ahora esos dos mundos se han fundido en uno; luchamos por un objetivo común, y estoy orgulloso de ello. Padre, como cada uno de tus soldados, espero tu orden.»'},
{s:'jam',p:'210',a:1,k:['u'],src:'IMG_20250216_202308',
 zh:'火之海在抖动变形，那是半米厚的绝热玻璃在熔化，很快那上百米高的玻璃壁化作一片透明的液体滚落下来。像一个初见海洋的人陶醉地面对海风，米沙伸开双臂迎接那向他呼啸而来的六千度的飓风。',
 en:'The sea of fire shivered and warped: the half-metre-thick heat-insulating glass was melting, and soon that hundred-metre wall of glass ran down as a sheet of transparent liquid. Like someone seeing the ocean for the first time and standing rapt before the sea wind, Misha opened his arms to the six-thousand-degree hurricane howling towards him.',
 fr:'La mer de feu se mit à trembler et à se déformer : le verre calorifuge d’un demi-mètre d’épaisseur fondait, et bientôt cette paroi de verre de cent mètres de haut ruissela en une nappe de liquide transparent. Comme quelqu’un qui découvre l’océan et se tient, ravi, face au vent du large, Micha ouvrit les bras à l’ouragan de six mille degrés qui hurlait vers lui.',
 es:'El mar de fuego temblaba y se deformaba: el vidrio aislante de medio metro de grosor se estaba fundiendo, y pronto aquella pared de cien metros de alto se escurrió convertida en una lámina de líquido transparente. Como quien ve el océano por primera vez y se planta extasiado ante el viento marino, Misha abrió los brazos al huracán de seis mil grados que aullaba hacia él.'},
{s:'jam',p:'210',a:1,k:['u','cend'],src:'IMG_20250216_202308',
 zh:'在摄像机和发射设备被烧熔之前发回的最后几秒钟图像中，可以看到米沙的身体燃烧起来，最后他的整个身体都变成了一根跳动的火焰，<b>和太阳的火海融为一体……</b>',
 en:'In the last few seconds of images sent back before the camera and the transmitter melted, Misha’s body can be seen catching fire, until at last his whole body had become a single leaping flame, <b>merging into the sun’s sea of fire…</b>',
 fr:'Dans les dernières secondes d’images renvoyées avant que la caméra et l’émetteur ne fondent, on voit le corps de Micha s’embraser, jusqu’à ce que tout son corps ne soit plus qu’une flamme dansante, <b>fondue dans la mer de feu du Soleil…</b>',
 es:'En los últimos segundos de imágenes enviadas antes de que la cámara y el transmisor se fundieran, se ve arder el cuerpo de Misha, hasta que todo él quedó convertido en una sola llama que danzaba, <b>fundiéndose con el mar de fuego del Sol…</b>'},
{s:'jam',p:'210',a:1,k:['u'],src:'IMG_20250216_202308',
 zh:'太阳大气的作用开始显示，液球的周围出现了一圈淡蓝色的火焰，这火焰向后拖了几百千米长，颜色向后由淡蓝渐变为黄色，在尾部变成美丽的橘红色。',
 en:'The solar atmosphere began to take effect: a ring of pale blue flame appeared around the liquid sphere, trailing several hundred kilometres behind it and shading from pale blue through yellow into a beautiful orange-red at the tail.',
 fr:'L’atmosphère solaire commença d’agir : un anneau de flamme bleu pâle apparut autour de la sphère liquide, traînant sur plusieurs centaines de kilomètres derrière elle, passant du bleu pâle au jaune, puis à un magnifique rouge orangé à l’extrémité.',
 es:'La atmósfera solar empezó a actuar: alrededor de la esfera líquida apareció un anillo de llama azul pálido que se alargaba varios cientos de kilómetros por detrás, pasando del azul pálido al amarillo y, en la cola, a un hermoso rojo anaranjado.'},
{s:'jam',p:'212 – 213',k:['u','span'],src:'IMG_20250216_202753 / 202756',
 zh:'一小时前，这个阵地上唯一的一支装甲力量，德军的一个坦克营，以令人钦佩的勇气发起反冲锋，并取得了优秀的战果：在距此八千米处击毁了相当于他们坦克数目一倍半的俄罗斯坦克。但由于数量上的绝对劣势，他们在俄罗斯人的钢铁洪流面前如正午太阳下的露珠一样消失了。',
 en:'An hour earlier, the only armoured force on this position — a German tank battalion — had counter-attacked with admirable courage and achieved an excellent result: eight kilometres from here they destroyed one and a half times their own number of Russian tanks. But being absolutely outnumbered, they vanished before the Russians’ torrent of steel like dew under the noonday sun.',
 fr:'Une heure plus tôt, la seule force blindée de cette position — un bataillon de chars allemand — avait contre-attaqué avec un courage admirable et obtenu un résultat remarquable : à huit kilomètres d’ici, il avait détruit une fois et demie son propre nombre de chars russes. Mais, en infériorité numérique absolue, il s’évanouit devant le torrent d’acier russe comme la rosée sous le soleil de midi.',
 es:'Una hora antes, la única fuerza acorazada de esta posición —un batallón de carros alemán— había contraatacado con un coraje admirable y logrado un resultado excelente: a ocho kilómetros de aquí destruyó una vez y media su propio número de tanques rusos. Pero en inferioridad numérica absoluta, se desvaneció ante el torrente de acero ruso como el rocío bajo el sol del mediodía.'},
{s:'jam',p:'214',k:['c','fn'],src:'IMG_20250216_203040',
 zh:'「你们这些戴高乐的杂种，这几十年来你们一直没变！」<sup>①</sup>帕克终于失去控制。<br><em>① 1966 年戴高乐将军使法国退出北约军事一体化组织，这对当时冷战中的北约是一严重打击。</em>',
 en:'“You de Gaulle bastards — you haven’t changed in decades!”<sup>①</sup> Parker had finally lost control.<br><em>① In 1966 General de Gaulle withdrew France from NATO’s integrated military command, a severe blow to NATO in the Cold War of the time.</em>',
 fr:'« Bâtards de gaullistes, vous n’avez pas changé depuis des décennies ! »<sup>①</sup> Parker avait fini par perdre son sang-froid.<br><em>① En 1966, le général de Gaulle retira la France du commandement militaire intégré de l’OTAN, un coup sévère pour l’Alliance en pleine guerre froide.</em>',
 es:'«¡Malditos gaullistas, no habéis cambiado en décadas!»<sup>①</sup> Parker había perdido por fin el control.<br><em>① En 1966 el general De Gaulle sacó a Francia del mando militar integrado de la OTAN, un golpe severo para la Alianza en plena Guerra Fría.</em>'},
{s:'jam',p:'215',k:['u'],src:'IMG_20250216_203043',
 zh:'请你们向坚守阵地的美军部队传达我下面的话：我们并非生来就是一支只靠电脑才能打仗的军队。几十年前，在瓜达卡纳尔岛，我们是来自一支同样的军队，同日本人争夺一个个地洞；在溪山，我们用圆锹挖开北越士兵的手榴弹；更远一些的时候，在那个寒冷的冬夜，伟大的华盛顿领着那些没有鞋穿的士兵渡过冰封的特拉顿河，创造了历史……',
 en:'Please pass these words of mine to the American units holding the line: we were not born an army that can only fight with computers. Decades ago, on Guadalcanal, we came from the same army, fighting the Japanese for one hole in the ground after another; at Khe Sanh we dug out North Vietnamese grenades with entrenching spades; and further back still, on that cold winter night, the great Washington led men with no shoes on their feet across the frozen Delaware and made history…',
 fr:'Transmettez, je vous prie, ces mots aux unités américaines qui tiennent la ligne : nous ne sommes pas nés une armée capable de se battre seulement avec des ordinateurs. Il y a des décennies, à Guadalcanal, nous venions de cette même armée, disputant aux Japonais un trou de terre après l’autre ; à Khe Sanh, nous dégagions à la pelle les grenades des soldats nord-vietnamiens ; et plus loin encore, par cette nuit d’hiver glacée, le grand Washington menait des hommes sans souliers à travers la Delaware gelée, et écrivait l’Histoire…',
 es:'Transmitan, por favor, estas palabras mías a las unidades estadounidenses que sostienen la línea: no nacimos siendo un ejército capaz de combatir solo con ordenadores. Hace décadas, en Guadalcanal, veníamos de ese mismo ejército, disputándoles a los japoneses un agujero en la tierra tras otro; en Khe Sanh desenterrábamos a paladas las granadas de los soldados norvietnamitas; y más atrás todavía, en aquella noche fría de invierno, el gran Washington condujo a hombres descalzos a través del Delaware helado e hizo historia…'},

/* ========== 诗云 ========== */
{s:'cloud',p:'220',k:['c'],src:'IMG_20250217_092537',
 zh:'这令站在船头的吟诗者很烦。吟诗者是一个干瘦老头儿，同样雪白的长发和胡须混在一起飘动，他身着唐朝的宽大古装，仙风道骨，仿佛是在海天之间挥洒写就的一个狂草字。这就是新世界的创造者，伟大的——李白。',
 en:'This annoyed the poet standing at the bow. The poet was a thin, dried-up old man whose snow-white hair and beard blew about together; he wore the loose robes of the Tang dynasty and had the air of an immortal, like a character in wild cursive script dashed off between sea and sky. This was the creator of the new world, the great — Li Bai.',
 fr:'Cela agaçait le poète debout à la proue. Le poète était un vieillard sec et maigre dont les cheveux et la barbe, d’un blanc de neige, flottaient mêlés ; il portait l’ample robe des Tang et avait l’allure d’un immortel, comme un caractère de cursive folle jeté entre la mer et le ciel. C’était le créateur du monde nouveau, le grand — Li Bai.',
 es:'Aquello fastidiaba al poeta que iba en la proa. El poeta era un viejo enjuto y reseco cuyos cabellos y barba, blancos como la nieve, ondeaban entremezclados; vestía la amplia túnica de los Tang y tenía aire de inmortal, como un carácter de escritura cursiva salvaje trazado entre el mar y el cielo. Este era el creador del mundo nuevo, el gran… Li Bai.'},
{s:'cloud',p:'222',a:1,k:['u'],src:'IMG_20250217_092908',
 zh:'但就在接近土星轨道时，环形世界突然开始减速，最后竟沿原轨道返回，重新驶向太阳系内层空间。',
 en:'But just as it neared the orbit of Saturn, the ring world suddenly began to decelerate, and in the end turned back along its own course, heading once more for the inner solar system.',
 fr:'Mais au moment même où il approchait de l’orbite de Saturne, le monde annulaire se mit brusquement à ralentir, puis fit demi-tour sur sa propre trajectoire et repartit vers l’intérieur du système solaire.',
 es:'Pero justo al acercarse a la órbita de Saturno, el mundo anular empezó de pronto a frenar y acabó regresando por su propia trayectoria, rumbo otra vez al interior del sistema solar.'},
{s:'cloud',p:'225',a:1,k:['cu'],src:'IMG_20250217_093541',
 zh:'「我只喜欢完美的小生物，你把这么肮脏的虫子拿来干什么？」神说。……「只是听这个旋臂的一些航行者提到过，不是太了解。在这种虫子不算长的进化史中，这些航行者曾频繁地光顾地球，这种生物的思想之猥琐、行为之低劣、其历史之混乱和肮脏，都很让他们恶心，以至于直到地球世界毁灭之前，也没有一个航行者屑于同它们建立联系……快把它扔掉。」',
 en:'“I only like perfect small creatures. What do you mean by bringing me such a filthy insect?” said the God. … “I have only heard some navigators of this spiral arm mention them; I do not know much. In the not very long evolutionary history of this insect, those navigators called at the Earth often. The pettiness of the creature’s thought, the baseness of its behaviour, the chaos and squalor of its history all disgusted them so much that right up to the destruction of the Earth world, not one navigator ever condescended to make contact with them… Throw it away, quickly.”',
 fr:'« Je n’aime que les petites créatures parfaites. Que viens-tu faire avec un insecte aussi immonde ? » dit le Dieu. … « Je n’en ai entendu parler que par quelques navigateurs de ce bras spiral ; je n’en sais pas grand-chose. Au cours de l’histoire évolutive assez brève de cet insecte, ces navigateurs ont souvent fait escale sur la Terre. La mesquinerie de sa pensée, la bassesse de sa conduite, le désordre et la saleté de son histoire les écœuraient tant que, jusqu’à la destruction du monde terrestre, pas un navigateur n’a daigné entrer en contact avec eux… Jette-le, vite. »',
 es:'«Solo me gustan las criaturas pequeñas perfectas. ¿A qué vienes con un insecto tan inmundo?», dijo el Dios. … «Solo se lo he oído mencionar a algunos navegantes de este brazo espiral; no sé mucho. En la no muy larga historia evolutiva de este insecto, esos navegantes recalaron en la Tierra con frecuencia. La mezquindad de su pensamiento, la bajeza de su conducta, el caos y la suciedad de su historia les daban tal asco que, hasta la destrucción del mundo terrestre, ni un solo navegante se dignó establecer contacto con ellos… Tíralo, deprisa.»'},
{s:'cloud',p:'227',a:1,k:['u'],src:'IMG_20250217_094045',
 zh:'……而且这种表达还要在严酷得有些变态的诗律和音韵的约束下进行，这，我确实是第一次见到……使者，现在可以把这虫子扔了。',
 en:'…and moreover this expression had to be carried out under metrical and phonic constraints so severe as to be almost perverse. That, I really am seeing for the first time… Envoy, you may throw the insect away now.',
 fr:'… et de surcroît cette expression devait se plier à des contraintes métriques et sonores d’une sévérité presque perverse. Cela, je le vois vraiment pour la première fois… Émissaire, tu peux jeter l’insecte maintenant.',
 es:'…y además esa expresión debía someterse a unas restricciones métricas y fónicas de una severidad casi perversa. Eso sí que lo veo por primera vez… Emisario, ya puedes tirar el insecto.'},
{s:'cloud',p:'229',a:1,k:['u'],src:'IMG_20250217_094340',
 zh:'痛苦，精致的、完美的痛苦，我在星际间苦苦寻觅的感觉，尖锐如洞穿时空的十维弦，晶莹如类星体中心的纯能钻石，啊——',
 en:'Pain — exquisite, perfect pain, the sensation I have sought so long between the stars; sharp as a ten-dimensional string piercing space-time, clear as a diamond of pure energy at the heart of a quasar. Ah—',
 fr:'La douleur — une douleur exquise, parfaite, la sensation que je cherchais si durement entre les étoiles ; aiguë comme une corde à dix dimensions transperçant l’espace-temps, limpide comme un diamant d’énergie pure au cœur d’un quasar. Ah —',
 es:'Dolor: un dolor exquisito, perfecto, la sensación que tanto he buscado entre las estrellas; agudo como una cuerda de diez dimensiones que atraviesa el espacio-tiempo, límpido como un diamante de energía pura en el centro de un cuásar. Ah…'},
{s:'cloud',p:'229',a:1,k:['u'],src:'IMG_20250217_094340',
 zh:'总是将自己的记忆借宿于该文明的一个个体中，这样才能保证对该艺术的完全理解。',
 en:'I always lodge my memory inside one individual of that civilisation; only so can a complete understanding of its art be guaranteed.',
 fr:'Je loge toujours ma mémoire dans un individu de cette civilisation ; c’est le seul moyen de garantir une compréhension complète de son art.',
 es:'Siempre alojo mi memoria en un individuo de esa civilización; solo así puede garantizarse una comprensión completa de su arte.'},
{s:'cloud',p:'229',a:1,k:['u'],src:'IMG_20250217_094340',
 zh:'就是用纯能制造物品，上帝的活计！',
 en:'It means making objects out of pure energy — God’s own line of work!',
 fr:'C’est fabriquer des objets à partir d’énergie pure — le métier de Dieu !',
 es:'Consiste en fabricar objetos con energía pura: ¡el oficio de Dios!'},
{s:'cloud',p:'240',k:['u'],src:'IMG_20250217_142159',
 zh:'我还花了大量的时间亲身体验，你知道，吞食帝国很多地区的风景与李白所在的地球极为相似，还在月光下饮酒山巅吟诗，遍布各地的人类饲养场中有过几次艳遇……那么，现在总能让我看看你的诗作了吧。',
 en:'I also spent a great deal of time experiencing it in person. You know, the scenery in many parts of the Devourer Empire is extremely like the Earth Li Bai lived on: drinking under the moon, chanting poems on mountain tops, and a few romantic encounters in the human farms scattered everywhere… Well then, surely you can let me see your poems now.',
 fr:'J’ai aussi passé beaucoup de temps à en faire l’expérience moi-même. Vous savez, le paysage de bien des régions de l’Empire dévoreur ressemble énormément à la Terre où vivait Li Bai : boire au clair de lune, déclamer des vers au sommet des monts, et quelques aventures dans les élevages humains disséminés un peu partout… Eh bien, maintenant, vous pouvez sûrement me montrer vos poèmes.',
 es:'También dediqué muchísimo tiempo a vivirlo en persona. Ya sabes, el paisaje de muchas zonas del Imperio Devorador se parece enormemente a la Tierra en la que vivió Li Bai: beber a la luz de la luna, recitar versos en la cima de los montes, y algún que otro lance amoroso en los criaderos humanos repartidos por todas partes… En fin, ahora ya podrás enseñarme tus poemas.'},
{s:'cloud',p:'242',a:1,k:['u'],src:'IMG_20250217_142746',
 zh:'是原子级别的存贮吗？就是说一个针尖大小的地方，就能存下人类所有的书！不是你们现在那点儿书，是地球被吃掉前上面所有的书！',
 en:'Is it storage at the atomic level? You mean a space the size of a pinpoint could hold every book humanity ever had! Not the few books you have now — every book on Earth before the Earth was eaten!',
 fr:'Est-ce un stockage à l’échelle atomique ? Autrement dit, un espace grand comme une pointe d’aiguille contiendrait tous les livres de l’humanité ! Pas les quelques livres que vous avez maintenant — tous les livres qui se trouvaient sur Terre avant qu’elle ne soit dévorée !',
 es:'¿Es almacenamiento a escala atómica? ¡Entonces un espacio del tamaño de la punta de un alfiler podría contener todos los libros de la humanidad! No los pocos libros que tenéis ahora: ¡todos los libros que había en la Tierra antes de que se la comieran!'},
{s:'cloud',p:'244',a:1,k:['c'],src:'IMG_20250217_142944',
 zh:'「大约为 10 的 57 次方个原子，微不足道，微不足道。」「这……这正好是整个太阳系的物质量！」「是的，包括所有的太阳行星，当然也包括吞食帝国。」',
 en:'“About 10⁵⁷ atoms. A trifle, a mere trifle.” “That… that is exactly the mass of the entire solar system!” “Yes — including all the planets of the sun, and the Devourer Empire too, of course.”',
 fr:'« Environ 10⁵⁷ atomes. Une bagatelle, une simple bagatelle. » « Mais… c’est exactement la masse de tout le système solaire ! » « Oui — y compris toutes les planètes du Soleil, et l’Empire dévoreur, naturellement. »',
 es:'«Unos 10⁵⁷ átomos. Una nadería, una simple nadería.» «Eso… ¡eso es exactamente la masa de todo el sistema solar!» «Sí, incluidos todos los planetas del Sol y, por supuesto, el Imperio Devorador.»'},
{s:'cloud',p:'246',a:1,k:['u'],src:'IMG_20250217_143241',
 zh:'诗的意义并不取决于你的认可，也不取决于我或其他任何人，它取决于时间。许多在当时无意义的诗后来成了旷世杰作，而现今和以后的许多杰作在遥远的过去肯定也曾是无意义的。我要作出所有的诗，亿万年之后，谁知道伟大的时间把其中的哪首选为巅峰之作呢？',
 en:'The meaning of a poem does not depend on your approval, nor on mine, nor on anyone else’s: it depends on time. Many poems that meant nothing at the time later became masterpieces for the ages, and many of today’s and tomorrow’s masterpieces would certainly have meant nothing in the distant past. I mean to compose every poem there is. Hundreds of millions of years from now, who knows which of them great Time will choose as the summit?',
 fr:'Le sens d’un poème ne dépend pas de votre approbation, ni de la mienne, ni de celle de qui que ce soit : il dépend du temps. Bien des poèmes qui ne signifiaient rien à leur époque sont devenus plus tard des chefs-d’œuvre impérissables, et bien des chefs-d’œuvre d’aujourd’hui et de demain n’auraient certainement rien signifié dans un passé lointain. Je veux composer tous les poèmes possibles. Dans des centaines de millions d’années, qui sait lequel le grand Temps désignera comme sommet ?',
 es:'El sentido de un poema no depende de tu aprobación, ni de la mía, ni de la de nadie: depende del tiempo. Muchos poemas que en su momento no significaban nada se volvieron después obras maestras imperecederas, y muchas obras maestras de hoy y de mañana seguramente no habrían significado nada en un pasado remoto. Pretendo componer todos los poemas que existen. Dentro de cientos de millones de años, ¿quién sabe cuál elegirá el gran Tiempo como cumbre?'},
{s:'cloud',p:'246',a:1,k:['u'],src:'IMG_20250217_143241',
 zh:'最后一个字是诗眼，它是诗人在领略了宇宙之浩渺后，对生命在无限时空中的渺小发出的一声无奈的叹息。',
 en:'The last character is the eye of the poem: it is the helpless sigh a poet gives, having taken in the immensity of the universe, at the smallness of life in infinite space and time.',
 fr:'Le dernier caractère est l’œil du poème : c’est le soupir résigné que pousse le poète, après avoir embrassé l’immensité de l’univers, devant la petitesse de la vie dans l’espace et le temps infinis.',
 es:'El último carácter es el ojo del poema: es el suspiro resignado que exhala el poeta, tras haber abarcado la inmensidad del universo, ante la pequeñez de la vida en el espacio y el tiempo infinitos.'},
{s:'cloud',p:'249',k:['c'],src:'IMG_20250217_143422',
 zh:'「好好，真是很好，往后的日子会很有趣的，但这一切发生之前，还是让我们喝完这一壶吧。」李白快乐地点点头说，同时拿起了酒葫芦，倒完酒，他看着已笼罩在夜幕中的大河，意犹未尽地回味着，「真是一首好诗，第一首，呵呵，第一首就是好诗。」',
 en:'“Good, good, very good indeed. The days ahead will be interesting. But before any of that happens, let us finish this flask.” Li Bai nodded happily and picked up the gourd; having poured out the last of the wine, he looked at the great river now wrapped in night and savoured the moment, reluctant to let it go: “A fine poem, truly. The first one — ha! The very first one, and already a fine poem.”',
 fr:'« Bien, bien, vraiment très bien. Les jours à venir seront amusants. Mais avant que tout cela n’arrive, finissons donc cette gourde. » Li Bai hocha joyeusement la tête et saisit la calebasse ; ayant versé le reste du vin, il contempla le grand fleuve déjà enveloppé de nuit et savoura l’instant, à regret : « Un beau poème, vraiment. Le premier — ha ! Le tout premier, et déjà un beau poème. »',
 es:'«Bien, bien, muy bien de veras. Los días que vienen serán divertidos. Pero antes de que todo eso ocurra, acabemos esta calabaza.» Li Bai asintió alegremente y tomó la calabaza de vino; tras servir lo que quedaba, contempló el gran río ya envuelto en la noche y saboreó el momento, sin querer soltarlo: «Un buen poema, de verdad. El primero… ¡ja! El primerito, y ya un buen poema.»'},
{s:'cloud',p:'251',a:1,k:['c'],src:'IMG_20250217_143634',
 zh:'对吞食帝国的拆解是在吟诗开始后第五个星期进行的，这之前，李白曾向帝国提出了一个建议：由神族将所有恐龙迁到银河系另一端的一个世界，那里有一个文明，比神族落后许多，仍未纯能化，但比吞食文明要先进得多，恐龙们到那里后，将作为一种小家禽被饲养，过着衣食无忧的快乐生活。但恐龙们宁为玉碎，不为瓦全，愤怒地拒绝了这个提议。',
 en:'The dismantling of the Devourer Empire took place in the fifth week after the poem-chanting began. Before that, Li Bai had put a proposal to the Empire: the God race would move all the dinosaurs to a world at the other end of the galaxy, where a civilisation far behind the Gods — not yet converted to pure energy, but far ahead of the Devourers — would keep them as a kind of small domestic fowl, so that they might live happily with no worries about food or clothing. But the dinosaurs would rather be shattered jade than whole tile, and furiously refused.',
 fr:'Le démantèlement de l’Empire dévoreur eut lieu la cinquième semaine après le début de la récitation. Auparavant, Li Bai avait soumis une proposition à l’Empire : la race des Dieux transférerait tous les dinosaures vers un monde situé à l’autre extrémité de la Galaxie, où une civilisation très en retard sur les Dieux — pas encore passée à l’énergie pure, mais bien plus avancée que les Dévoreurs — les élèverait comme une sorte de petite volaille domestique, de sorte qu’ils vivraient heureux, sans souci du vivre et du couvert. Mais les dinosaures préférèrent le jade brisé à la tuile intacte, et refusèrent avec fureur.',
 es:'El desmantelamiento del Imperio Devorador se llevó a cabo la quinta semana después de iniciada la recitación. Antes de eso, Li Bai había propuesto al Imperio lo siguiente: la raza de los Dioses trasladaría a todos los dinosaurios a un mundo situado en el otro extremo de la galaxia, donde una civilización muy por detrás de los Dioses —aún no convertida en energía pura, pero mucho más avanzada que los Devoradores— los criaría como una especie de ave doméstica menor, de modo que vivirían felices, sin preocuparse por el sustento. Pero los dinosaurios prefirieron ser jade hecho añicos antes que teja entera, y lo rechazaron con furia.'},
{s:'cloud',p:'253',a:1,k:['u'],src:'IMG_20250217_144012',
 zh:'回到地球后是要开荒种地才有饭吃……这对于已在长期被饲养的生活中变得四体不勤、五谷不分的人们来说，确实像一场噩梦。',
 en:'Back on Earth they would have to break new ground and farm it before they could eat… To people who, after a long life of being farmed, had grown idle of limb and could not tell one grain from another, that really was like a nightmare.',
 fr:'De retour sur Terre, il leur faudrait défricher et cultiver pour avoir de quoi manger… Pour des gens qu’une longue vie d’élevage avait rendus paresseux de leurs membres et incapables de distinguer une céréale d’une autre, c’était vraiment un cauchemar.',
 es:'De vuelta en la Tierra tendrían que roturar y cultivar la tierra para poder comer… Para gente a la que una larga vida de cautiverio ganadero había vuelto perezosa de miembros e incapaz de distinguir un cereal de otro, aquello era en verdad una pesadilla.'},
{s:'cloud',p:'253',a:1,k:['u'],src:'IMG_20250217_144012',
 zh:'但伊依对地球世界的前途充满信心，不管前面有多少磨难，人将重新成为人。',
 en:'But Yi Yi was full of confidence in the future of the Earth world: however many trials lay ahead, human beings would become human beings again.',
 fr:'Mais Yi Yi avait pleine confiance dans l’avenir du monde terrestre : quelles que soient les épreuves à venir, les hommes redeviendraient des hommes.',
 es:'Pero Yi Yi tenía plena confianza en el futuro del mundo terrestre: por muchas penalidades que quedaran por delante, los seres humanos volverían a ser seres humanos.'},
{s:'cloud',p:'255',a:1,k:['u'],src:'IMG_20250217_144527',
 zh:'在空心地球，进入太空也是一件很容易的事，只需要跳进赤道上的五口深井（名叫地门）中的一口，向下坠落一百千米穿过地壳，就被空心地球自转的离心力抛进太空了。',
 en:'On the hollow Earth, getting into space is easy too: you need only jump into one of the five deep shafts on the equator (called Earth Gates), fall a hundred kilometres down through the crust, and the centrifugal force of the hollow Earth’s rotation flings you out into space.',
 fr:'Sur la Terre creuse, gagner l’espace est aussi chose facile : il suffit de sauter dans l’un des cinq puits profonds de l’équateur (appelés Portes de la Terre), de tomber cent kilomètres à travers la croûte, et la force centrifuge de la rotation de la Terre creuse vous projette dans l’espace.',
 es:'En la Tierra hueca, salir al espacio también es fácil: basta con saltar a uno de los cinco pozos profundos del ecuador (llamados Puertas de la Tierra), caer cien kilómetros a través de la corteza, y la fuerza centrífuga de la rotación de la Tierra hueca te lanza al espacio.'},
{s:'cloud',p:'256',a:1,k:['u'],src:'IMG_20250217_144850',
 zh:'这就使得从地球上可以看到诗云的一面，而不是像银河系那样只能看到截面。但地球离开诗云平面的距离还远不足以使这里的人们观察到诗云的完整形状。',
 en:'This means that from the Earth one sees the face of the Poetry Cloud, rather than only its cross-section as with the Milky Way. But the Earth is nowhere near far enough from the plane of the Poetry Cloud for people here to make out its complete shape.',
 fr:'Cela fait qu’on voit depuis la Terre la face du Nuage de poésie, et non sa seule coupe, comme c’est le cas pour la Voie lactée. Mais la Terre est loin d’être assez éloignée du plan du Nuage pour que ses habitants en distinguent la forme complète.',
 es:'Esto hace que desde la Tierra se vea la cara de la Nube de poesía, y no solo su sección, como ocurre con la Vía Láctea. Pero la Tierra está lejos de hallarse lo bastante alejada del plano de la Nube para que sus habitantes distingan su forma completa.'},
{s:'cloud',p:'256',a:1,k:['c'],src:'IMG_20250217_144850',
 zh:'事实上，南半球的整个天空都被诗云所覆盖。',
 en:'In fact the entire sky of the southern hemisphere is covered by the Poetry Cloud.',
 fr:'De fait, tout le ciel de l’hémisphère sud est recouvert par le Nuage de poésie.',
 es:'De hecho, todo el cielo del hemisferio sur está cubierto por la Nube de poesía.'},
{s:'cloud',p:'257',k:['c'],st:2,src:'IMG_20250217_145043',
 zh:'人类历史上产生的全部文字信息，也只能占它们每一片存贮量的几亿分之一。诗云就是由 10 的 40 次方片这样的存储器组成的，它们存贮了终极吟诗的全部结果。这片诗云，是用原来构成太阳和它的九大行星的全部物质所制造，当然还包括吞食帝国。',
 en:'All the written information ever produced in human history would take up only a few hundred-millionths of the capacity of one of these wafers. The Poetry Cloud is made of 10⁴⁰ such storage wafers, holding the entire output of the ultimate act of poetry. This cloud was manufactured out of all the matter that once made up the sun and its nine planets — and the Devourer Empire as well, of course.',
 fr:'Toute l’information écrite produite dans l’histoire humaine n’occuperait que quelques cent-millionièmes de la capacité d’une seule de ces plaquettes. Le Nuage de poésie est constitué de 10⁴⁰ plaquettes de ce type, qui contiennent la totalité du résultat de la récitation ultime. Ce nuage a été fabriqué avec toute la matière qui composait autrefois le Soleil et ses neuf planètes — et l’Empire dévoreur aussi, bien entendu.',
 es:'Toda la información escrita producida en la historia humana ocuparía apenas unas cienmillonésimas de la capacidad de una sola de esas obleas. La Nube de poesía está formada por 10⁴⁰ obleas de almacenamiento como esas, que contienen el resultado completo de la recitación última. Esa nube se fabricó con toda la materia que antes componía el Sol y sus nueve planetas, y también, por supuesto, el Imperio Devorador.'}
];

UI.frag = {
  en:'Photographed upside down; only this fragment could be read with confidence.',
  zh:'该页倒置拍摄，仅此片段可确认。',
  fr:'Page photographiée à l’envers ; seul ce fragment a pu être lu avec certitude.',
  es:'Página fotografiada al revés; solo este fragmento pudo leerse con certeza.'
};

let lang = 'en';
try {
  const saved = localStorage.getItem('jg-lang');
  if (saved === 'zh' || saved === 'fr' || saved === 'es' || saved === 'en') lang = saved;
} catch (_) {}

const $ = (id) => document.getElementById(id);
const el = (tag, cls) => { const n = document.createElement(tag); if (cls) n.className = cls; return n; };

function pageChip(e){
  const n = el('span', 'page' + (e.a ? ' approx' : ''));
  n.textContent = (e.a ? '≈ p.' : 'p.') + e.p;
  return n;
}

function renderEntry(e){
  const card = el('article','entry');
  const top = el('div','entry-top');
  top.append(pageChip(e));
  (e.k || []).forEach(code => {
    const c = el('span','kind' + (code === 'c' || code === 'cend' || code === 'cu' ? ' circle' : ''));
    c.textContent = UI.kinds[code][lang];
    top.append(c);
  });
  if (e.st) { const s = el('span','star'); s.textContent = (e.st === 2 ? UI.starOnly : UI.star)[lang]; top.append(s); }
  card.append(top);

  const q = el('blockquote', lang === 'zh' ? '' : 'latin');
  q.innerHTML = e[lang];
  if (e.nt) { const c = el('em'); c.textContent = ' — ' + UI.frag[lang]; q.append(c); }
  card.append(q);

  if (lang !== 'zh') {
    const o = el('div','orig');
    const lab = el('p','orig-label'); lab.textContent = UI.orig[lang];
    const t = el('p'); t.innerHTML = e.zh;
    o.append(lab, t); card.append(o);
  }

  if (e.n) {
    const m = el('p','mynote');
    const b = el('b'); b.textContent = UI.myNote[lang];
    m.append(b, document.createTextNode(e.n[lang]));
    if (lang !== 'zh') { const oz = el('span','note-orig'); oz.textContent = e.n.zh; m.append(oz); }
    card.append(m);
  }

  const s = el('p','src'); s.textContent = e.src; card.append(s);
  return card;
}

let filter = 'all';

function renderMain(){
  const main = $('main'); main.replaceChildren();
  STORIES.forEach(st => {
    if (filter !== 'all' && filter !== st.id) return;
    const sec = el('section','story'); sec.dataset.s = st.id;
    const head = el('div','story-head');
    const h2 = el('h2','story-title'); h2.textContent = st.t[lang];
    head.append(h2);
    if (lang !== 'zh') { const z = el('span','story-zh'); z.textContent = '《' + st.zh + '》'; head.append(z); }
    const r = el('span','range'); r.textContent = st.range; head.append(r);
    const sub = el('p','story-sub'); sub.textContent = st.s[lang];
    sec.append(head, sub);
    ENTRIES.filter(e => e.s === st.id).forEach(e => sec.append(renderEntry(e)));
    main.append(sec);
  });
}

function renderChrome(){
  document.documentElement.lang = (lang === 'zh' ? 'zh-Hans' : lang);
  $('backlink').textContent = UI.back[lang];
  $('eyebrow').textContent = UI.eyebrow[lang];
  $('booktitle').textContent = '《朝闻道》';
  $('byline').textContent = UI.byline[lang];
  $('heronote').textContent = UI.hero[lang];

  const f = $('facts'); f.replaceChildren();
  UI.facts[lang].forEach(([b, t]) => {
    const li = el('li'); const strong = el('b'); strong.textContent = b;
    li.append(strong, document.createTextNode(' ' + t)); f.append(li);
  });

  $('prov-heading').textContent = UI.provHead[lang];
  $('prov-body').textContent = UI.provBody[lang];
  for (let i = 0; i < 4; i++){
    $('prov-k' + (i+1)).textContent = UI.provKeys[lang][i];
    $('prov-v' + (i+1)).innerHTML = UI.provVals[lang][i];
  }

  const fl = $('filters'); fl.replaceChildren();
  const mk = (id, label) => {
    const b = el('button'); b.type = 'button'; b.textContent = label;
    b.setAttribute('aria-pressed', String(filter === id));
    b.addEventListener('click', () => { filter = id; renderChrome(); renderMain(); window.scrollTo({top:0, behavior:'smooth'}); });
    fl.append(b);
  };
  mk('all', UI.all[lang]);
  STORIES.forEach(st => mk(st.id, st.t[lang]));

  const lg = $('legend'); lg.replaceChildren();
  ['rgba(124,197,255,.55)','#63758f','#ffc46b','#ff8a6b'].forEach((c, i) => {
    const li = el('li'); const sw = el('span','swatch'); sw.style.background = c;
    li.append(sw, document.createTextNode(UI.legend[lang][i])); lg.append(li);
  });

  const fn = $('footnotes'); fn.replaceChildren();
  UI.foot[lang].forEach(t => { const p = el('p'); p.textContent = t; fn.append(p); });
  $('signature').textContent = UI.sig[lang];

  document.querySelectorAll('.langbar button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.l === lang)));
}

document.querySelectorAll('.langbar button').forEach(b => {
  b.addEventListener('click', () => {
    lang = b.dataset.l;
    try { localStorage.setItem('jg-lang', lang); } catch (_) {}
    renderChrome(); renderMain();
  });
});

renderChrome();
renderMain();
</script>
</body>
</html>
