  <main id="main"><noscript><h2>《乌合之众》 · Reading Notes</h2><section class="story"><h2>Book I · The mind of crowds</h2><article class="entry"><p class="page">I.3</p><blockquote class="latin">All the great events of history—the founding of Buddhism, Christianity and Islam, the Reformation, the French Revolution, and the spread of the socialism that threatens us today—are direct or distant results of a powerful impact on the imagination of crowds.</blockquote><div class="orig"><p>所有历史上的重大事件，佛教、基督教、伊斯兰教的创立，宗教改革，法国大革命，以及我们今天具有威胁性的社会主义的蔓延，都是对群体想象力产生强烈影响而造成的直接或遥远的结果。</p></div></article><article class="entry"><p class="page">I.3</p><blockquote class="latin">To master the art of stirring the imagination of crowds is to master the art of governing.</blockquote><div class="orig"><p>掌握了震撼群体想象力之道，便是掌握了统治之道。</p></div></article><article class="entry"><p class="page">I.4</p><blockquote class="latin">Finally, we have also seen that crowds recognize only strong, extreme emotions.</blockquote><div class="orig"><p>最后，我们还看到，群体只认可强烈的、极端的情感。</p></div></article><article class="entry"><p class="page">I.4</p><blockquote class="latin">The features of this feeling are simple: worship of someone considered superior; fear of the power attributed to that person; blind obedience to their orders; refusal to discuss their doctrines; eagerness to spread them; and a tendency to treat anyone unwilling to accept them as an enemy.</blockquote><div class="orig"><p>这种情感的特征非常简单：对一个被认为是高一级的人产生崇拜，对他被认为具有的力量产生恐惧，对他的号令盲目服从；无法对他定下的教条展开讨论；有传播这些信条的强烈愿望；倾向于将不愿意接受这些信条的人都视为敌人。</p></div></article><article class="entry"><p class="page">I.4</p><blockquote class="latin">The people as a whole were not servile; for three centuries they were full of spirit.</blockquote><div class="orig"><p>整个民族并不奴性，在长达三个世纪的时间里，他们充满血性。</p></div></article><article class="entry"><p class="page">I.4</p><blockquote class="latin">Only by understanding this basic point of crowd psychology can we grasp a little philosophy of history: for a crowd, one must become a god or be nothing at all.</blockquote><div class="orig"><p>我们只有深入了解这一群体心理学的根本点，才有可能理解一点历史哲学：对于群体来说，要么成为神，要么什么也不是。</p></div></article><article class="entry"><p class="page">I.4</p><blockquote class="latin">The Reformation, St. Bartholomew’s Day, religious wars, the Inquisition, and the Terror of the Revolution were all manifestations of the same phenomenon.</blockquote><div class="orig"><p>宗教改革，圣巴特罗缪之夜，宗教战争，宗教裁判所，以及大革命的恐怖时期，都是同一种现象。</p></div></article></section><section class="story"><h2>Book II · Beliefs and opinions</h2><article class="entry"><p class="page">II.1</p><blockquote class="latin">Through them, an uprising breaks out or a strike is decided.</blockquote><div class="orig"><p>通过它们，出现一次暴动，或者决定一场罢工。</p></div></article><article class="entry"><p class="page">II.1</p><blockquote class="latin">A people is an organism created by its past.</blockquote><div class="orig"><p>一个民族，是由过去创造出来的有机体。</p></div></article><article class="entry"><p class="page">II.1</p><blockquote class="latin">Without stable traditions there is no civilization; without the slow destruction of those traditions there is no progress.</blockquote><div class="orig"><p>没有稳定的传统，就没有文明；没有对这些传统的缓慢的消灭，就没有进步。</p></div></article><article class="entry"><p class="page">II.1</p><blockquote class="latin">The invisible masters that reign in our souls are the ones no effort can destroy.</blockquote><div class="orig"><p>在我们的灵魂中占统治地位的看不见的主人，才是任何努力都无法摧毁的。</p></div></article><article class="entry"><p class="page">II.1</p><blockquote class="latin">The ideas of an age do not arise at random or appear without warning.</blockquote><div class="orig"><p>一个时代的观念并非随机诞生，贸然出现。</p></div></article><article class="entry"><p class="page">II.1</p><blockquote class="latin">Yet they easily showed that institutions are products of ideas, feelings, and customs.</blockquote><div class="orig"><p>然而，他们很容易就证明了，制度是观念、情感和风俗的产物。</p></div></article><article class="entry"><p class="page">II.1</p><blockquote class="latin">The character of a people, rather than its government, determines its fate.</blockquote><div class="orig"><p>民族的性格，而非政府，决定了他们的命运。</p></div></article><article class="entry"><p class="page">II.1</p><blockquote class="latin">Never innovate unless a need is felt; then innovate only enough to remove that need.</blockquote><div class="orig"><p>永远不要创新，除非感到了不适，那时再去创新不迟，而且创新到消除不适，即适可而止</p></div></article><article class="entry"><p class="page">II.1</p><blockquote class="latin">A great revolution aimed to destroy all the institutions of the past, yet was ultimately forced to preserve centralization, even to demand more of it.</blockquote><div class="orig"><p>一场伟大的革命，其目的是要打破所有过去的制度，最终也被迫尊重中央集权，甚至要求更强的中央集权</p></div></article><article class="entry"><p class="page">II.1</p><blockquote class="latin">These institutions are not the underlying cause of the strength of some countries or the decline of others.</blockquote><div class="orig"><p>这些制度，对于某些国家的强大，对于另一些国家的堕落，都不是内因。</p></div></article><article class="entry"><p class="page">II.1</p><blockquote class="latin">Many distinguished philosophers, Herbert Spencer in particular, have readily shown that education makes people neither more moral nor happier.</blockquote><div class="orig"><p>许多杰出的哲学家，尤其是赫伯特·斯宾塞，很轻松就证明了，教育既不让人变得更道德，也不让人更幸福。</p></div></article><article class="entry"><p class="page">II.1</p><blockquote class="latin">From there, people try to cram in as much as possible: from primary school to the doctorate or teaching qualification, young people know only how to memorize their books, without developing judgment or initiative.</blockquote><div class="orig"><p>由此出发，人们就想尽可能地灌输；从小学到博士或者大学教师资格考试，年轻学子只知道将书本背诵得滚瓜烂熟，从不培养其判断能力和主动性。</p></div></article><article class="entry"><p class="page">II.1</p><blockquote class="latin">If a shallow grasp of so much knowledge and perfect recitation of so many textbooks could raise intelligence, perhaps we could accept all the defects of classical education, even though it produces only outdated and dissatisfied people.</blockquote><div class="orig"><p>假如对这么多知识的肤浅的获得，对这么多的教材的完美背诵，可以提高智力水平，那么，我们也许还可以接受我们的古典教育的所有缺点，既然它只是制造一些落伍的人，不满的人。</p></div></article><article class="entry"><p class="page">II.1</p><blockquote class="latin">At least nine-tenths of people waste their time and effort, and many years of their lives.</blockquote><div class="orig"><p>至少十分之九的人浪费了他们的时间和付出，浪费了他们生命中的好多年</p></div></article><article class="entry"><p class="page">II.1</p><blockquote class="latin">When a person thus formed leaves school, they are usually beyond remedy.</blockquote><div class="orig"><p>等造就好了的人从学校里出来时，通常，他已经是一个不可救药的人了。</p></div></article><article class="entry"><p class="page">II.1</p><blockquote class="latin">The return equals or exceeds the expenditure.</blockquote><div class="orig"><p>获得的回报相等于支出，或者高于支出</p></div></article><article class="entry"><p class="page">II.1</p><blockquote class="latin">The sole aim is to pass examinations, advance, and obtain degrees and certificates.</blockquote><div class="orig"><p>目的就是考试，升级，拿到学位和证书，而且仅仅是为了这些</p></div></article><article class="entry"><p class="page">II.2</p><blockquote class="latin">We already know what most strongly excites the imagination of crowds: the force of suggestion and contagion, especially when they take the form of images.</blockquote><div class="orig"><p>我们已经知道，哪些是最能够刺激群体想象力的东西，如暗示的力量，以及传染，尤其是以意象的形式。</p></div></article><article class="entry"><p class="page">II.2</p><blockquote class="latin">The power of words is linked to the images they evoke and is wholly independent of their true meaning.</blockquote><div class="orig"><p>词语的力量与他们所唤起的意象相关，完全独立于它们真正的意义。</p></div></article><article class="entry"><p class="page">II.2</p><blockquote class="latin">Reason and argument are powerless against certain words and slogans.</blockquote><div class="orig"><p>理性和论证，面对一些词语和口号，是无能为力的。</p></div></article><article class="entry"><p class="page">II.2</p><blockquote class="latin">Words thus have only shifting, temporary meanings: their meaning changes from one age or people to another.</blockquote><div class="orig"><p>因此，词语只拥有流动的、过渡性的意义，从一个时代到另一个时代，一个民族到另一个民族，意义都会产生变化。</p></div></article><article class="entry"><p class="page">II.2</p><blockquote class="latin">Words are so powerful that a few well-chosen ones can make people accept the most hateful things.</blockquote><div class="orig"><p>词语的力量是如此之大，只需要一些选择得当的词语，就可以让人接受最可恶的事情。</p></div></article><article class="entry"><p class="page">II.2</p><blockquote class="latin">Take, for example, the words “democracy” and “socialism,” so widely used today.</blockquote><div class="orig"><p>比方说，今天用得如此普遍的“民主”和“社会主义”二词。</p></div></article><article class="entry"><p class="page">II.2</p><blockquote class="latin">Behind those illusions laid in the grave, they saw nature’s blind forces.</blockquote><div class="orig"><p>在这些被送进了坟墓的幻想后面，他们看到的，是自然的盲目力量</p></div></article><article class="entry"><p class="page">II.2</p><blockquote class="latin">The great drivers of a people’s evolution have never been truth but error.</blockquote><div class="orig"><p>人民演变的伟大动因，从来都不是真理，而是谬误。</p></div></article><article class="entry"><p class="page">II.2</p><blockquote class="latin">We have already shown that crowds are not swayed by logical reasoning.</blockquote><div class="orig"><p>我们已经证明，群体是不受逻辑推理影响的</p></div></article><article class="entry"><p class="page">II.2</p><blockquote class="latin">What is certain is that human reason has not been able, as imagination has, to lead humanity toward civilization with passion and courage.</blockquote><div class="orig"><p>可以肯定的是，人类的理性，没有能够像幻想一样，带着激情和勇敢，引领人类走上文明之路。</p></div></article><article class="entry"><p class="page">II.2</p><blockquote class="latin">At times, people follow a hidden force, like the force that turns an acorn into an oak and keeps a comet on its course.</blockquote><div class="orig"><p>有时候，人民所遵循的，是一种隐秘的力量；正是类似的力量，让一颗橡果变成了橡树，让彗星沿着它的轨道运行。</p></div></article><article class="entry"><p class="page">II.3</p><blockquote class="latin">Once a certain number of beings gather, whether animals or people, they instinctively place themselves under the authority of a leader and obey that leader.</blockquote><div class="orig"><p>一旦一定数量的生灵聚集到了一起，无论是一群动物，还是一群人，都会本能地把自己放置到一个领袖的威权之下，也就是服从一个领袖。</p></div></article><article class="entry"><p class="page">II.3</p><blockquote class="latin">The strength of their conviction gives their words a powerful suggestive force.</blockquote><div class="orig"><p>信念的强度，给了他们的话语一种强大的暗示能力。</p></div></article><article class="entry"><p class="page">II.3</p><blockquote class="latin">Among all the powers humanity possesses, conviction has always been one of the greatest.</blockquote><div class="orig"><p>在人类所拥有的所有力量中，信念一直都是最伟大的之一。</p></div></article><article class="entry"><p class="page">II.3</p><blockquote class="latin">Some great events in history were accomplished by blind believers who knew only their own convictions.</blockquote><div class="orig"><p>历史上的一些伟大事件，经常就是被一些只知道自己的信念的盲目信徒所完成的。</p></div></article><article class="entry"><p class="page">II.3</p><blockquote class="latin">However energetic these leaders are, they do not last: they disappear when whatever stirred the crowd fades.</blockquote><div class="orig"><p>但是，这些领袖虽然精力过人，却并不持续，随着刺激群体的东西消失而消失。</p></div></article><article class="entry"><p class="page">II.3</p><blockquote class="latin">Whether they are clever or foolish makes no difference; the world always belongs to them.</blockquote><div class="orig"><p>无论他们是聪明的，还是愚笨的，都没有关系，世界永远属于他们。</p></div></article><article class="entry"><p class="page">II.3</p><blockquote class="latin">A book about all these great leaders would contain only a few names, but those names always stand at the head of the most important events in civilization and history.</blockquote><div class="orig"><p>在一本讲述所有这些伟大的领袖的书里面，只会有少数几个名字，但是，这些名字总是出现在文明和历史的最重要的事件的顶端。</p></div></article><article class="entry"><p class="page">II.3</p><blockquote class="latin">Simple, unqualified assertion, free of reasoning and evidence, is an effective way to plant an idea in a crowd’s mind.</blockquote><div class="orig"><p>简单、纯粹的断言，摆脱一切的逻辑推理和证据，是让一种观念渗透群体脑海的有效手段。</p></div></article><article class="entry"><p class="page">II.3</p><blockquote class="latin">If the same newspaper repeatedly tells us that Mr. A is a scoundrel and Mr. B an honest man, we eventually believe it—unless we regularly read a rival paper, where the labels are reversed.</blockquote><div class="orig"><p>在同一份报纸上，重复地看到，A先生是一个不折不扣的无赖，B先生是一个非常诚实的好人，我们最后也就确信这一点，当然，前提是我们不去经常读另外一家意见对立的报纸，那样的话，同样的定义就被反过来用了。</p></div></article><article class="entry"><p class="page">II.3</p><blockquote class="latin">For this very reason, people far ahead of their time have almost no influence on it.</blockquote><div class="orig"><p>正是出于这一原因，一些过于超越时代的人，基本上对那个时代没有任何影响。</p></div></article><article class="entry"><p class="page">II.3</p><blockquote class="latin">Simply by occupying a position, possessing some wealth, or holding certain titles, a person acquires an aura of prestige, even without much personal worth. A soldier in uniform and a judge in a red robe always have prestige.</blockquote><div class="orig"><p>仅仅因为一个人占着某个位置，拥有一定的财富，有一些头衔，他就带上了威望的光环，即便他没有太多的个人价值。一个穿上了制服的军人，一个披上了红袍的法官，总是有他的威望。</p></div></article><article class="entry"><p class="page">II.3</p><blockquote class="latin">The mark of prestige is that it prevents us from seeing things as they are and paralyzes our judgment. Crowds always need ready-made opinions, and individuals often do too. Such opinions are welcomed regardless of how much truth or error they contain; they are welcomed simply because they have prestige.</blockquote><div class="orig"><p>威望的特点，就是阻止人们如实地去看一样东西，就是让我们的判断力瘫痪。群体总是需要现成的意见，个体则经常需要现成的意见。这些意见受欢迎，跟它们含多少真理或谬误无关；只因为有威望，才受欢迎。</p></div></article><article class="entry"><p class="page">II.3</p><blockquote class="latin">After his death, his reputation endured and even grew.</blockquote><div class="orig"><p>在他去世之后，他的声望依然存在，不减反增。</p></div></article><article class="entry"><p class="page">II.3</p><blockquote class="latin">A genius cannot be too cautious.</blockquote><div class="orig"><p>一个天才是不会过于谨慎的</p></div></article><article class="entry"><p class="page">II.3</p><blockquote class="latin">People, ideas, or things endowed with prestige are quickly imitated through contagion, leading a whole generation to adopt a way of seeing and explaining the world.</blockquote><div class="orig"><p>具有威望的人、思想或事，会通过传染的途径马上被模仿，让整整一代人都接受一种感知方式和解释理论的方式。</p></div></article><article class="entry"><p class="page">II.3</p><blockquote class="latin">As noted, many factors can create prestige, but one of the most important is success.</blockquote><div class="orig"><p>如前所述，不少元素可以成为威望得以产生的原因，而其中最重要的之一，就是成功。</p></div></article><article class="entry"><p class="page">II.3</p><blockquote class="latin">Once prestige can be debated, it is no longer prestige.</blockquote><div class="orig"><p>威望一旦能够被讨论，就已经不再是威望。</p></div></article><article class="entry"><p class="page">II.4</p><blockquote class="latin">Revolution’s role is to cast off a belief that has nearly been abandoned but that the restraints of custom still prevent people from discarding completely.</blockquote><div class="orig"><p>革命的作用，就是把几乎已经被放弃的信仰完全摈弃，因为风俗的枷锁还阻碍着人们去完全抛弃它。</p></div></article><article class="entry"><p class="page">II.4</p><blockquote class="latin">It was to establish or preserve certain general beliefs that the Middle Ages erected so many stakes.</blockquote><div class="orig"><p>正是为了奠定或者维持一些普遍的信仰，中世纪才架起了那么多的火刑柱。</p></div></article><article class="entry"><p class="page">II.4</p><blockquote class="latin">Anything contrary to general beliefs or the feelings of a people lasts only briefly; a diverted river soon resumes its course.</blockquote><div class="orig"><p>一切与普遍信仰和种族的情感相违背的，都只持续了很短的时间，被改了航道的河流很快就继续自己的流动路线。</p></div></article><article class="entry"><p class="page">II.4</p><blockquote class="latin">If an opinion gains enough prestige to be accepted by everyone, it will soon acquire a dictatorial force before which all must bow.</blockquote><div class="orig"><p>假如有一种舆论可以拥有足够的威望而让所有人接受，那么，它很快就会具有一种独裁的力量，一切都只能在它面前折腰。</p></div></article></section><section class="story"><h2>Book III · Forms of crowds</h2><article class="entry"><p class="page">III.1</p><blockquote class="latin">We have seen that in a crowd intelligence has no effect; only certain unconscious feelings can act.</blockquote><div class="orig"><p>我们已经看到，到了群体中，智力不起任何作用，只有一些无意识的情感可以起作用。</p></div></article><article class="entry"><p class="page">III.1</p><blockquote class="latin">A sect joins people whose education, occupations, and surroundings may be very different through a common belief; a caste contains people of one occupation, whose education and surroundings are therefore broadly alike.</blockquote><div class="orig"><p>派别由教育、职业和环境常常大相径庭的人组成，只被同一种信仰联系在一起；等级集团只包括同一职业的人群，因此，教育和环境也大致相同。</p></div></article><article class="entry"><p class="page">III.2</p><blockquote class="latin">A crowd’s crimes generally arise from powerful suggestion; afterward, everyone involved believes they were fulfilling a duty.</blockquote><div class="orig"><p>群体的罪行一般源于强大的暗示，之后，所有参与的人都会相信自己是在完成一种职责。</p></div></article><article class="entry"><p class="page">III.2</p><blockquote class="latin">The killers were disciplined too, displaying the moral qualities we have ascribed to crowds.</blockquote><div class="orig"><p>杀人者还都很自律，显示出我们提到过的群体所拥有的道德品行</p></div></article><article class="entry"><p class="page">III.2</p><blockquote class="latin">So everyone was killed, including more than fifty children aged twelve to seventeen.</blockquote><div class="orig"><p>于是，所有人都被杀死了，包括五十多个12到17岁的孩子。</p></div></article><article class="entry"><p class="page">III.3</p><blockquote class="latin">Thus, the spirit of the jury remained unchanged: its verdicts were exactly the same.</blockquote><div class="orig"><p>因此，陪审团的精神一直没有改变：他们做出的判决是一模一样的。</p></div></article><article class="entry"><p class="page">III.3</p><blockquote class="latin">A speaker need not change every juror’s mind, only win over the leaders who shape the prevailing opinion.</blockquote><div class="orig"><p>演说家无须改变所有陪审团成员的意见，仅需争取那些能够决定普遍意见的领头人。</p></div></article><article class="entry"><p class="page">III.3</p><blockquote class="latin">During his defense in criminal court, Lachaud kept his eyes on the two or three jurors he considered influential but hard to convince.</blockquote><div class="orig"><p>“我们知道，在刑事法庭上陈述自己的辩护词的时候，拉修的眼睛一直不离开两到三个他认为有影响力的、但很难对付的陪审团成员。</p></div></article><article class="entry"><p class="page">III.4</p><blockquote class="latin">Voters want their greed and vanity gratified; candidates must flatter them extravagantly and readily make promises they cannot possibly keep.</blockquote><div class="orig"><p>选民需要看到他的贪婪和虚荣得到满足；候选人必须对他进行最不可思议的献媚，毫不犹豫地对他做一些根本不可能的许诺。</p></div></article><article class="entry"><p class="page">III.4</p><blockquote class="latin">At any anonymous gathering, even one made up entirely of educated people, discussion can quickly take the same turn.</blockquote><div class="orig"><p>在所有匿名的聚会中，即便由清一色的文化人组成，讨论也可以很快就变成同样的情形。</p></div></article><article class="entry"><p class="page">III.4</p><blockquote class="latin">The defects of universal suffrage are so obvious that they cannot go unnoticed.</blockquote><div class="orig"><p>全民普选的缺陷自然是太明显了，所以不可能看不到。</p></div></article><article class="entry"><p class="page">III.4</p><blockquote class="latin">They cannot help believing that, since everyone has the same knowledge, truth must lie with the majority.</blockquote><div class="orig"><p>因为他们无法不相信，既然每个人都有着同样的见识，真理一定是在多数人那里的。</p></div></article><article class="entry"><p class="page">III.4</p><blockquote class="latin">On the contrary, serious problems caused by castes would arise as well.</blockquote><div class="orig"><p>相反，还会出现因为等级集团而带来的严重问题。</p></div></article><article class="entry"><p class="page">III.5</p><blockquote class="latin">Moreover, the parliamentary system embodies the ideals of all modern civilized peoples.</blockquote><div class="orig"><p>而且，议会制度综合了所有现代文明民族的理想。</p></div></article><article class="entry"><p class="page">III.5</p><blockquote class="latin">A parliamentary vote often represents the opinion of only a small fraction of its members.</blockquote><div class="orig"><p>一个议会的投票，往往只代表了一小部分人的意见。</p></div></article><article class="entry"><p class="page">III.5</p><blockquote class="latin">Such eloquence can be seen in every parliament, including the calmest British one.</blockquote><div class="orig"><p>这样的口才，我们在所有的议会中都可以看到，包括最冷静的英国议会。</p></div></article><article class="entry"><p class="page">III.5</p><blockquote class="latin">Intelligence can make a person tolerant, weakening the strength and intensity of faith that an apostle must possess, because it explains the complexity of things and helps people understand them.</blockquote><div class="orig"><p>智力能够让人宽容，将使徒必须有的信仰的强度和烈度减弱，因为它会去解释事物的复杂性，可以帮助解释，让人理解。</p></div></article><article class="entry"><p class="page">III.5</p><blockquote class="latin">Crowds instinctively see in these energetic and firmly convinced people the master they need.</blockquote><div class="orig"><p>群体本能地在这些精力充沛的坚定信念者身上，看到了自己所需的主人。</p></div></article><article class="entry"><p class="page">III.5</p><blockquote class="latin">The individual is no longer themselves.</blockquote><div class="orig"><p>个体不再是自己</p></div></article><article class="entry"><p class="page">III.5</p><blockquote class="latin">They possess a temporary cohesion, heroism, fragility, impulsiveness, and violence.</blockquote><div class="orig"><p>他们有着临时的凝聚力，英雄主义，脆弱，冲动和暴力。</p></div></article><article class="entry"><p class="page">III.5</p><blockquote class="latin">A people follows an ideal from savagery to civilization; then, once that ideal loses its force, it declines and disappears—such is the life cycle of a people.</blockquote><div class="orig"><p>追随一个理想，从野蛮走向文明；然后，一旦这个理想失去了它的力量，就开始败落，消亡—这就是一个民族的生命历程。</p></div></article></section></noscript></main>

const STORIES = [{"id":"soul","zh":"第一篇 群体的灵魂","range":"","t":{"en":"Book I · The mind of crowds","zh":"第一篇 · 群体的灵魂","fr":"Livre I · L’âme des foules","es":"Libro I · El alma de las multitudes"},"s":{"en":"Imagination, ideas, and beliefs in a crowd.","zh":"群体的想象力、观念与信仰。","fr":"Imagination, idées et croyances d’une foule.","es":"Imaginación, ideas y creencias de una multitud."}},{"id":"belief","zh":"第二篇 群体的意见和信仰","range":"","t":{"en":"Book II · Beliefs and opinions","zh":"第二篇 · 群体的意见和信仰","fr":"Livre II · Croyances et opinions","es":"Libro II · Creencias y opiniones"},"s":{"en":"Tradition, schooling, words, leaders, and prestige.","zh":"传统、教育、词语、领袖与威望。","fr":"Tradition, éducation, mots, chefs et prestige.","es":"Tradición, educación, palabras, líderes y prestigio."}},{"id":"forms","zh":"第三篇 群体的归类和描述","range":"","t":{"en":"Book III · Forms of crowds","zh":"第三篇 · 群体的归类和描述","fr":"Livre III · Formes des foules","es":"Libro III · Formas de las multitudes"},"s":{"en":"Sects and castes, criminal crowds, juries, voters, and assemblies.","zh":"派别与等级集团、犯罪群体、陪审团、选民与议会。","fr":"Sectes et castes, foules criminelles, jurys, électeurs et assemblées.","es":"Sectas y castas, multitudes criminales, jurados, votantes y asambleas."}}];

const ENTRIES = [{"id":"w001","s":"soul","ch":"I.3","k":["c"],"zh":"所有历史上的重大事件，佛教、基督教、伊斯兰教的创立，宗教改革，法国大革命，以及我们今天具有威胁性的社会主义的蔓延，都是对群体想象力产生强烈影响而造成的直接或遥远的结果。","en":"All the great events of history—the founding of Buddhism, Christianity and Islam, the Reformation, the French Revolution, and the spread of the socialism that threatens us today—are direct or distant results of a powerful impact on the imagination of crowds.","fr":"Tous les grands événements de l’histoire — la fondation du bouddhisme, du christianisme et de l’islam, la Réforme, la Révolution française et l’essor du socialisme qui nous menace aujourd’hui — résultent, directement ou indirectement, d’une forte influence exercée sur l’imagination des foules.","es":"Todos los grandes acontecimientos de la historia —la fundación del budismo, el cristianismo y el islam, la Reforma, la Revolución francesa y la expansión del socialismo que hoy nos amenaza— son resultados directos o lejanos de una fuerte influencia sobre la imaginación de las multitudes."},{"id":"w002","s":"soul","ch":"I.3","k":["u"],"zh":"掌握了震撼群体想象力之道，便是掌握了统治之道。","en":"To master the art of stirring the imagination of crowds is to master the art of governing.","fr":"Maîtriser l’art de frapper l’imagination des foules, c’est maîtriser l’art de gouverner.","es":"Dominar el arte de impresionar la imaginación de las multitudes es dominar el arte de gobernar.","n":{"zh":"待確認","en":"Handwriting to confirm","fr":"Annotation manuscrite à confirmer","es":"Nota manuscrita por confirmar"}},{"id":"w003","s":"soul","ch":"I.4","k":["b"],"zh":"最后，我们还看到，群体只认可强烈的、极端的情感。","en":"Finally, we have also seen that crowds recognize only strong, extreme emotions.","fr":"Enfin, nous avons vu que les foules ne reconnaissent que les sentiments forts et extrêmes.","es":"Por último, hemos visto que las multitudes solo reconocen emociones intensas y extremas."},{"id":"w004","s":"soul","ch":"I.4","k":["c"],"zh":"这种情感的特征非常简单：对一个被认为是高一级的人产生崇拜，对他被认为具有的力量产生恐惧，对他的号令盲目服从；无法对他定下的教条展开讨论；有传播这些信条的强烈愿望；倾向于将不愿意接受这些信条的人都视为敌人。","en":"The features of this feeling are simple: worship of someone considered superior; fear of the power attributed to that person; blind obedience to their orders; refusal to discuss their doctrines; eagerness to spread them; and a tendency to treat anyone unwilling to accept them as an enemy.","fr":"Les traits de ce sentiment sont simples : vénérer une personne jugée supérieure, craindre le pouvoir qu’on lui prête, obéir aveuglément à ses ordres, refuser de discuter ses doctrines, vouloir les propager et tenir pour ennemis ceux qui refusent de les accepter.","es":"Las características de este sentimiento son sencillas: venerar a quien se considera superior, temer el poder que se le atribuye, obedecer ciegamente sus órdenes, negarse a discutir sus doctrinas, querer difundirlas y tratar como enemigos a quienes no las aceptan."},{"id":"w005","s":"soul","ch":"I.4","k":["u"],"zh":"整个民族并不奴性，在长达三个世纪的时间里，他们充满血性。","en":"The people as a whole were not servile; for three centuries they were full of spirit.","fr":"Le peuple dans son ensemble n’était pas servile ; pendant trois siècles, il fit preuve de vigueur.","es":"El pueblo en su conjunto no era servil; durante tres siglos mostró una gran vitalidad."},{"id":"w006","s":"soul","ch":"I.4","k":["b"],"zh":"我们只有深入了解这一群体心理学的根本点，才有可能理解一点历史哲学：对于群体来说，要么成为神，要么什么也不是。","en":"Only by understanding this basic point of crowd psychology can we grasp a little philosophy of history: for a crowd, one must become a god or be nothing at all.","fr":"Ce n’est qu’en comprenant ce point fondamental de la psychologie des foules que nous pouvons saisir un peu de philosophie de l’histoire : pour une foule, il faut devenir un dieu ou n’être rien.","es":"Solo al comprender este punto fundamental de la psicología de las multitudes podemos captar algo de filosofía de la historia: para una multitud, hay que convertirse en un dios o no ser nada."},{"id":"w007","s":"soul","ch":"I.4","k":["u"],"zh":"宗教改革，圣巴特罗缪之夜，宗教战争，宗教裁判所，以及大革命的恐怖时期，都是同一种现象。","en":"The Reformation, St. Bartholomew’s Day, religious wars, the Inquisition, and the Terror of the Revolution were all manifestations of the same phenomenon.","fr":"La Réforme, la Saint-Barthélemy, les guerres de religion, l’Inquisition et la Terreur révolutionnaire furent autant de manifestations d’un même phénomène.","es":"La Reforma, la matanza de San Bartolomé, las guerras de religión, la Inquisición y el Terror revolucionario fueron manifestaciones de un mismo fenómeno."},{"id":"w008","s":"belief","ch":"II.1","k":["c"],"zh":"通过它们，出现一次暴动，或者决定一场罢工。","en":"Through them, an uprising breaks out or a strike is decided.","fr":"Par leur action, une émeute éclate ou une grève est décidée.","es":"Por su acción estalla una revuelta o se decide una huelga."},{"id":"w009","s":"belief","ch":"II.1","k":["b"],"zh":"一个民族，是由过去创造出来的有机体。","en":"A people is an organism created by its past.","fr":"Un peuple est un organisme créé par son passé.","es":"Un pueblo es un organismo creado por su pasado."},{"id":"w010","s":"belief","ch":"II.1","k":["u"],"zh":"没有稳定的传统，就没有文明；没有对这些传统的缓慢的消灭，就没有进步。","en":"Without stable traditions there is no civilization; without the slow destruction of those traditions there is no progress.","fr":"Sans traditions stables, pas de civilisation ; sans leur lente disparition, pas de progrès.","es":"Sin tradiciones estables no hay civilización; sin su lenta desaparición no hay progreso."},{"id":"w011","s":"belief","ch":"II.1","k":["c"],"zh":"在我们的灵魂中占统治地位的看不见的主人，才是任何努力都无法摧毁的。","en":"The invisible masters that reign in our souls are the ones no effort can destroy.","fr":"Les maîtres invisibles qui règnent dans nos âmes sont ceux qu’aucun effort ne peut détruire.","es":"Los amos invisibles que reinan en nuestras almas son los que ningún esfuerzo puede destruir."},{"id":"w012","s":"belief","ch":"II.1","k":["u"],"zh":"一个时代的观念并非随机诞生，贸然出现。","en":"The ideas of an age do not arise at random or appear without warning.","fr":"Les idées d’une époque ne naissent pas au hasard et n’apparaissent pas à l’improviste.","es":"Las ideas de una época no nacen al azar ni aparecen de improviso."},{"id":"w013","s":"belief","ch":"II.1","k":["u"],"zh":"然而，他们很容易就证明了，制度是观念、情感和风俗的产物。","en":"Yet they easily showed that institutions are products of ideas, feelings, and customs.","fr":"Pourtant, ils ont aisément montré que les institutions sont le produit des idées, des sentiments et des coutumes.","es":"Sin embargo, demostraron con facilidad que las instituciones son producto de las ideas, los sentimientos y las costumbres."},{"id":"w014","s":"belief","ch":"II.1","k":["c"],"zh":"民族的性格，而非政府，决定了他们的命运。","en":"The character of a people, rather than its government, determines its fate.","fr":"Le caractère d’un peuple, et non son gouvernement, détermine son destin.","es":"El carácter de un pueblo, y no su gobierno, determina su destino."},{"id":"w015","s":"belief","ch":"II.1","k":["u"],"zh":"永远不要创新，除非感到了不适，那时再去创新不迟，而且创新到消除不适，即适可而止","en":"Never innovate unless a need is felt; then innovate only enough to remove that need.","fr":"N’innovez jamais sans en éprouver le besoin ; alors, n’innovez que dans la mesure nécessaire pour y remédier.","es":"Nunca innoves si no se siente una necesidad; entonces, innova solo lo necesario para remediarla."},{"id":"w016","s":"belief","ch":"II.1","k":["c"],"zh":"一场伟大的革命，其目的是要打破所有过去的制度，最终也被迫尊重中央集权，甚至要求更强的中央集权","en":"A great revolution aimed to destroy all the institutions of the past, yet was ultimately forced to preserve centralization, even to demand more of it.","fr":"Une grande révolution visait à détruire toutes les institutions du passé ; elle fut pourtant finalement contrainte de respecter la centralisation, voire d’en réclamer davantage.","es":"Una gran revolución quiso destruir todas las instituciones del pasado, pero acabó obligada a conservar la centralización e incluso a exigir más de ella."},{"id":"w017","s":"belief","ch":"II.1","k":["b"],"zh":"这些制度，对于某些国家的强大，对于另一些国家的堕落，都不是内因。","en":"These institutions are not the underlying cause of the strength of some countries or the decline of others.","fr":"Ces institutions ne sont pas la cause profonde de la puissance de certains pays ni de la décadence des autres.","es":"Estas instituciones no son la causa de fondo de la fortaleza de unos países ni de la decadencia de otros."},{"id":"w018","s":"belief","ch":"II.1","k":["c"],"zh":"许多杰出的哲学家，尤其是赫伯特·斯宾塞，很轻松就证明了，教育既不让人变得更道德，也不让人更幸福。","en":"Many distinguished philosophers, Herbert Spencer in particular, have readily shown that education makes people neither more moral nor happier.","fr":"De nombreux philosophes éminents, Herbert Spencer notamment, ont aisément montré que l’éducation ne rend les gens ni plus moraux ni plus heureux.","es":"Muchos filósofos eminentes, especialmente Herbert Spencer, han mostrado con facilidad que la educación no hace a las personas ni más morales ni más felices."},{"id":"w019","s":"belief","ch":"II.1","k":["u"],"zh":"由此出发，人们就想尽可能地灌输；从小学到博士或者大学教师资格考试，年轻学子只知道将书本背诵得滚瓜烂熟，从不培养其判断能力和主动性。","en":"From there, people try to cram in as much as possible: from primary school to the doctorate or teaching qualification, young people know only how to memorize their books, without developing judgment or initiative.","fr":"Dès lors, on cherche à tout inculquer : de l’école primaire au doctorat ou au concours d’enseignement, les jeunes ne savent que réciter leurs livres, sans cultiver leur jugement ni leur initiative.","es":"A partir de ahí se intenta inculcarlo todo: desde la escuela primaria hasta el doctorado o la habilitación docente, los jóvenes solo saben memorizar libros, sin desarrollar juicio ni iniciativa."},{"id":"w020","s":"belief","ch":"II.1","k":["b"],"zh":"假如对这么多知识的肤浅的获得，对这么多的教材的完美背诵，可以提高智力水平，那么，我们也许还可以接受我们的古典教育的所有缺点，既然它只是制造一些落伍的人，不满的人。","en":"If a shallow grasp of so much knowledge and perfect recitation of so many textbooks could raise intelligence, perhaps we could accept all the defects of classical education, even though it produces only outdated and dissatisfied people.","fr":"Si l’acquisition superficielle de tant de connaissances et la récitation parfaite de tant de manuels pouvaient élever l’intelligence, nous pourrions peut-être accepter tous les défauts de l’enseignement classique, même s’il ne produit que des personnes dépassées et mécontentes.","es":"Si la adquisición superficial de tantos conocimientos y la recitación perfecta de tantos manuales pudieran elevar la inteligencia, quizá podríamos aceptar todos los defectos de la educación clásica, aunque solo produzca personas anticuadas e insatisfechas.","n":{"zh":"都要去实践。","en":"All of it has to be put into practice.","fr":"Il faut tout mettre en pratique.","es":"Todo hay que ponerlo en práctica."}},{"id":"w021","s":"belief","ch":"II.1","k":["b"],"zh":"至少十分之九的人浪费了他们的时间和付出，浪费了他们生命中的好多年","en":"At least nine-tenths of people waste their time and effort, and many years of their lives.","fr":"Au moins neuf personnes sur dix gaspillent leur temps, leurs efforts et de nombreuses années de leur vie.","es":"Al menos nueve de cada diez personas desperdician su tiempo, su esfuerzo y muchos años de su vida."},{"id":"w022","s":"belief","ch":"II.1","k":["u"],"zh":"等造就好了的人从学校里出来时，通常，他已经是一个不可救药的人了。","en":"When a person thus formed leaves school, they are usually beyond remedy.","fr":"Quand une personne ainsi formée quitte l’école, elle est généralement irrécupérable.","es":"Cuando una persona formada así sale de la escuela, suele ser irrecuperable."},{"id":"w023","s":"belief","ch":"II.1","k":["c"],"zh":"获得的回报相等于支出，或者高于支出","en":"The return equals or exceeds the expenditure.","fr":"Le rendement est égal ou supérieur à la dépense.","es":"El rendimiento iguala o supera el gasto."},{"id":"w024","s":"belief","ch":"II.1","k":["u"],"zh":"目的就是考试，升级，拿到学位和证书，而且仅仅是为了这些","en":"The sole aim is to pass examinations, advance, and obtain degrees and certificates.","fr":"Le seul but est de réussir des examens, de progresser et d’obtenir des diplômes et des certificats.","es":"El único fin es aprobar exámenes, avanzar y obtener títulos y certificados."},{"id":"w025","s":"belief","ch":"II.2","k":["u"],"zh":"我们已经知道，哪些是最能够刺激群体想象力的东西，如暗示的力量，以及传染，尤其是以意象的形式。","en":"We already know what most strongly excites the imagination of crowds: the force of suggestion and contagion, especially when they take the form of images.","fr":"Nous savons déjà ce qui stimule le plus l’imagination des foules : la force de la suggestion et de la contagion, surtout sous forme d’images.","es":"Ya sabemos qué estimula con más fuerza la imaginación de las multitudes: la sugestión y el contagio, sobre todo cuando adoptan la forma de imágenes."},{"id":"w026","s":"belief","ch":"II.2","k":["u"],"zh":"词语的力量与他们所唤起的意象相关，完全独立于它们真正的意义。","en":"The power of words is linked to the images they evoke and is wholly independent of their true meaning.","fr":"La puissance des mots est liée aux images qu’ils évoquent et reste entièrement indépendante de leur sens véritable.","es":"El poder de las palabras está ligado a las imágenes que evocan y es totalmente independiente de su significado real.","n":{"zh":"FAKE","en":"FAKE","fr":"FAUX","es":"FALSO"}},{"id":"w027","s":"belief","ch":"II.2","k":["c"],"zh":"理性和论证，面对一些词语和口号，是无能为力的。","en":"Reason and argument are powerless against certain words and slogans.","fr":"La raison et l’argumentation sont impuissantes face à certains mots et slogans.","es":"La razón y los argumentos son impotentes ante ciertas palabras y consignas."},{"id":"w028","s":"belief","ch":"II.2","k":["b"],"zh":"因此，词语只拥有流动的、过渡性的意义，从一个时代到另一个时代，一个民族到另一个民族，意义都会产生变化。","en":"Words thus have only shifting, temporary meanings: their meaning changes from one age or people to another.","fr":"Les mots n’ont donc qu’un sens mouvant et provisoire : il change d’une époque ou d’un peuple à l’autre.","es":"Las palabras solo tienen significados cambiantes y transitorios: estos varían de una época o de un pueblo a otro."},{"id":"w029","s":"belief","ch":"II.2","k":["u"],"zh":"词语的力量是如此之大，只需要一些选择得当的词语，就可以让人接受最可恶的事情。","en":"Words are so powerful that a few well-chosen ones can make people accept the most hateful things.","fr":"Les mots sont si puissants que quelques mots bien choisis peuvent faire accepter les choses les plus odieuses.","es":"Las palabras son tan poderosas que unas pocas bien elegidas pueden hacer que se acepten las cosas más odiosas.","n":{"zh":"待確認","en":"Handwriting to confirm","fr":"Annotation manuscrite à confirmer","es":"Nota manuscrita por confirmar"}},{"id":"w030","s":"belief","ch":"II.2","k":["c"],"zh":"比方说，今天用得如此普遍的“民主”和“社会主义”二词。","en":"Take, for example, the words “democracy” and “socialism,” so widely used today.","fr":"Prenons, par exemple, les mots « démocratie » et « socialisme », si répandus aujourd’hui.","es":"Tomemos, por ejemplo, las palabras «democracia» y «socialismo», tan usadas hoy.","n":{"zh":"中国二者都无。","en":"China has neither.","fr":"La Chine n’a ni l’un ni l’autre.","es":"China no tiene ninguna de las dos."}},{"id":"w031","s":"belief","ch":"II.2","k":["c"],"zh":"在这些被送进了坟墓的幻想后面，他们看到的，是自然的盲目力量","en":"Behind those illusions laid in the grave, they saw nature’s blind forces.","fr":"Derrière ces illusions mises au tombeau, ils ont vu les forces aveugles de la nature.","es":"Detrás de esas ilusiones sepultadas, vieron las fuerzas ciegas de la naturaleza."},{"id":"w032","s":"belief","ch":"II.2","k":["c"],"zh":"人民演变的伟大动因，从来都不是真理，而是谬误。","en":"The great drivers of a people’s evolution have never been truth but error.","fr":"Les grands moteurs de l’évolution d’un peuple n’ont jamais été la vérité, mais l’erreur.","es":"Los grandes motores de la evolución de un pueblo nunca han sido la verdad, sino el error."},{"id":"w033","s":"belief","ch":"II.2","k":["u"],"zh":"我们已经证明，群体是不受逻辑推理影响的","en":"We have already shown that crowds are not swayed by logical reasoning.","fr":"Nous avons déjà montré que les foules ne sont pas sensibles au raisonnement logique.","es":"Ya hemos mostrado que las multitudes no se dejan influir por el razonamiento lógico."},{"id":"w034","s":"belief","ch":"II.2","k":["u"],"zh":"可以肯定的是，人类的理性，没有能够像幻想一样，带着激情和勇敢，引领人类走上文明之路。","en":"What is certain is that human reason has not been able, as imagination has, to lead humanity toward civilization with passion and courage.","fr":"Ce qui est certain, c’est que la raison humaine n’a pas su, comme l’imagination, conduire l’humanité vers la civilisation avec passion et courage.","es":"Lo cierto es que la razón humana no ha logrado, como la imaginación, conducir a la humanidad hacia la civilización con pasión y valentía.","n":{"zh":"待確認","en":"Handwriting to confirm","fr":"Annotation manuscrite à confirmer","es":"Nota manuscrita por confirmar"}},{"id":"w035","s":"belief","ch":"II.2","k":["u"],"zh":"有时候，人民所遵循的，是一种隐秘的力量；正是类似的力量，让一颗橡果变成了橡树，让彗星沿着它的轨道运行。","en":"At times, people follow a hidden force, like the force that turns an acorn into an oak and keeps a comet on its course.","fr":"Parfois, les peuples suivent une force cachée, semblable à celle qui transforme un gland en chêne et maintient une comète sur son orbite.","es":"A veces, los pueblos siguen una fuerza oculta, semejante a la que convierte una bellota en roble y mantiene a un cometa en su órbita.","n":{"zh":"待確認","en":"Handwriting to confirm","fr":"Annotation manuscrite à confirmer","es":"Nota manuscrita por confirmar"}},{"id":"w036","s":"belief","ch":"II.3","k":["c"],"zh":"一旦一定数量的生灵聚集到了一起，无论是一群动物，还是一群人，都会本能地把自己放置到一个领袖的威权之下，也就是服从一个领袖。","en":"Once a certain number of beings gather, whether animals or people, they instinctively place themselves under the authority of a leader and obey that leader.","fr":"Dès qu’un certain nombre d’êtres se réunissent, qu’il s’agisse d’animaux ou d’humains, ils se placent instinctivement sous l’autorité d’un chef et lui obéissent.","es":"Una vez que se reúne cierto número de seres, sean animales o personas, se ponen instintivamente bajo la autoridad de un líder y lo obedecen."},{"id":"w037","s":"belief","ch":"II.3","k":["c"],"zh":"信念的强度，给了他们的话语一种强大的暗示能力。","en":"The strength of their conviction gives their words a powerful suggestive force.","fr":"La force de leur conviction confère à leurs paroles un grand pouvoir de suggestion.","es":"La fuerza de su convicción confiere a sus palabras un gran poder de sugestión.","n":{"zh":"待確認","en":"Handwriting to confirm","fr":"Annotation manuscrite à confirmer","es":"Nota manuscrita por confirmar"}},{"id":"w038","s":"belief","ch":"II.3","k":["c"],"zh":"在人类所拥有的所有力量中，信念一直都是最伟大的之一。","en":"Among all the powers humanity possesses, conviction has always been one of the greatest.","fr":"Parmi toutes les forces dont dispose l’humanité, la conviction a toujours été l’une des plus grandes.","es":"Entre todas las fuerzas de que dispone la humanidad, la convicción siempre ha sido una de las mayores.","n":{"zh":"自己要无比相信。","en":"You have to believe it completely yourself.","fr":"Il faut y croire soi-même sans réserve.","es":"Uno mismo tiene que creerlo plenamente."}},{"id":"w039","s":"belief","ch":"II.3","k":["u"],"zh":"历史上的一些伟大事件，经常就是被一些只知道自己的信念的盲目信徒所完成的。","en":"Some great events in history were accomplished by blind believers who knew only their own convictions.","fr":"Certains grands événements de l’histoire ont été accomplis par des croyants aveugles qui ne connaissaient que leurs propres convictions.","es":"Algunos grandes acontecimientos históricos fueron obra de creyentes ciegos que solo conocían sus propias convicciones."},{"id":"w040","s":"belief","ch":"II.3","k":["u"],"zh":"但是，这些领袖虽然精力过人，却并不持续，随着刺激群体的东西消失而消失。","en":"However energetic these leaders are, they do not last: they disappear when whatever stirred the crowd fades.","fr":"Si énergiques que soient ces chefs, ils ne durent pas : ils disparaissent quand s’éteint ce qui stimulait la foule.","es":"Por muy enérgicos que sean estos líderes, no perduran: desaparecen cuando se extingue aquello que excitaba a la multitud."},{"id":"w041","s":"belief","ch":"II.3","k":["u"],"zh":"无论他们是聪明的，还是愚笨的，都没有关系，世界永远属于他们。","en":"Whether they are clever or foolish makes no difference; the world always belongs to them.","fr":"Qu’ils soient intelligents ou stupides importe peu ; le monde leur appartient toujours.","es":"Que sean inteligentes o necios da igual; el mundo siempre les pertenece.","n":{"zh":"章北海","en":"Zhang Beihai","fr":"Zhang Beihai","es":"Zhang Beihai"}},{"id":"w042","s":"belief","ch":"II.3","k":["c"],"zh":"在一本讲述所有这些伟大的领袖的书里面，只会有少数几个名字，但是，这些名字总是出现在文明和历史的最重要的事件的顶端。","en":"A book about all these great leaders would contain only a few names, but those names always stand at the head of the most important events in civilization and history.","fr":"Un livre consacré à tous ces grands chefs ne contiendrait que quelques noms, mais ces noms figureraient toujours au premier plan des événements les plus importants de la civilisation et de l’histoire.","es":"Un libro sobre todos estos grandes líderes contendría apenas unos pocos nombres, pero esos nombres siempre encabezarían los acontecimientos más importantes de la civilización y de la historia.","n":{"zh":"待確認","en":"Handwriting to confirm","fr":"Annotation manuscrite à confirmer","es":"Nota manuscrita por confirmar"}},{"id":"w043","s":"belief","ch":"II.3","k":["b"],"zh":"简单、纯粹的断言，摆脱一切的逻辑推理和证据，是让一种观念渗透群体脑海的有效手段。","en":"Simple, unqualified assertion, free of reasoning and evidence, is an effective way to plant an idea in a crowd’s mind.","fr":"L’affirmation simple et pure, dépourvue de raisonnement et de preuves, est un moyen efficace de faire pénétrer une idée dans l’esprit d’une foule.","es":"La afirmación simple y tajante, sin razonamientos ni pruebas, es un medio eficaz para introducir una idea en la mente de una multitud."},{"id":"w044","s":"belief","ch":"II.3","k":["u"],"zh":"在同一份报纸上，重复地看到，A先生是一个不折不扣的无赖，B先生是一个非常诚实的好人，我们最后也就确信这一点，当然，前提是我们不去经常读另外一家意见对立的报纸，那样的话，同样的定义就被反过来用了。","en":"If the same newspaper repeatedly tells us that Mr. A is a scoundrel and Mr. B an honest man, we eventually believe it—unless we regularly read a rival paper, where the labels are reversed.","fr":"Si le même journal répète que M. A est un vaurien et M. B un honnête homme, nous finissons par le croire — à moins de lire régulièrement un journal d’opinion opposée, où les qualificatifs sont inversés.","es":"Si el mismo periódico repite que el señor A es un canalla y el señor B un hombre honrado, terminamos creyéndolo, salvo que leamos con frecuencia otro periódico de opinión contraria, donde las etiquetas se invierten."},{"id":"w045","s":"belief","ch":"II.3","k":["c"],"zh":"正是出于这一原因，一些过于超越时代的人，基本上对那个时代没有任何影响。","en":"For this very reason, people far ahead of their time have almost no influence on it.","fr":"C’est précisément pourquoi les personnes trop en avance sur leur temps n’exercent presque aucune influence sur leur époque.","es":"Precisamente por eso, las personas demasiado adelantadas a su tiempo casi no influyen en su época.","n":{"zh":"待確認","en":"Handwriting to confirm","fr":"Annotation manuscrite à confirmer","es":"Nota manuscrita por confirmar"}},{"id":"w046","s":"belief","ch":"II.3","k":["u"],"zh":"仅仅因为一个人占着某个位置，拥有一定的财富，有一些头衔，他就带上了威望的光环，即便他没有太多的个人价值。一个穿上了制服的军人，一个披上了红袍的法官，总是有他的威望。","en":"Simply by occupying a position, possessing some wealth, or holding certain titles, a person acquires an aura of prestige, even without much personal worth. A soldier in uniform and a judge in a red robe always have prestige.","fr":"Il suffit d’occuper une fonction, de posséder une certaine fortune ou de porter quelques titres pour acquérir une aura de prestige, même sans grande valeur personnelle. Un soldat en uniforme et un juge en robe rouge jouissent toujours de prestige.","es":"Basta con ocupar un puesto, poseer cierta riqueza o tener algunos títulos para adquirir un aura de prestigio, aunque se tenga poco valor personal. Un soldado uniformado y un juez con toga roja siempre gozan de prestigio."},{"id":"w047","s":"belief","ch":"II.3","k":["c"],"zh":"威望的特点，就是阻止人们如实地去看一样东西，就是让我们的判断力瘫痪。群体总是需要现成的意见，个体则经常需要现成的意见。这些意见受欢迎，跟它们含多少真理或谬误无关；只因为有威望，才受欢迎。","en":"The mark of prestige is that it prevents us from seeing things as they are and paralyzes our judgment. Crowds always need ready-made opinions, and individuals often do too. Such opinions are welcomed regardless of how much truth or error they contain; they are welcomed simply because they have prestige.","fr":"Le prestige a ceci de particulier qu’il nous empêche de voir les choses telles qu’elles sont et paralyse notre jugement. Les foules ont toujours besoin d’opinions toutes faites, et les individus aussi en ont souvent besoin. Ces opinions sont accueillies quelle que soit la part de vérité ou d’erreur qu’elles contiennent ; elles le sont uniquement parce qu’elles jouissent de prestige.","es":"El prestigio tiene la particularidad de impedirnos ver las cosas como son y de paralizar nuestro juicio. Las multitudes siempre necesitan opiniones hechas, y los individuos también las necesitan con frecuencia. Esas opiniones son bien recibidas sin importar cuánta verdad o error contengan; se aceptan solo porque gozan de prestigio."},{"id":"w048","s":"belief","ch":"II.3","k":["u"],"zh":"在他去世之后，他的声望依然存在，不减反增。","en":"After his death, his reputation endured and even grew.","fr":"Après sa mort, sa renommée subsista et grandit même.","es":"Después de su muerte, su fama perduró e incluso creció.","n":{"zh":"待確認","en":"Handwriting to confirm","fr":"Annotation manuscrite à confirmer","es":"Nota manuscrita por confirmar"}},{"id":"w049","s":"belief","ch":"II.3","k":["c"],"zh":"一个天才是不会过于谨慎的","en":"A genius cannot be too cautious.","fr":"Un génie ne saurait être trop prudent.","es":"Un genio nunca puede ser demasiado prudente.","n":{"zh":"待確認","en":"Handwriting to confirm","fr":"Annotation manuscrite à confirmer","es":"Nota manuscrita por confirmar"}},{"id":"w050","s":"belief","ch":"II.3","k":["u"],"zh":"具有威望的人、思想或事，会通过传染的途径马上被模仿，让整整一代人都接受一种感知方式和解释理论的方式。","en":"People, ideas, or things endowed with prestige are quickly imitated through contagion, leading a whole generation to adopt a way of seeing and explaining the world.","fr":"Les personnes, idées ou choses dotées de prestige sont vite imitées par contagion, amenant toute une génération à adopter une manière de percevoir et d’expliquer le monde.","es":"Las personas, ideas o cosas dotadas de prestigio se imitan rápidamente por contagio, y llevan a toda una generación a adoptar una forma de percibir y explicar el mundo."},{"id":"w051","s":"belief","ch":"II.3","k":["c"],"zh":"如前所述，不少元素可以成为威望得以产生的原因，而其中最重要的之一，就是成功。","en":"As noted, many factors can create prestige, but one of the most important is success.","fr":"Comme nous l’avons dit, de nombreux facteurs peuvent créer le prestige, mais l’un des plus importants est le succès.","es":"Como hemos dicho, muchos factores pueden generar prestigio, pero uno de los más importantes es el éxito.","n":{"zh":"待確認","en":"Handwriting to confirm","fr":"Annotation manuscrite à confirmer","es":"Nota manuscrita por confirmar"}},{"id":"w052","s":"belief","ch":"II.3","k":["u"],"zh":"威望一旦能够被讨论，就已经不再是威望。","en":"Once prestige can be debated, it is no longer prestige.","fr":"Dès que le prestige peut être discuté, il cesse d’être du prestige.","es":"En cuanto el prestigio puede discutirse, deja de ser prestigio.","n":{"zh":"待確認","en":"Handwriting to confirm","fr":"Annotation manuscrite à confirmer","es":"Nota manuscrita por confirmar"}},{"id":"w053","s":"belief","ch":"II.4","k":["c"],"zh":"革命的作用，就是把几乎已经被放弃的信仰完全摈弃，因为风俗的枷锁还阻碍着人们去完全抛弃它。","en":"Revolution’s role is to cast off a belief that has nearly been abandoned but that the restraints of custom still prevent people from discarding completely.","fr":"Le rôle de la révolution est de rejeter une croyance presque abandonnée, mais que le poids des coutumes empêche encore d’écarter tout à fait.","es":"El papel de la revolución es desechar una creencia casi abandonada que las ataduras de la costumbre aún impiden abandonar por completo."},{"id":"w054","s":"belief","ch":"II.4","k":["u"],"zh":"正是为了奠定或者维持一些普遍的信仰，中世纪才架起了那么多的火刑柱。","en":"It was to establish or preserve certain general beliefs that the Middle Ages erected so many stakes.","fr":"C’est pour établir ou maintenir certaines croyances générales que le Moyen Âge dressa tant de bûchers.","es":"Fue para establecer o mantener ciertas creencias generales por lo que la Edad Media levantó tantas hogueras."},{"id":"w055","s":"belief","ch":"II.4","k":["c"],"zh":"一切与普遍信仰和种族的情感相违背的，都只持续了很短的时间，被改了航道的河流很快就继续自己的流动路线。","en":"Anything contrary to general beliefs or the feelings of a people lasts only briefly; a diverted river soon resumes its course.","fr":"Tout ce qui contredit les croyances générales ou les sentiments d’un peuple ne dure que peu ; un fleuve détourné reprend vite son cours.","es":"Todo lo que contradice las creencias generales o los sentimientos de un pueblo dura poco; un río desviado pronto recupera su cauce."},{"id":"w056","s":"belief","ch":"II.4","k":["c"],"zh":"假如有一种舆论可以拥有足够的威望而让所有人接受，那么，它很快就会具有一种独裁的力量，一切都只能在它面前折腰。","en":"If an opinion gains enough prestige to be accepted by everyone, it will soon acquire a dictatorial force before which all must bow.","fr":"Si une opinion acquiert assez de prestige pour être acceptée par tous, elle aura bientôt une force dictatoriale devant laquelle tout devra plier.","es":"Si una opinión adquiere suficiente prestigio para que todos la acepten, pronto tendrá una fuerza dictatorial ante la cual todo deberá doblegarse."},{"id":"w057","s":"forms","ch":"III.1","k":["c"],"zh":"我们已经看到，到了群体中，智力不起任何作用，只有一些无意识的情感可以起作用。","en":"We have seen that in a crowd intelligence has no effect; only certain unconscious feelings can act.","fr":"Nous avons vu que, dans une foule, l’intelligence n’agit pas ; seuls certains sentiments inconscients peuvent agir.","es":"Hemos visto que, en una multitud, la inteligencia no influye; solo pueden actuar ciertos sentimientos inconscientes."},{"id":"w058","s":"forms","ch":"III.1","k":["c"],"zh":"派别由教育、职业和环境常常大相径庭的人组成，只被同一种信仰联系在一起；等级集团只包括同一职业的人群，因此，教育和环境也大致相同。","en":"A sect joins people whose education, occupations, and surroundings may be very different through a common belief; a caste contains people of one occupation, whose education and surroundings are therefore broadly alike.","fr":"Une secte réunit, par une même croyance, des personnes dont l’éducation, la profession et le milieu diffèrent souvent beaucoup ; une caste ne rassemble que des gens d’un même métier, dont l’éducation et le milieu sont donc assez semblables.","es":"Una secta reúne, por una creencia común, a personas de educación, profesión y entorno muy distintos; una casta solo incluye a personas de una misma profesión, cuya educación y entorno son por ello bastante similares."},{"id":"w059","s":"forms","ch":"III.2","k":["c"],"zh":"群体的罪行一般源于强大的暗示，之后，所有参与的人都会相信自己是在完成一种职责。","en":"A crowd’s crimes generally arise from powerful suggestion; afterward, everyone involved believes they were fulfilling a duty.","fr":"Les crimes d’une foule naissent généralement d’une forte suggestion ; ensuite, tous ceux qui y ont pris part croient avoir accompli un devoir.","es":"Los crímenes de una multitud suelen nacer de una fuerte sugestión; después, todos los participantes creen haber cumplido un deber."},{"id":"w060","s":"forms","ch":"III.2","k":["u"],"zh":"杀人者还都很自律，显示出我们提到过的群体所拥有的道德品行","en":"The killers were disciplined too, displaying the moral qualities we have ascribed to crowds.","fr":"Les tueurs étaient eux aussi disciplinés, manifestant les qualités morales que nous avons attribuées aux foules.","es":"Los asesinos también eran disciplinados y mostraban las cualidades morales que hemos atribuido a las multitudes."},{"id":"w061","s":"forms","ch":"III.2","k":["c"],"zh":"于是，所有人都被杀死了，包括五十多个12到17岁的孩子。","en":"So everyone was killed, including more than fifty children aged twelve to seventeen.","fr":"Ainsi, tout le monde fut tué, y compris plus de cinquante enfants âgés de douze à dix-sept ans.","es":"Así murieron todos, incluidos más de cincuenta niños de entre doce y diecisiete años.","n":{"zh":"失去理性，全是混乱","en":"Without reason, everything is chaos.","fr":"Sans raison, tout est chaos.","es":"Sin razón, todo es caos."}},{"id":"w062","s":"forms","ch":"III.3","k":["c"],"zh":"因此，陪审团的精神一直没有改变：他们做出的判决是一模一样的。","en":"Thus, the spirit of the jury remained unchanged: its verdicts were exactly the same.","fr":"Ainsi, l’esprit du jury n’avait pas changé : ses verdicts étaient exactement les mêmes.","es":"Así, el espíritu del jurado no había cambiado: sus veredictos eran exactamente los mismos."},{"id":"w063","s":"forms","ch":"III.3","k":["u"],"zh":"演说家无须改变所有陪审团成员的意见，仅需争取那些能够决定普遍意见的领头人。","en":"A speaker need not change every juror’s mind, only win over the leaders who shape the prevailing opinion.","fr":"Un orateur n’a pas besoin de changer l’avis de tous les jurés, mais seulement de rallier les meneurs qui déterminent l’opinion dominante.","es":"Un orador no necesita cambiar la opinión de todos los jurados, sino ganarse a los líderes que determinan la opinión dominante."},{"id":"w064","s":"forms","ch":"III.3","k":["u"],"zh":"“我们知道，在刑事法庭上陈述自己的辩护词的时候，拉修的眼睛一直不离开两到三个他认为有影响力的、但很难对付的陪审团成员。","en":"During his defense in criminal court, Lachaud kept his eyes on the two or three jurors he considered influential but hard to convince.","fr":"Pendant sa plaidoirie au tribunal criminel, Lachaud ne quittait pas des yeux les deux ou trois jurés qu’il jugeait influents, mais difficiles à convaincre.","es":"Durante su defensa ante el tribunal penal, Lachaud no apartaba los ojos de los dos o tres jurados que consideraba influyentes, pero difíciles de convencer."},{"id":"w065","s":"forms","ch":"III.4","k":["c"],"zh":"选民需要看到他的贪婪和虚荣得到满足；候选人必须对他进行最不可思议的献媚，毫不犹豫地对他做一些根本不可能的许诺。","en":"Voters want their greed and vanity gratified; candidates must flatter them extravagantly and readily make promises they cannot possibly keep.","fr":"Les électeurs veulent que leur avidité et leur vanité soient satisfaites ; les candidats doivent les flatter sans mesure et leur faire sans hésiter des promesses impossibles à tenir.","es":"Los votantes quieren ver satisfechas su codicia y su vanidad; los candidatos deben halagarlos sin medida y hacer sin vacilar promesas imposibles de cumplir."},{"id":"w066","s":"forms","ch":"III.4","k":["c"],"zh":"在所有匿名的聚会中，即便由清一色的文化人组成，讨论也可以很快就变成同样的情形。","en":"At any anonymous gathering, even one made up entirely of educated people, discussion can quickly take the same turn.","fr":"Dans toute réunion anonyme, même composée uniquement de personnes cultivées, la discussion peut vite prendre la même tournure.","es":"En cualquier reunión anónima, incluso si solo participan personas cultas, la discusión puede tomar rápidamente el mismo rumbo.","n":{"zh":"待確認","en":"Handwriting to confirm","fr":"Annotation manuscrite à confirmer","es":"Nota manuscrita por confirmar"}},{"id":"w067","s":"forms","ch":"III.4","k":["c"],"zh":"全民普选的缺陷自然是太明显了，所以不可能看不到。","en":"The defects of universal suffrage are so obvious that they cannot go unnoticed.","fr":"Les défauts du suffrage universel sont si manifestes qu’on ne peut pas ne pas les voir.","es":"Los defectos del sufragio universal son tan evidentes que no pueden pasar desapercibidos.","n":{"zh":"待確認","en":"Handwriting to confirm","fr":"Annotation manuscrite à confirmer","es":"Nota manuscrita por confirmar"}},{"id":"w068","s":"forms","ch":"III.4","k":["c"],"zh":"因为他们无法不相信，既然每个人都有着同样的见识，真理一定是在多数人那里的。","en":"They cannot help believing that, since everyone has the same knowledge, truth must lie with the majority.","fr":"Ils ne peuvent s’empêcher de croire que, puisque tous ont les mêmes connaissances, la vérité se trouve nécessairement du côté de la majorité.","es":"No pueden evitar creer que, como todos poseen los mismos conocimientos, la verdad debe estar del lado de la mayoría."},{"id":"w069","s":"forms","ch":"III.4","k":["u"],"zh":"相反，还会出现因为等级集团而带来的严重问题。","en":"On the contrary, serious problems caused by castes would arise as well.","fr":"Au contraire, de graves problèmes dus aux castes surgiraient aussi.","es":"Por el contrario, surgirían también graves problemas causados por las castas.","n":{"zh":"人民代表大会","en":"People’s Congress","fr":"Assemblée populaire","es":"Asamblea Popular"}},{"id":"w070","s":"forms","ch":"III.5","k":["c"],"zh":"而且，议会制度综合了所有现代文明民族的理想。","en":"Moreover, the parliamentary system embodies the ideals of all modern civilized peoples.","fr":"De plus, le système parlementaire incarne les idéaux de tous les peuples civilisés modernes.","es":"Además, el sistema parlamentario encarna los ideales de todos los pueblos civilizados modernos."},{"id":"w071","s":"forms","ch":"III.5","k":["c"],"zh":"一个议会的投票，往往只代表了一小部分人的意见。","en":"A parliamentary vote often represents the opinion of only a small fraction of its members.","fr":"Un vote parlementaire ne représente souvent que l’opinion d’une petite partie de ses membres.","es":"Una votación parlamentaria suele representar la opinión de solo una pequeña parte de sus miembros."},{"id":"w072","s":"forms","ch":"III.5","k":["u"],"zh":"这样的口才，我们在所有的议会中都可以看到，包括最冷静的英国议会。","en":"Such eloquence can be seen in every parliament, including the calmest British one.","fr":"On retrouve une telle éloquence dans tous les parlements, même dans le très calme Parlement britannique.","es":"Esta elocuencia puede verse en todos los parlamentos, incluso en el sereno Parlamento británico."},{"id":"w073","s":"forms","ch":"III.5","k":["c"],"zh":"智力能够让人宽容，将使徒必须有的信仰的强度和烈度减弱，因为它会去解释事物的复杂性，可以帮助解释，让人理解。","en":"Intelligence can make a person tolerant, weakening the strength and intensity of faith that an apostle must possess, because it explains the complexity of things and helps people understand them.","fr":"L’intelligence peut rendre quelqu’un tolérant et affaiblir la force et l’ardeur de la foi nécessaire à un apôtre, car elle explique la complexité des choses et aide à les comprendre.","es":"La inteligencia puede volver tolerante a una persona y debilitar la fuerza y el ardor de la fe que necesita un apóstol, porque explica la complejidad de las cosas y ayuda a comprenderlas.","n":{"zh":"你这本书不也是吗？","en":"Doesn’t your own book do this too?","fr":"Votre propre livre ne fait-il pas la même chose ?","es":"¿Acaso tu propio libro no hace lo mismo?"}},{"id":"w074","s":"forms","ch":"III.5","k":["c"],"zh":"群体本能地在这些精力充沛的坚定信念者身上，看到了自己所需的主人。","en":"Crowds instinctively see in these energetic and firmly convinced people the master they need.","fr":"Les foules voient instinctivement, dans ces personnes énergiques aux convictions fermes, le maître dont elles ont besoin.","es":"Las multitudes ven instintivamente en estas personas enérgicas y de firmes convicciones al amo que necesitan.","n":{"zh":"坚定信念是关键","en":"Firm conviction is the key.","fr":"La conviction ferme est la clé.","es":"La convicción firme es la clave."}},{"id":"w075","s":"forms","ch":"III.5","k":["c"],"zh":"个体不再是自己","en":"The individual is no longer themselves.","fr":"L’individu n’est plus lui-même.","es":"El individuo ya no es él mismo.","n":{"zh":"待確認","en":"Handwriting to confirm","fr":"Annotation manuscrite à confirmer","es":"Nota manuscrita por confirmar"}},{"id":"w076","s":"forms","ch":"III.5","k":["c"],"zh":"他们有着临时的凝聚力，英雄主义，脆弱，冲动和暴力。","en":"They possess a temporary cohesion, heroism, fragility, impulsiveness, and violence.","fr":"Ils possèdent une cohésion passagère, de l’héroïsme, de la fragilité, de l’impulsivité et de la violence.","es":"Poseen una cohesión pasajera, heroísmo, fragilidad, impulsividad y violencia."},{"id":"w077","s":"forms","ch":"III.5","k":["c"],"zh":"追随一个理想，从野蛮走向文明；然后，一旦这个理想失去了它的力量，就开始败落，消亡—这就是一个民族的生命历程。","en":"A people follows an ideal from savagery to civilization; then, once that ideal loses its force, it declines and disappears—such is the life cycle of a people.","fr":"Un peuple suit un idéal, passe de la barbarie à la civilisation ; puis, lorsque cet idéal perd sa force, il décline et disparaît — tel est le cycle de vie d’un peuple.","es":"Un pueblo sigue un ideal y pasa de la barbarie a la civilización; luego, cuando ese ideal pierde fuerza, decae y desaparece: así es el ciclo vital de un pueblo.","n":{"zh":"盲从。","en":"Blind conformity.","fr":"Suivisme aveugle.","es":"Seguidismo ciego."}}];

/* ============================================================
   Likes + moderated comments — same Worker as the other notes.
   Leaving the placeholder (or '') renders the page without any
   interactive parts; the notes themselves still work offline.
   ============================================================ */
const API = 'https://reading-notes-api.YOUR-SUBDOMAIN.workers.dev';
const PAGE_ID = 'wuhezhizhong';
const API_ON = /^https?:\/\//.test(API) && !API.includes('YOUR-SUBDOMAIN');

UI.pref = {en:'preface', zh:'自序', fr:'préface', es:'prefacio'};
UI.modNote = {
  en:'Anyone may like a passage or leave a comment on it. Likes appear at once; comments are read and approved by me before they are shown.',
  zh:'任何人都可以给某一条点讚或留言。点讚即时生效；留言经我阅读并审核通过后才会显示。',
  fr:'Chacun peut aimer un passage ou y laisser un commentaire. Les « j’aime » apparaissent aussitôt ; les commentaires sont lus et validés par moi avant d’être affichés.',
  es:'Cualquiera puede dar «me gusta» a un pasaje o dejar un comentario. Los «me gusta» aparecen al instante; los comentarios los leo y apruebo yo antes de mostrarse.'
};
UI.like     = {en:'Like', zh:'点讚', fr:'J’aime', es:'Me gusta'};
UI.liked    = {en:'Liked', zh:'已讚', fr:'Aimé', es:'Te gusta'};
UI.cmt      = {en:'Comments', zh:'留言', fr:'Commentaires', es:'Comentarios'};
UI.cmtNone  = {en:'No comments on this passage yet.', zh:'这一条还没有留言。', fr:'Aucun commentaire sur ce passage.', es:'Aún no hay comentarios en este pasaje.'};
UI.fName    = {en:'Name or nickname', zh:'昵称', fr:'Nom ou pseudonyme', es:'Nombre o apodo'};
UI.fEmail   = {en:'Email — optional, never shown', zh:'邮箱 — 选填，不会公开', fr:'E-mail — facultatif, jamais affiché', es:'Correo — opcional, nunca se muestra'};
UI.fBody    = {en:'What this passage made you think…', zh:'这段让你想到了什么……', fr:'Ce que ce passage vous a inspiré…', es:'Qué te hizo pensar este pasaje…'};
UI.fSend    = {en:'Send for review', zh:'提交审核', fr:'Envoyer pour validation', es:'Enviar para revisión'};
UI.fSending = {en:'Sending…', zh:'提交中……', fr:'Envoi…', es:'Enviando…'};
UI.fQueued  = {en:'Thank you. Your comment is in the review queue and will appear here once approved.', zh:'谢谢。留言已进入审核队列，通过后会显示在这里。', fr:'Merci. Votre commentaire est en attente de validation et apparaîtra ici une fois approuvé.', es:'Gracias. Tu comentario está en la cola de revisión y aparecerá aquí una vez aprobado.'};
UI.fModNote = {en:'Moderated before publication. Your email is only visible to the site owner.', zh:'发布前需审核。邮箱仅站主可见。', fr:'Modéré avant publication. Votre e-mail n’est visible que par le propriétaire du site.', es:'Moderado antes de publicarse. Tu correo solo lo ve el propietario del sitio.'};
UI.errName  = {en:'Please enter a name.', zh:'请填昵称。', fr:'Veuillez indiquer un nom.', es:'Indica un nombre.'};
UI.errBody  = {en:'Please write something first.', zh:'请先写点什么。', fr:'Veuillez d’abord écrire quelque chose.', es:'Escribe algo primero.'};
UI.errRate  = {en:'That is a lot of comments for one hour — please come back later.', zh:'一小时内留言太多了，请稍后再来。', fr:'Cela fait beaucoup de commentaires en une heure — revenez plus tard.', es:'Son muchos comentarios en una hora; vuelve más tarde.'};
UI.errNet   = {en:'Could not send — please try again.', zh:'提交失败，请再试一次。', fr:'Envoi impossible — veuillez réessayer.', es:'No se pudo enviar; inténtalo de nuevo.'};

let lang = 'en';
try {
  const saved = localStorage.getItem('jg-lang');
  if (saved === 'zh' || saved === 'fr' || saved === 'es' || saved === 'en') lang = saved;
} catch (_) {}

let visitor = '';
try {
  visitor = localStorage.getItem('jg-visitor') || '';
  if (!/^[a-z0-9]{8,40}$/.test(visitor)) {
    visitor = Math.random().toString(36).slice(2, 12) + Date.now().toString(36);
    localStorage.setItem('jg-visitor', visitor);
  }
} catch (_) { visitor = 'anon' + Math.random().toString(36).slice(2, 10); }

let SOCIAL = null;          // {likes:{}, mine:[], comments:{}}
const OPEN = new Set();     // entry ids whose comment panel is expanded

const $ = (id) => document.getElementById(id);
const el = (tag, cls) => { const n = document.createElement(tag); if (cls) n.className = cls; return n; };
const LOCALE = {en:'en-GB', zh:'zh-CN', fr:'fr-FR', es:'es-ES'};

function pageChip(e){
  const n = el('span', 'page' + (e.a || e.np ? ' approx' : ''));
  n.textContent = e.np ? UI.pref[lang] : (e.a ? '≈ p.' : 'p.') + e.p;
  return n;
}

function heartSvg(){
  const s = document.createElementNS('http://www.w3.org/2000/svg','svg');
  s.setAttribute('viewBox','0 0 24 24'); s.setAttribute('class','heart'); s.setAttribute('aria-hidden','true');
  const path = document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('d','M12 20s-7-4.4-7-9.3A4.2 4.2 0 0 1 12 7.6a4.2 4.2 0 0 1 7 3.1C19 15.6 12 20 12 20Z');
  s.append(path); return s;
}

/* ---------------------------------------------------------------- comments */

function commentList(eid){
  const items = (SOCIAL && SOCIAL.comments[eid]) || [];
  if (!items.length){ const p = el('p','cnone'); p.textContent = UI.cmtNone[lang]; return p; }
  const ul = el('ul','clist');
  items.forEach(c => {
    const li = el('li','citem');
    const who = el('span','who'); who.textContent = c.name;
    const at = el('span','at');
    at.textContent = new Date(c.ts).toLocaleDateString(LOCALE[lang], {year:'numeric', month:'short', day:'numeric'});
    const body = el('p'); body.textContent = c.body;
    li.append(who, at, body); ul.append(li);
  });
  return ul;
}

function commentForm(eid){
  const form = el('form','cform');
  form.noValidate = true;
  const opened = Date.now();

  const two = el('div','two');
  const name = el('input'); name.type = 'text'; name.maxLength = 40;
  name.placeholder = UI.fName[lang]; name.autocomplete = 'nickname';
  const mail = el('input'); mail.type = 'email'; mail.maxLength = 120;
  mail.placeholder = UI.fEmail[lang]; mail.autocomplete = 'email';
  two.append(name, mail);

  const hp = el('input','hp'); hp.type = 'text'; hp.tabIndex = -1;
  hp.setAttribute('aria-hidden','true'); hp.autocomplete = 'off'; hp.name = 'website';

  const body = el('textarea'); body.maxLength = 1500; body.placeholder = UI.fBody[lang];
  const send = el('button','send'); send.type = 'submit'; send.textContent = UI.fSend[lang];
  const msg = el('p','cmsg');
  const note = el('p','cmoderation'); note.textContent = UI.fModNote[lang];

  form.append(two, hp, body, send, msg, note);

  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    msg.className = 'cmsg';
    if (!name.value.trim()){ msg.classList.add('bad'); msg.textContent = UI.errName[lang]; name.focus(); return; }
    if (body.value.trim().length < 2){ msg.classList.add('bad'); msg.textContent = UI.errBody[lang]; body.focus(); return; }
    send.disabled = true; send.textContent = UI.fSending[lang];
    try {
      const r = await fetch(API + '/v1/comment', {
        method:'POST', headers:{'content-type':'application/json'},
        body: JSON.stringify({
          page: PAGE_ID, entry: eid, visitor, lang,
          name: name.value, email: mail.value, body: body.value,
          website: hp.value, dwell: Date.now() - opened
        })
      });
      if (r.status === 429){ msg.classList.add('bad'); msg.textContent = UI.errRate[lang]; }
      else if (!r.ok){ msg.classList.add('bad'); msg.textContent = UI.errNet[lang]; }
      else {
        msg.classList.add('ok'); msg.textContent = UI.fQueued[lang];
        name.value = ''; mail.value = ''; body.value = '';
      }
    } catch (_) { msg.classList.add('bad'); msg.textContent = UI.errNet[lang]; }
    send.disabled = false; send.textContent = UI.fSend[lang];
  });

  return form;
}

function buildSocial(card, e){
  const eid = e.id;
  const row = el('div','social');

  const likeN = (SOCIAL && SOCIAL.likes[eid]) || 0;
  const mine = !!(SOCIAL && SOCIAL.mine.includes(eid));

  const likeBtn = el('button','likebtn' + (mine ? ' on' : ''));
  likeBtn.type = 'button';
  likeBtn.setAttribute('aria-pressed', String(mine));
  const likeLabel = el('span'); likeLabel.textContent = (mine ? UI.liked : UI.like)[lang];
  const likeCount = el('span','n'); likeCount.textContent = likeN ? ' ' + likeN : '';
  likeBtn.append(heartSvg(), likeLabel, likeCount);

  likeBtn.addEventListener('click', async () => {
    likeBtn.disabled = true;
    try {
      const r = await fetch(API + '/v1/like', {
        method:'POST', headers:{'content-type':'application/json'},
        body: JSON.stringify({page: PAGE_ID, entry: eid, visitor})
      });
      if (r.ok){
        const d = await r.json();
        SOCIAL.likes[eid] = d.count;
        if (d.liked){ if (!SOCIAL.mine.includes(eid)) SOCIAL.mine.push(eid); }
        else SOCIAL.mine = SOCIAL.mine.filter(x => x !== eid);
        likeBtn.classList.toggle('on', d.liked);
        likeBtn.setAttribute('aria-pressed', String(d.liked));
        likeLabel.textContent = (d.liked ? UI.liked : UI.like)[lang];
        likeCount.textContent = d.count ? ' ' + d.count : '';
      }
    } catch (_) {}
    likeBtn.disabled = false;
  });

  const nCmt = ((SOCIAL && SOCIAL.comments[eid]) || []).length;
  const cmtBtn = el('button','cmtbtn'); cmtBtn.type = 'button';
  cmtBtn.textContent = UI.cmt[lang] + (nCmt ? ' ' + nCmt : '');
  cmtBtn.setAttribute('aria-expanded', String(OPEN.has(eid)));

  row.append(likeBtn, cmtBtn);

  const panel = el('div','cpanel');
  panel.hidden = !OPEN.has(eid);
  if (OPEN.has(eid)) panel.append(commentList(eid), commentForm(eid));

  cmtBtn.addEventListener('click', () => {
    const open = panel.hidden;
    panel.hidden = !open;
    cmtBtn.setAttribute('aria-expanded', String(open));
    if (open){
      OPEN.add(eid);
      if (!panel.childElementCount) panel.append(commentList(eid), commentForm(eid));
    } else OPEN.delete(eid);
  });

  card.append(row, panel);
}

function mountSocial(){
  if (!API_ON || !SOCIAL) return;
  document.querySelectorAll('.entry').forEach(card => {
    if (card.querySelector('.social')) return;
    const e = ENTRIES.find(x => x.id === card.dataset.eid);
    if (e) buildSocial(card, e);
  });
}

async function loadSocial(){
  if (!API_ON) return;
  try {
    const r = await fetch(API + '/v1/state?page=' + encodeURIComponent(PAGE_ID) + '&visitor=' + encodeURIComponent(visitor));
    if (!r.ok) return;
    const d = await r.json();
    SOCIAL = {likes: d.likes || {}, mine: d.mine || [], comments: d.comments || {}};
    const n = $('modnote');
    if (n){ n.hidden = false; n.querySelector('span').textContent = UI.modNote[lang]; }
    mountSocial();
  } catch (_) { /* offline or not deployed yet — page stays static */ }
}

/* ------------------------------------------------------------------ render */

function renderEntry(e){
  const card = el('article','entry');
  card.dataset.eid = e.id;
  const top = el('div','entry-top');
  const chapter = el('span','page'); chapter.textContent = e.ch; top.append(chapter);
  (e.k || []).forEach(code => {
    const c = el('span','kind'); c.textContent = UI.kinds[code][lang];
    top.append(c);
  });
  card.append(top);

  const q = el('blockquote', lang === 'zh' ? '' : 'latin');
  q.textContent = e[lang];
  card.append(q);

  if (lang !== 'zh') {
    const o = el('div','orig');
    const lab = el('p','orig-label'); lab.textContent = UI.orig[lang];
    const t = el('p'); t.textContent = e.zh;
    o.append(lab, t); card.append(o);
  }

  if (e.n) {
    const m = el('p','mynote');
    const bl = el('b'); bl.textContent = UI.myNote[lang];
    m.append(bl, document.createTextNode(e.n[lang]));
    if (lang !== 'zh') { const oz = el('span','note-orig'); oz.textContent = e.n.zh; m.append(oz); }
    card.append(m);
  }

  return card;
}

let filter = 'all';

function renderMain(){
  const main = $('main'); main.replaceChildren();
  STORIES.forEach(st => {
    if (filter !== 'all' && filter !== st.id) return;
    const sec = el('section','story'); sec.dataset.s = st.id;
    const head = el('div','story-head');
    const h2 = el('h2','story-title'); h2.textContent = st.t[lang];
    head.append(h2);
    if (lang !== 'zh' && st.zh !== st.t[lang]) { const z = el('span','story-zh'); z.textContent = st.zh; head.append(z); }
    if (st.range) { const r = el('span','range'); r.textContent = st.range; head.append(r); }
    const sub = el('p','story-sub'); sub.textContent = st.s[lang];
    sec.append(head, sub);
    ENTRIES.filter(e => e.s === st.id).forEach(e => sec.append(renderEntry(e)));
    main.append(sec);
  });
  mountSocial();
}

function renderChrome(){
  document.documentElement.lang = (lang === 'zh' ? 'zh-Hans' : lang);
  $('backlink').textContent = UI.back[lang];
  $('eyebrow').textContent = UI.eyebrow[lang];
  $('booktitle').textContent = '《乌合之众》';
  $('byline').textContent = UI.byline[lang];

  const f = $('facts'); f.replaceChildren();
  UI.facts[lang].forEach(([b, t]) => {
    const li = el('li'); const strong = el('b'); strong.textContent = b;
    li.append(strong, document.createTextNode(' ' + t)); f.append(li);
  });

  $('prov-heading').textContent = UI.provHead[lang];
  $('prov-body').textContent = UI.provBody[lang];
  for (let i = 0; i < 4; i++){
    $('prov-k' + (i+1)).textContent = UI.provKeys[lang][i];
    $('prov-v' + (i+1)).innerHTML = UI.provVals[lang][i];
  }
  const mn = $('modnote');
  if (mn && SOCIAL) { mn.hidden = false; mn.querySelector('span').textContent = UI.modNote[lang]; }

  const fl = $('filters'); fl.replaceChildren();
  const mk = (id, label) => {
    const b = el('button'); b.type = 'button'; b.textContent = label;
    b.setAttribute('aria-pressed', String(filter === id));
    b.addEventListener('click', () => { filter = id; renderChrome(); renderMain(); window.scrollTo({top:0, behavior:'smooth'}); });
    fl.append(b);
  };
  mk('all', UI.all[lang]);
  STORIES.forEach(st => mk(st.id, st.t[lang]));

  $('signature').textContent = UI.sig[lang];

  document.querySelectorAll('.langbar button[data-l]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.l === lang)));
}

document.querySelectorAll('.langbar button[data-l]').forEach(b => {
  b.addEventListener('click', () => {
    lang = b.dataset.l;
    try { localStorage.setItem('jg-lang', lang); } catch (_) {}
    renderChrome(); renderMain();
  });
});

renderChrome();
renderMain();
loadSocial();
</script>
</body>
</html>
