<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#0e1624"/><rect x="28" y="28" width="1144" height="619" rx="12" fill="none" stroke="#31445b"/><g font-family="Consolas,monospace"><text x="65" y="90" font-size="15" letter-spacing="3" fill="#6be7e8">C# SOURCE / UNITY STUDY</text><text x="65" y="135" font-size="26" fill="#e9f0fa">CubeSpawer3.cs</text><text x="65" y="190" font-size="18" fill="#ccd8e7">    // 每帧都会调用一次 Update()</text><text x="65" y="220" font-size="18" fill="#ccd8e7">    void Update() {</text><text x="65" y="250" font-size="18" fill="#ccd8e7">        numCubes++;                              // 使立方体数目增加1</text><text x="65" y="280" font-size="18" fill="#ccd8e7">        GameObject gObj = Instantiate(cubePrefabVar) as GameObject;   // 实例化一个新的立方体</text><text x="65" y="310" font-size="18" fill="#ccd8e7">    </text><text x="65" y="340" font-size="18" fill="#ccd8e7">            gObj.name = &quot;Cube &quot; + numCubes;  // c</text><text x="65" y="370" font-size="18" fill="#ccd8e7">        Color c = new Color(Random.value, Random.value, Random.value);  // d</text><text x="65" y="400" font-size="18" fill="#ccd8e7">        gObj.GetComponent&lt;Renderer&gt;().material.color = c;  </text><text x="65" y="430" font-size="18" fill="#ccd8e7">        gObj.transform.position = Random.insideUnitSphere;  </text><text x="65" y="460" font-size="18" fill="#ccd8e7">        gameObjectList.Add(gObj);  </text><text x="65" y="490" font-size="18" fill="#ccd8e7"></text><text x="65" y="520" font-size="18" fill="#ccd8e7">        List&lt;GameObject&gt; removeList = new List&lt;GameObject&gt;();  </text><text x="65" y="550" font-size="18" fill="#ccd8e7"></text><text x="65" y="616" font-size="15" fill="#a3b1c7">Source excerpt · Hello World: Cube Spawner</text></g></svg>