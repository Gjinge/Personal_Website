<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#0e1624"/><rect x="28" y="28" width="1144" height="619" rx="12" fill="none" stroke="#31445b"/><g font-family="Consolas,monospace"><text x="65" y="90" font-size="15" letter-spacing="3" fill="#6be7e8">C# SOURCE / UNITY STUDY</text><text x="65" y="135" font-size="26" fill="#e9f0fa">Slingshot.cs</text><text x="65" y="190" font-size="18" fill="#ccd8e7">        float maxMagnitude = this.GetComponent&lt;SphereCollider&gt;().radius;</text><text x="65" y="220" font-size="18" fill="#ccd8e7">        if (mouseDelta.magnitude &gt; maxMagnitude)</text><text x="65" y="250" font-size="18" fill="#ccd8e7">        {</text><text x="65" y="280" font-size="18" fill="#ccd8e7">            mouseDelta.Normalize();</text><text x="65" y="310" font-size="18" fill="#ccd8e7">            mouseDelta *= maxMagnitude;</text><text x="65" y="340" font-size="18" fill="#ccd8e7">        }</text><text x="65" y="370" font-size="18" fill="#ccd8e7">        Vector3 projPos = lauchPos + mouseDelta;</text><text x="65" y="400" font-size="18" fill="#ccd8e7">        projectile.transform.position = projPos;</text><text x="65" y="430" font-size="18" fill="#ccd8e7">        if (Input.GetMouseButtonUp(0))</text><text x="65" y="460" font-size="18" fill="#ccd8e7">        {</text><text x="65" y="490" font-size="18" fill="#ccd8e7">            aimingMode = false;</text><text x="65" y="520" font-size="18" fill="#ccd8e7">            projectile.GetComponent&lt;Rigidbody&gt;().isKinematic = false;</text><text x="65" y="550" font-size="18" fill="#ccd8e7">            projectile.GetComponent&lt;Rigidbody&gt;().linearVelocity = -mouseDelta * velocityMult;</text><text x="65" y="616" font-size="15" fill="#a3b1c7">Source excerpt · Mission Demolition</text></g></svg>